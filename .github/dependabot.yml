version: 2
updates:
  # Yarn 1 classic workspaces (server, client-*, shared) all resolve from
  # the root yarn.lock — one root entry covers every workspace.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # NestJS majors must move together: @nestjs/platform-express 12 imports
      # `@nestjs/common/internal`, which only exists in common 12, so a lone
      # bump (PR #575) cannot build. One grouped PR = one deliberate upgrade.
      nestjs-major:
        patterns:
          - "@nestjs/*"
        update-types:
          - "major"
    # Other majors are left ungrouped so each gets its own PR and a real
    # review — see server/package.json for prior examples of majors needing
    # care (nodemailer ^6 -> ^9 in PR #59 needed usage verification, not just
    # a version bump).

  - package-ecosystem: "docker"
    directories: ["/", "/scripts/backup"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # docker-compose.yml image digests ([75.29]).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Rule: every third-party `uses:` is pinned to a full commit SHA with a
  # `# vX.Y.Z` comment, Dependabot bumps both together, and workflows never
  # persist credentials (`persist-credentials: false` on every checkout).
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/setup"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
