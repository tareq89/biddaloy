name: Nightly frontend flake hunt

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  repeat-frontend:
    name: Frontend suite x3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Same reason as ci.yml's frontend job: shared:node specs resolve
      # @biddaloy/shared through dist/index.js.
      - name: Build shared package
        run: yarn build:shared

      # Three consecutive full passes. vitest has no --repeat flag, and
      # --retry would hide exactly the flakes this job exists to surface,
      # so a plain loop it is. Any failing pass fails the job.
      - name: Frontend tests, three consecutive runs
        run: |
          for i in 1 2 3; do
            echo "=== pass $i/3 ==="
            yarn test:frontend --run
          done
