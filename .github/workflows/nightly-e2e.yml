name: Nightly cross-browser E2E

# Runs the full Playwright suite across all three engines every night.
# PRs and pushes to main stay chromium-only (ci.yml's e2e job) — see
# README.md's "E2E browser policy & sharding" section for the reasoning.
# Starts 90 minutes before nightly-frontend-flakes.yml's 22:30 cron so the
# two nightly jobs don't contend for runners — this one fans out to 9
# concurrent shards and can run ~15 minutes on a bad night.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

env:
  NODE_VERSION: "24"

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E (${{ matrix.browser }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # firefox/webkit are unproven at repo scale: a 9-test smoke-only probe
    # during #440's planning found no engine-specific failures, but never
    # touched the axe (96 tests), reflow (160 tests) or target-size (36
    # tests) suites. Run them nightly without failing the workflow, until a
    # follow-up issue triages and greens them — then delete this line.
    #
    # This MUST stay at job level, not on the "E2E tests" step. A
    # step-level continue-on-error leaves the step's *conclusion* as
    # success and never sets the job status to failure, so the two
    # `if: failure()` artifact uploads below would never fire and a red
    # webkit shard would upload nothing at all. At job level the job still
    # goes red (so the failure is visible in the run summary and the
    # uploads run), while the workflow overall stays green.
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    # Generous because this is a 21:00 cron nobody waits on, and because a
    # job-level timeout *cancels* the job — cancellation is not absorbed by
    # continue-on-error and skips the `failure()` uploads, so a timeout is
    # the one failure mode that yields no triage artifacts. The per-step
    # timeout below is the intended stop, this is only a backstop.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # Same 3-way within-browser sharding as ci.yml's e2e job (#440), but
      # all three engines instead of chromium only — this workflow is the
      # three-browser matrix's actual home now that E2E_BROWSERS_JSON is
      # (deliberately) left unset on PRs/pushes. Keep the shard count here
      # in lockstep with the `name:` above and the `--shard=N/3` flag below.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betonboi_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/betonboi_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-e2e-jwt-secret-do-not-use-in-production-1234567890
      NODE_ENV: test
      SEED_ADMIN_PASSWORD: ci-e2e-seed-password-123
      # Keeps playwright.config.ts's projects list consistent with the
      # --project flag this matrix entry passes.
      E2E_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        # webServer boots the real server/clients (yarn dev:*), which resolve
        # @biddaloy/shared through its package.json "main" (dist/index.js,
        # not src) — same reason ci.yml's e2e job builds this first.
        run: yarn build:shared

      # Mirrors ci.yml's e2e job: the package version drives the cache key,
      # so a Playwright bump misses the key and reinstalls. No
      # `restore-keys:` here either — see ci.yml's e2e job for why a prefix
      # match would restore stale version-stamped browser directories and
      # grow the cache entry on every bump.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser (${{ matrix.browser }})
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Run migrations
        run: yarn workspace @biddaloy/server migration:run

      - name: Seed database
        run: yarn workspace @biddaloy/server seed

      # No PWA/offline suite here — it's chromium-CDP-only by design
      # (see ci.yml's e2e job comment) and already runs on every PR, so
      # there's nothing cross-browser for it to add nightly.
      #
      # Bounded here rather than by the job timeout so that an overrunning
      # leg *fails* (absorbed by the job's continue-on-error, artifacts
      # still uploaded) instead of being cancelled with nothing to show.
      # 30 min is deliberately loose: on a first red night, Playwright's
      # default 30s per-test timeout plus `retries: 1` means a
      # timing-out test costs ~60s, so a shard full of them is slow in
      # exactly the situation where the report matters most.
      - name: E2E tests (${{ matrix.browser }} ${{ matrix.shard }}/3)
        timeout-minutes: 30
        run: yarn e2e --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
