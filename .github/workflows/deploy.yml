name: Deploy

# Runs biddaloy-deploy on the VM through a forced-command SSH key (D12, D21). The key can only
# run the forms biddaloy-deploy --from-github allows, and only for commits on main. No
# third-party actions are used (Rule 21).
#
# OWNER SETUP: DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_SSH_KNOWN_HOSTS must be secrets of the
# `production` Environment (Settings > Environments), and that environment must allow only the
# main branch as a deployment branch. Repository-level secrets would let any branch run this.
#
# Run it from main (the `production` environment allows only main), after the change is merged:
# the VM refuses any sha that is not an ancestor of origin/main. Branch shas deploy from the
# laptop with scripts/deploy.sh.
#
# Rule 13: the Actions log and summary show only the FAILED / Why / Next block, the skipped-smoke
# warning and the PLAY RECAP. The full ansible output stays on the VM in /opt/biddaloy/logs/<stack>-last-deploy.log.
on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to deploy
        type: choice
        required: true
        default: staging
        options: [staging, prod, demo, edge, ops]
      sha:
        description: Full 40-hex commit sha (empty = last staging-ok for prod, this ref's head otherwise)
        type: string
        required: false
      hotfix_reason:
        description: 'Hotfix reason (prod only, skips the staging-ok gate). Allowed: letters, digits, space and . , : _ / -'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - name: Deploy
        env:
          # Inputs and secrets only ever travel through env vars, never through ${{ }} in the script.
          STACK: ${{ inputs.stack }}
          SHA: ${{ inputs.sha }}
          HOTFIX: ${{ inputs.hotfix_reason }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          LC_ALL: C
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          # "--" ends ssh's options, so a command that starts with "--" is not read as one.
          ssh_vm() {
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
              -o ServerAliveInterval=30 -i ~/.ssh/deploy_key -- "deploy@$DEPLOY_HOST" "$1"
          }

          if [ -z "$SHA" ]; then
            if [ "$STACK" = prod ]; then
              SHA=$(ssh_vm "--last-ok staging")
            else
              SHA="$GITHUB_SHA"
            fi
          fi
          sha_re='^[0-9a-f]{40}$'
          if ! [[ $SHA =~ $sha_re ]]; then
            echo "FAILED at: resolve sha" >&2
            echo "Why: the sha is not a full lowercase 40-hex sha" >&2
            echo "Next: pass the full sha, or leave it empty" >&2
            exit 2
          fi
          cmd="$STACK $SHA"
          if [ -n "$HOTFIX" ]; then
            reason_re='^[A-Za-z0-9 .,:_/-]{3,200}$'
            if ! [[ $HOTFIX =~ $reason_re ]]; then
              echo "FAILED at: hotfix reason" >&2
              echo "Why: 3-200 characters of letters, digits, space . , : _ / - only" >&2
              echo "Next: reword the reason" >&2
              exit 2
            fi
            cmd="$cmd --hotfix \"$HOTFIX\""
          fi

          {
            echo "### Deploy $STACK"
            echo "sha: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

          rc=0
          ssh_vm "$cmd" > deploy.out 2>&1 || rc=$?
          {
            echo '```text'
            # Unanchored: ansible prints the block indented and quoted (result_format = yaml).
            grep -E -A2 'FAILED at:' deploy.out || true
            grep -E 'WARNING: smoke login' deploy.out || true
            grep -E -A8 '^PLAY RECAP' deploy.out || true
            if [ "$rc" -ne 0 ]; then echo "ssh exited $rc"; fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"
