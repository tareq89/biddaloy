name: Deploy

# Runs biddaloy-deploy on the VM through a forced-command SSH key (D12, D21). The key can only
# run the forms biddaloy-deploy --from-github allows. No third-party actions are used (Rule 21).
on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to deploy
        type: choice
        required: true
        default: staging
        options: [staging, prod, demo, edge, ops]
      sha:
        description: Full 40-hex commit sha (empty = last staging-ok for prod, this ref's head otherwise)
        type: string
        required: false
      hotfix_reason:
        description: 'Hotfix reason (prod only, skips the staging-ok gate). Allowed: letters, digits, space and . , : _ / -'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy
        env:
          # Inputs and secrets only ever travel through env vars, never through ${{ }} in the script.
          STACK: ${{ inputs.stack }}
          SHA: ${{ inputs.sha }}
          HOTFIX: ${{ inputs.hotfix_reason }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh_vm() {
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
              -o ServerAliveInterval=30 -i ~/.ssh/deploy_key "deploy@$DEPLOY_HOST" "$1"
          }

          if [ -z "$SHA" ]; then
            if [ "$STACK" = prod ]; then
              SHA=$(ssh_vm "--last-ok staging")
            else
              SHA="$GITHUB_SHA"
            fi
          fi
          if ! printf '%s' "$SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "FAILED at: resolve sha" >&2
            echo "Why: '$SHA' is not a full lowercase 40-hex sha" >&2
            echo "Next: pass the full sha, or leave it empty" >&2
            exit 2
          fi
          cmd="$STACK $SHA"
          if [ -n "$HOTFIX" ]; then
            if ! printf '%s' "$HOTFIX" | grep -Eqx '[A-Za-z0-9 .,:_/-]{3,200}'; then
              echo "FAILED at: hotfix reason" >&2
              echo "Why: 3-200 characters of letters, digits, space . , : _ / - only" >&2
              echo "Next: reword the reason" >&2
              exit 2
            fi
            cmd="$cmd --hotfix \"$HOTFIX\""
          fi

          {
            echo "### Deploy $STACK"
            echo "sha: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

          rc=0
          ssh_vm "$cmd" 2>&1 | tee deploy.out || rc=${PIPESTATUS[0]}
          {
            if [ "$rc" -ne 0 ]; then
              grep -A2 '^FAILED at:' deploy.out || echo "FAILED: ssh exited $rc"
            fi
            echo '```text'
            tail -n 40 deploy.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
