name: CI
# Editing a job? Mirror it in scripts/ci-local.sh (#152) — the script runs
# the same commands job-for-job so "works on my machine" stays true.

on:
  pull_request:
  push:
    branches: [main]
  # [18.4.1] Merge queue entries run the full gate plus the checks that are
  # otherwise nightly-only (route sweeps, PWA, Lighthouse) — a queue entry
  # is the last check before main, so it is the one place that can afford
  # (and should pay for) that cost. See the "sweeps"/"quality" jobs below.
  merge_group:
  workflow_dispatch:

env:
  NODE_VERSION: "24"

concurrency:
  group: ci-${{ github.ref }}
  # Guarded: cancel superseded PR pushes, but never a main run — the main
  # run is the only run that enforces frontend coverage thresholds.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Path-filter gate (#147): PRs skip jobs whose paths are untouched.
  # Push to main always runs everything — it's the merge gate, and
  # dorny diffs against the previous push there, which under-reports
  # on force-pushes.
  #
  # [18.4.1] `merge_group` runs everything too, unconditionally — a merge
  # queue entry has no single meaningful "previous ref" for dorny to diff
  # against (it's a synthetic merge commit against a moving queue base), so
  # rather than trust a possibly-wrong diff, `merge-queue` short-circuits
  # straight to "every area changed" and `filter` is skipped entirely.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.frontend }}
      server: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.server }}
      api-surface: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.api-surface }}
      ui: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.ui }}
      infra: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.infra }}
      landing: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'merge_group'
        id: filter
        with:
          filters: |
            # [18.1.1] Narrower than `frontend` below on purpose: Storybook
            # only builds `ui/`'s own stories, so a `client-admin`- or
            # `server`-only PR gets nothing from paying for it. `yarn.lock`
            # and `package.json` are still included — a dependency bump can
            # change what Storybook builds without touching `ui/**` itself.
            landing:
              - 'landing/**'
              - 'lighthouserc.landing.cjs'
              - 'playwright.landing.config.ts'
              - 'e2e/landing/**'
              - 'nginx/templates/landing.conf.template'
              - 'nginx/test/landing.infra.test.sh'
              - 'deploy/edge.yml'
              - 'ui/src/styles/globals.css'
              - 'yarn.lock'
              - 'package.json'
              - '.github/workflows/ci.yml'
            ui:
              - 'ui/**'
              - 'yarn.lock'
              - 'package.json'
            frontend:
              - 'ui/**'
              - 'client-admin/**'
              - 'shared/**'
              - 'e2e/**'
              - 'scripts/coverage-offenders.mjs'
              - 'scripts/coverage-delta.mjs'
              - 'scripts/bundle-delta.mjs'
              - 'scripts/ci-audit.js'
              - 'scripts/ci-audit.spec.mjs'
              - 'scripts/ci-timings.mjs'
              - 'scripts/ci-timings.spec.mjs'
              - 'scripts/ci-timings-trend.mjs'
              - 'scripts/ci-timings-trend.spec.mjs'
              - 'scripts/flake-report.mjs'
              - 'scripts/flake-report.spec.mjs'
              - 'scripts/check-arch-docs.spec.mjs'
              - 'docs/architecture/**'
              - 'CLAUDE.md'
              - 'server/CLAUDE.md'
              - 'ci-budgets.json'
              - 'quarantine.json'
              - 'package.json'
              - 'yarn.lock'
              - 'vitest.config.ts'
              - 'playwright.config.ts'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - 'shared/**'
              - 'scripts/ci-timings.mjs'
              - 'scripts/ci-timings.spec.mjs'
              - 'scripts/ci-timings-trend.mjs'
              - 'scripts/ci-timings-trend.spec.mjs'
              - 'ci-budgets.json'
              - 'package.json'
              - 'yarn.lock'
              - '.github/workflows/ci.yml'
            api-surface:
              - 'server/src/**'
              - 'ui/src/api/**'
            # [75.4] nginx/compose behaviour tests (`*.infra.test.sh`).
            infra:
              - 'nginx/**'
              - 'docker-compose.yml'
              - 'Dockerfile'
              - 'deploy/**'
              - 'scripts/backup/**'
              - 'scripts/demo/**'
              - 'docker-compose.build.yml'
              - '**/*.infra.test.sh'
              - '.github/workflows/ci.yml'

  # [75.4] Runs every `*.infra.test.sh` in the repo (docker-driven nginx /
  # compose behaviour tests). New infra tests just add their own file; they
  # never edit this job.
  infra:
    name: Infra config tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.infra == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # [75.10] Compose must refuse an empty environment (required vars use
      # `${VAR:?...}`), so a deploy with a forgotten .env fails loudly.
      - name: Compose refuses an empty env
        run: |
          out=$(env -i PATH="$PATH" HOME="$HOME" docker compose -f deploy/stack.yml config -q 2>&1) && {
            echo "docker compose accepted an empty environment" >&2
            exit 1
          }
          # A failure for any other reason (missing plugin, bad YAML) must not pass.
          grep -q 'must be set' <<<"$out" || { echo "$out" >&2; exit 1; }
          echo "compose refuses an empty env"
      - name: Run infra tests
        run: |
          # Run every script even after a failure, so one run shows them all.
          failed=""
          for t in $(git ls-files '*.infra.test.sh'); do
            echo "::group::$t"
            bash "$t" || failed="$failed $t"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::failed:$failed"; exit 1; }

  # [42.1.07] User guide gate (Epic 42). `guide:check` keeps the guide
  # structurally sound; `guide:impact` fails a PR that changes code or UI
  # words a page documents without touching that page in bn + en. The PR
  # body reaches the script only through env (never interpolated into a
  # shell command), so a hostile body cannot inject anything. Always runs:
  # a guide page can be wrong because of a change anywhere in the repo.
  guide:
    name: User guide checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # impact diffs base..head, so it needs the full history.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Guide structure check
        run: yarn guide:check

      - name: Guide impact check
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: yarn guide:impact --base "$BASE_SHA" --head "$HEAD_SHA"

  verify:
    name: Build, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build shared package
        run: yarn build:shared

      - name: Build server
        run: yarn build:server

      - name: Typecheck (lint)
        run: yarn lint

      - name: Unit tests
        env:
          # Absolute: `yarn test:unit` delegates to `yarn workspace @biddaloy/server`,
          # so the test process runs with cwd=server/ and a relative path would
          # write server/ci-timings/ — where the repo-root collect step below
          # (and .gitignore's root-anchored /ci-timings/) would never look.
          CI_TIMINGS_OUT: ${{ github.workspace }}/ci-timings/raw-unit.json
        run: yarn test:unit

      # [15.1]: `if: always()` so a red "Unit tests" step above still
      # produces a timing record — a failing suite's timing is exactly the
      # kind of run the timings job most needs to see, not one it should
      # silently drop. `ci-timings.mjs collect` never crashes on a missing
      # `--in` (a failure early enough not to reach the reporter's write)
      # either, so this step itself never fails the job.
      - name: Collect unit test timings
        if: always()
        run: node scripts/ci-timings.mjs collect --runner vitest --suite unit --job "Build, lint, unit tests" --in ci-timings/raw-unit.json --out ci-timings/unit.json

      - name: Upload unit test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-timings-unit
          path: ci-timings/unit.json
          if-no-files-found: ignore

      # `ui`'s own checks — none of these ran in CI before [8.1.5], even
      # check:exports and check:contrast from already-merged tickets. Wired
      # in together here since [8.1.5]'s own AC ("CI fails if the committed
      # schema.d.ts is stale") needed this file touched anyway, and leaving
      # the pre-existing ones unwired while adding a new one right next to
      # them would be an arbitrary line to draw.
      - name: UI typecheck
        run: yarn workspace @biddaloy/ui lint

      # [8.12.1]: `client-admin`'s own lint had never run in CI — the root
      # `yarn lint` above is the server's. That was tolerable while `tsc -b`
      # inside `build:client-admin` covered the app's types, but the service
      # worker (`src/sw.ts`) is compiled by esbuild through `vite-plugin-pwa`
      # and is excluded from the app's tsconfig, so *nothing* type-checked
      # the one file that talks to Cache Storage. This step runs both `tsc`
      # passes (app and `tsconfig.sw.json`) plus eslint.
      - name: Admin SPA typecheck
        run: yarn workspace @biddaloy/client-admin lint

      # `e2e/` is not a yarn workspace, so nothing else typechecks it — and
      # its specs only run in the much slower E2E job against a real stack.
      # [8.9.10] renamed a key in `e2e/config.ts` and the stale reference in
      # a spec surfaced 20 minutes later as a Playwright TypeError; this
      # catches that class of break in seconds.
      - name: E2E typecheck
        run: npx tsc -p e2e/tsconfig.json --noEmit

      # [8.9.1]: a real `vite build`, so it runs on its own here rather
      # than as a Vitest spec — see the script's own comment for why
      # (running a production build inside the same worker pool as the
      # rest of the frontend test suite exhausted its heap).
      # Also enforces the entry-chunk gzip ceiling ([8.9.10]) — the number
      # that makes "split the guardian app out again if it gets heavy" a
      # decision CI notices rather than one someone remembers.
      - name: client-admin route code-splitting and bundle-size check
        run: yarn workspace @biddaloy/client-admin check:route-chunks

      # Baseline for the bundle-delta PR comment (#150): the latest
      # successful main run's report is downloaded by the bundle-delta job.
      - name: Upload route-chunks report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: route-chunks-report
          path: client-admin/dist/route-chunks-report.json

      # #766: build once (shared, server, client-admin all finish by this
      # point in the job) and let every downstream job that only needs the
      # build output — not a rebuild — download it instead. 1-day retention:
      # nothing outside this run's own jobs ever needs it.
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-dist
          path: |
            shared/dist
            server/dist
            client-admin/dist
          retention-days: 1

      - name: UI export map check
        run: yarn workspace @biddaloy/ui check:exports

      - name: UI contrast check
        run: yarn workspace @biddaloy/ui check:contrast

      # [8.13.7]: a raw Tailwind hue class (bg-zinc-900, text-blue-500) is
      # invisible to the contrast check above — it reads tokens, and these
      # classes bypass tokens entirely. Cheap regex scan, so it rides along
      # in the same job.
      - name: UI raw-palette check
        run: yarn workspace @biddaloy/ui check:raw-palette

      # [8.7.5]: fails on a translation key present in one locale but not
      # the other, or a t() call with no matching key in any locale.
      # Cheap enough (a handful of JSON files + a source-tree regex scan)
      # to sit in this same job rather than needing its own.
      - name: UI missing-translation-key check
        run: yarn workspace @biddaloy/ui check:i18n

      # Non-blocking per [8.2.5]'s acceptance criteria: the baseline is
      # clean today (see knip.json's ignoreDependencies/ignoreIssues for
      # the handful of documented false positives), but a new one slipping
      # in shouldn't fail the build until this has run for a while and the
      # false-positive rate is proven low. Flip to a hard failure once that
      # holds — see README's knip section for the false-positive guidance.
      - name: Dead code check (knip, non-blocking)
        run: yarn knip
        continue-on-error: true

  # [18.5.1] 464s measured on real CI (#767/#805) put the unsharded job
  # over the 240s/4-min budget, so this splits the suite 3-way and merges
  # coverage back in `frontend-merge` below (vitest's blob reporter +
  # `--merge-reports` is built for exactly this — each shard writes a
  # `.vitest-reports/blob-<n>.json`, the merge job replays them into one
  # report so coverage thresholds and the PR delta comment still see the
  # whole suite, not just a third of it).
  frontend:
    name: Frontend tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.frontend == 'true'
    strategy:
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The root vitest.config.ts aliases @biddaloy/shared to shared/src
      # for most of the suite, but shared:node's own specs resolve the
      # package through its "main" (dist/index.js) — proven by the first
      # CI run failing with "Failed to resolve entry for package
      # @biddaloy/shared" without this build.
      - name: Build shared package
        run: yarn build:shared

      # Blob output comes from `vitest.config.ts`'s `reporters` array, NOT
      # a `--reporter=blob` CLI flag — Vitest's CLI `--reporter` REPLACES
      # `test.reporters` wholesale rather than merging with it, so passing
      # it here would silently drop the `default` console reporter and the
      # `json` timings reporter that array also carries (that's the whole
      # reason 18.5.1 added `'blob'` to the config array under the
      # `CI_TIMINGS_OUT` guard instead of just adding a CLI flag). Blob
      # writes `.vitest-reports/blob-<shard>.json` — `frontend-merge` below
      # replays all three via `--merge-reports`. Coverage stays on every
      # shard (`--coverage.reporter=json`, vitest's own merge input
      # format) — merged back to `text`/`lcovonly` in the merge job, same
      # reporters the old single job produced.
      - name: Frontend tests with coverage (shard ${{ matrix.shard }}/3)
        env:
          CI_TIMINGS_OUT: ci-timings/raw-frontend-${{ matrix.shard }}.json
        run: yarn test:frontend --run --shard=${{ matrix.shard }}/3 --coverage --coverage.reporter=json

      # [#437] Quarantined tests still run, just don't gate the pipeline —
      # otherwise "quarantine" would mean "deleted" and nobody ever learns
      # a test healed. `quarantine.spec.ts` (in the blocking step above)
      # caps the list at 10 and expires entries after 14 days, so this
      # escape hatch has its own escape hatch. Runs even if the gating
      # step above failed, since a real failure there shouldn't hide
      # whether the quarantined tests are still misbehaving too.
      #
      # [18.1.1] Guarded on the list being non-empty, AND scoped to only the
      # quarantined files' own paths — passing no file args made
      # QUARANTINE_MODE=only skip every test, but Vitest still transformed,
      # imported and set up all ~200 files first: a second near-full
      # frontend run, on every PR, for zero information. Passing the exact
      # files (via `scripts/quarantine-files.mjs`, which mirrors
      # `ui/src/test/quarantine.ts`'s key format) keeps this step to the
      # handful of files actually quarantined, so it's back to the <30s
      # this step is meant to cost.
      #
      # [18.5.1] Runs once, on shard 1 only — the file list is small and
      # fixed, sharding it three ways would just triple the fixed cost for
      # zero extra signal.
      - name: Quarantined frontend tests (non-blocking)
        if: always() && matrix.shard == 1
        continue-on-error: true
        run: |
          mapfile -t files < <(node scripts/quarantine-files.mjs)
          if [ "${#files[@]}" -gt 0 ]; then
            QUARANTINE_MODE=only yarn test:frontend --run -- "${files[@]}"
          else
            echo "quarantine.json has no entries, skipping"
          fi

      # [15.1]: see the "verify" job's "Collect unit test timings" comment —
      # same `if: always()` reasoning applies here.
      - name: Collect frontend test timings
        if: always()
        run: node scripts/ci-timings.mjs collect --runner vitest --suite frontend-${{ matrix.shard }} --job "Frontend tests (${{ matrix.shard }}/3)" --in ci-timings/raw-frontend-${{ matrix.shard }}.json --out ci-timings/frontend-${{ matrix.shard }}.json

      - name: Upload frontend test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-timings-frontend-${{ matrix.shard }}
          path: ci-timings/frontend-${{ matrix.shard }}.json
          if-no-files-found: ignore

      # Only `.vitest-reports/` is uploaded — vitest embeds each shard's
      # coverage inside its own blob report (confirmed against vitest
      # 4.1.11's `mergeReports`, which reads `blob.coverage`, never disk),
      # so `frontend-merge`'s `--merge-reports` rebuilds `coverage/`
      # itself from the blobs and never reads this shard's own `coverage/`
      # output — uploading it too would just cost CI upload/download time
      # in a ticket about cutting CI time. Named per-shard —
      # `actions/upload-artifact@v7` errors on two legs uploading the same
      # artifact name in one run.
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-shard-${{ matrix.shard }}
          path: .vitest-reports/
          if-no-files-found: error
          # `.vitest-reports/` is a dot-directory — upload-artifact treats
          # its contents as hidden and silently uploads nothing unless
          # told otherwise (confirmed on real CI: the blob file existed,
          # `if-no-files-found: error` never fired the glob just matched
          # zero files).
          include-hidden-files: true

  # [18.5.1] Merges the three shards' blob reports and coverage back into
  # one, so downstream (thresholds, PR delta comment) sees the whole suite
  # exactly as the old unsharded job did. `needs: frontend` waits on all
  # three matrix legs; `if: always()` still runs it when a shard fails, so
  # the coverage/threshold signal for the shards that DID pass isn't lost.
  frontend-merge:
    name: Frontend coverage merge
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    if: always() && (github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.frontend == 'true')
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build shared package
        run: yarn build:shared

      - name: Download shard reports and coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-shard-*
          merge-multiple: true
          # The upload step took `.vitest-reports/` as its root, so each
          # artifact's own files have no directory prefix (just
          # `blob-N-3.json`) — without `path:` here they'd land in the
          # workspace root, not where bare `--merge-reports`'s default
          # (`.vitest-reports`, confirmed against the installed Vitest
          # 4.1.11's CLI transform) looks for them.
          path: .vitest-reports/

      # Same coverage reporter narrowing as the old single job (see [15.3]
      # in git history): `text` for the console summary on failure,
      # `lcovonly` for the machine-readable file `coverage-offenders.mjs`/
      # `coverage-delta.mjs` below both read.
      - name: Merge shard reports and coverage
        run: yarn test:frontend --run --merge-reports --coverage --coverage.reporter=text --coverage.reporter=lcovonly

      # `if: failure()` also fires on non-coverage failures; the script
      # prints nothing when nothing is under threshold, which is the
      # honest output in that case.
      - name: Name files under threshold
        if: failure()
        run: node scripts/coverage-offenders.mjs coverage/lcov.info

      # [15.3] Narrowed from `coverage/` (the whole reporter output — text,
      # lcov, and an html tree) to just `lcov.info`: nothing downstream
      # reads the html tree (`coverage-offenders.mjs`, `coverage-delta.mjs`
      # below both take only `lcov.info`), and this artifact is
      # re-downloaded whole on *every* PR run for the baseline diff — see
      # "Fetch main coverage baseline" below.
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      # Baseline = latest successful main run's coverage artifact (same
      # pattern as bundle-delta). A missing baseline (first ever run)
      # degrades to an absolute-numbers comment, not a failure.
      - name: Fetch main coverage baseline
        if: github.event_name == 'pull_request'
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" -q '.workflow_runs[0].id')
          gh run download "$RUN_ID" -n frontend-coverage -D coverage-baseline || echo "no baseline yet"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compose coverage comment
        if: github.event_name == 'pull_request'
        run: node scripts/coverage-delta.mjs coverage-baseline/lcov.info coverage/lcov.info > coverage-comment.md

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          path: coverage-comment.md

  integration:
    name: Integration & e2e tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.server == 'true' || needs.changes.outputs.api-surface == 'true'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biddaloy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      seaweedfs:
        image: chrislusf/seaweedfs:4.48
        env:
          AWS_ACCESS_KEY_ID: ci-access-key
          AWS_SECRET_ACCESS_KEY: ci-secret-key
          S3_BUCKET: biddaloy-ci
        ports:
          - 9000:8333
        options: >-
          --health-cmd "curl -sf -o /dev/null http://localhost:8333/status && curl -sf -o /dev/null http://localhost:8888/buckets/biddaloy-ci/"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/biddaloy_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-integration-jwt-secret-do-not-use-in-production-1234567890
      NODE_ENV: test
      SEED_ADMIN_PASSWORD: ci-integration-seed-password-123
      # Throwaway — see .env.example. Without it, any integration/e2e test
      # that writes tenant settings secrets (SchoolsService.updateSettings)
      # fails with "Settings encryption is not configured".
      SETTINGS_ENCRYPTION_KEY: YmSqNpwxzusjAF12JSD+JNe+3LXrbNJiQza2yTnQyR0=
      # [15.5] `StorageModule` (now wired into `SchoolsModule` for the
      # school-logo feature) is a boot-time dependency of the whole app —
      # `buildStorageConfig` throws if any is unset, which fails this job's
      # `docs:generate` step (boots `AppModule` to introspect routes). A
      # real endpoint (the `seaweedfs` service container above) rather than
      # a throwaway one: `test:e2e` in this same job runs `logo.e2e-spec.ts`
      # against real object storage, same posture as
      # `restore-drill.yml`'s SeaweedFS.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: biddaloy-ci
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      S3_ALLOW_INSECURE_HTTP: 'true'
      S3_FORCE_PATH_STYLE: 'true'
      # Every e2e spec in this job authenticates as the same seeded admin
      # user (SEED_ADMIN_USER_ID), so `common/rate-limit/rate-limit-tracker.ts`'s
      # `user:<sub>` bucket is shared across the whole file suite, not
      # per-file. The default 100/60s (server/src/rate-limit.ts) is sized
      # for one real admin's traffic, not a CI worker running
      # `step-up.controller.e2e-spec.ts`, `checkout.controller.e2e-spec.ts`,
      # `route-guard-coverage.e2e-spec.ts` and
      # `discount-rules.controller.e2e-spec.ts` back to back against the
      # same identity — discount-rules' own step-up calls landed on an
      # already-warm bucket and got 429'd. `RATE_LIMIT_DEFAULT_LIMIT` is
      # exactly the env knob `resolveDefaultRateLimit` exists for; this
      # doesn't touch the guard itself or any per-route `STRICT_RATE_LIMIT`
      # tier, just the generous global default this job's own traffic
      # pattern outruns.
      RATE_LIMIT_DEFAULT_LIMIT: '1000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build shared package
        # test/setup.ts registers ts-node to load TypeORM entities/migrations
        # via its own glob, which resolves `@biddaloy/shared` through plain
        # Node `require()` — not vitest's `resolve.alias` to shared/src. That
        # alias only covers vitest's own transform pipeline, so without a
        # built dist/ here, entity loading fails at DataSource.initialize().
        run: yarn build:shared

      # server/openapi.json is gitignored (a generated artifact, not checked
      # in) — a fresh CI checkout never has it. Generating it requires a real
      # DATABASE_URL/JWT_SECRET/REDIS_URL, because generate-openapi.ts's
      # NestFactory.create(AppModule) boots the full app including its DB
      # connection — see that script's own comment. That's only true of this
      # job, not "verify" (no Postgres/Redis service there at all): a first
      # attempt put this step in "verify" and it failed outright with no
      # usable error output, since NestFactory.create had nothing to connect
      # to. check-api-types.mjs needs a real file to diff schema.d.ts
      # against, so generate it here where the services this app needs to
      # boot actually exist.
      - name: Generate server OpenAPI document
        run: yarn workspace @biddaloy/server docs:generate

      - name: UI API types freshness check
        run: yarn workspace @biddaloy/ui check:api-types

      - name: Integration tests
        env:
          # Absolute — same cwd=server/ reason as the verify job's unit tests.
          CI_TIMINGS_OUT: ${{ github.workspace }}/ci-timings/raw-integration.json
        run: yarn test:integration

      - name: E2E tests
        env:
          # Absolute — same cwd=server/ reason as the verify job's unit tests.
          CI_TIMINGS_OUT: ${{ github.workspace }}/ci-timings/raw-server-e2e.json
        run: yarn test:e2e

      # [15.1]: `test:integration`/`test:e2e` (server/package.json) already
      # pass their own `--reporter=verbose`, which — verified locally — a
      # CLI `--reporter` flag replaces the vitest config's `reporters`
      # entirely, so `server/vitest.config.ts`'s env-gated reporters alone
      # wouldn't reach these two. Those two scripts append a conditional
      # `--reporter=json --outputFile.json=$CI_TIMINGS_OUT` of their own for
      # exactly that reason — see `server/package.json`.
      - name: Collect integration/server-e2e test timings
        if: always()
        run: |
          node scripts/ci-timings.mjs collect --runner vitest --suite integration --job "Integration & e2e tests" --in ci-timings/raw-integration.json --out ci-timings/integration.json
          node scripts/ci-timings.mjs collect --runner vitest --suite server-e2e --job "Integration & e2e tests" --in ci-timings/raw-server-e2e.json --out ci-timings/server-e2e.json

      - name: Upload integration/server-e2e test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-timings-integration
          path: |
            ci-timings/integration.json
            ci-timings/server-e2e.json
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: server/coverage/
          if-no-files-found: ignore

  e2e:
    name: E2E smoke (${{ matrix.browser }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # #766 originally made this job reuse `verify`'s build-dist artifact via
    # `E2E_SKIP_BUILD=1` instead of rebuilding shared/server/client-admin —
    # reverted (18.3.3 follow-up): reproduced twice in CI as a silent
    # `webServer` boot hang (both the server and client processes produced
    # zero output and never became ready, timing out at 300s each), while
    # every piece worked correctly in isolation locally. Root cause not
    # found before Wave 3 needed to land; this job goes back to building its
    # own dist in-job (Wave 2's original, proven behavior) until a follow-up
    # ticket debugs the artifact-reuse path with real CI iteration.
    needs: [changes]
    if: github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.frontend == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # Chromium only by default — a product decision (#148). To widen:
      # set the repo Actions variable E2E_BROWSERS_JSON to e.g.
      # ["chromium","firefox","webkit"] — no workflow edit needed (see
      # nightly-e2e.yml, which already runs all three every night).
      # The cache key, install step, --project flag and artifact names
      # below are already per-browser.
      #
      # [2642] 3-way shard reinstated. [18.2.3] had removed it when one
      # chromium leg ran ~5 min; the suite has since grown to ~500 specs and
      # measured 15.6 min of tests on 4 workers (run 39301055262), so the
      # single job hit its 20-minute timeout before the PWA step finished.
      # Each shard now carries ~1/3 of the tests plus the fixed ~3.5 min of
      # setup/build/seed. The PWA/offline suite (~2 min) runs once, pinned to
      # the LIGHTEST measured shard: run 39354596191 put 12.5/17.2/22.6 min of
      # work on shards 1/2/3 (Playwright splits by test count, not duration),
      # so it rides on shard 1 (the `matrix.shard == 1` pins below). Changing
      # the shard count means editing the `/3` in `name:` and the E2E step,
      # this list, and those pins together — a `--shard=1/3` run against a
      # [1,2] matrix silently drops a third of the suite. Same layout as
      # nightly-e2e.yml.
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(vars.E2E_BROWSERS_JSON || '["chromium"]') }}
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betonboi_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      seaweedfs:
        image: chrislusf/seaweedfs:4.48
        env:
          AWS_ACCESS_KEY_ID: ci-access-key
          AWS_SECRET_ACCESS_KEY: ci-secret-key
          S3_BUCKET: biddaloy-ci
        ports:
          - 9000:8333
        options: >-
          --health-cmd "curl -sf -o /dev/null http://localhost:8333/status && curl -sf -o /dev/null http://localhost:8888/buckets/biddaloy-ci/"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/betonboi_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-e2e-jwt-secret-do-not-use-in-production-1234567890
      # Every e2e spec approves as the one seeded admin, so the whole run shares
      # step-up's 5-per-15-min verification budget (step-up.service.ts). Raised
      # for this job only; the server default stays 5.
      STEP_UP_RATE_LIMIT_MAX_ATTEMPTS: '1000'
      NODE_ENV: test
      SEED_ADMIN_PASSWORD: ci-e2e-seed-password-123
      # D6's test-observability flag — lets activation/recovery e2e specs
      # read the invitation/reset token straight off the API response
      # instead of an inbox they don't have access to.
      ACCOUNT_ACCESS_ECHO_SECRETS: 'true'
      # Keeps playwright.config.ts's projects list consistent with the
      # --project flag this matrix entry passes.
      E2E_BROWSERS: ${{ matrix.browser }}
      # [44.2.03] `yarn e2e:serve:client` builds client-admin; Vite inlines this at build
      # time, and without it every in-app help (?) and F1 stay hidden (E4, E12).
      VITE_HANDBOOK_URL: https://schoolmanagerp.gitbook.io/schoolmanagerp-docs
      # [15.5] See the "integration" job's identical block — `yarn ...
      # server seed` below boots `AppModule`, which needs `StorageModule`
      # env to construct. Since [14.11.4] these also have to point at a
      # *real* SeaweedFS (the `seaweedfs` service container above): the
      # backup/restore journey exports a workbook, which the export job
      # uploads to object storage before it can reach DONE.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: biddaloy-ci
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      S3_ALLOW_INSECURE_HTTP: 'true'
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build shared package
        # webServer boots the real server/clients (yarn e2e:serve:*), which
        # resolve @biddaloy/shared through its package.json "main"
        # (dist/index.js, not src) — same reason the other jobs build this
        # first.
        run: yarn build:shared

      # Playwright's package version, used below so the browser cache key
      # actually matches its own comment (it previously keyed on
      # hashFiles('yarn.lock'), so unrelated lockfile bumps invalidated a
      # perfectly good browser cache — see #440). Must run after "Install
      # dependencies" so the package is on disk to inspect.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Playwright's own browser cache, keyed on the resolved package
      # version so a dependabot bump invalidates it automatically. On a
      # cache hit the browser binary is already there, so only the OS-level
      # shared libraries (apt) need reinstalling — skips the ~1min download.
      # Keyed per browser, one job per browser now (18.2.3 removed
      # sharding) — no contention on this key within a run.
      #
      # Deliberately no `restore-keys:` (#440's plan proposed one; review
      # found it net-negative). Playwright installs into version-stamped
      # directories, so a prefix match would restore the *previous*
      # version's binaries — not one reusable byte, since the exact-key
      # miss re-runs `playwright install --with-deps` anyway — and then
      # re-save both under the new key, growing the entry on every bump
      # until it evicts other caches. The version key self-invalidates
      # cleanly on its own.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser (${{ matrix.browser }})
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # [#3085] The apt mirror a runner lands on is sometimes ~30 kB/s (shard 3
        # spent ~10 min on one package in three runs; shards 1/2 took 2-3 s).
        # Each attempt is cut at 4 min and retried; a fresh apt run usually
        # gets a healthy connection. The browser binary itself is cached above.
        run: |
          for i in 1 2 3; do
            timeout 240 npx playwright install --with-deps ${{ matrix.browser }} && exit 0
            echo "attempt $i failed or timed out"
          done
          exit 1

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          for i in 1 2 3; do
            timeout 240 npx playwright install-deps ${{ matrix.browser }} && exit 0
            echo "attempt $i failed or timed out"
          done
          exit 1

      - name: Run migrations
        run: yarn workspace @biddaloy/server migration:run

      - name: Seed database
        run: yarn workspace @biddaloy/server seed

      - name: E2E tests (${{ matrix.browser }} ${{ matrix.shard }}/3)
        env:
          CI_TIMINGS_OUT: ci-timings/raw-e2e-${{ matrix.browser }}-${{ matrix.shard }}.json
        run: yarn e2e --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3

      # [8.12.6]: the PWA/offline suite runs here rather than as its own
      # job so it reuses this job's postgres, redis, migrations, seed and
      # browser cache. It has its own config because the service worker
      # only exists in a production build (`devOptions.enabled: false`),
      # so it builds client-admin and drives `vite preview` on :5175 —
      # roughly 2-4 minutes, paid on every PR deliberately: a PWA suite
      # that only ran post-merge would not have caught the class of bug
      # #184 found. Chromium only; offline emulation reaching service
      # workers is verified on Chromium's CDP path.
      #
      # [18.2.3] Runs once per browser leg on chromium only — the shard
      # pin this comment used to explain (see git history for #440's
      # "lightest shard" reasoning) no longer applies now that sharding
      # is gone: each browser is a single job, so this just picks chromium
      # for the reason above (offline emulation reaching service workers
      # is only verified on Chromium's CDP path).
      # Once per browser, on the lightest shard (see the matrix comment above).
      - name: PWA and offline E2E tests
        if: matrix.browser == 'chromium' && matrix.shard == 1
        env:
          CI_TIMINGS_OUT: ci-timings/raw-e2e-pwa.json
        run: yarn e2e:pwa

      # [15.1]: the main record always exists (this step is `if: always()`);
      # the PWA one only does on the leg that ran it (chromium). Checking
      # for the raw PWA file directly — its presence *is* the signal that
      # the PWA step ran — stays correct without a separate browser pin.
      - name: Collect E2E timings
        if: always()
        run: |
          node scripts/ci-timings.mjs collect --runner playwright --suite e2e-${{ matrix.browser }}-${{ matrix.shard }} --job "E2E smoke (${{ matrix.browser }} ${{ matrix.shard }}/3)" --in ci-timings/raw-e2e-${{ matrix.browser }}-${{ matrix.shard }}.json --out ci-timings/e2e-${{ matrix.browser }}-${{ matrix.shard }}.json
          if [ -f ci-timings/raw-e2e-pwa.json ]; then
            node scripts/ci-timings.mjs collect --runner playwright --suite e2e-pwa --job "E2E smoke (${{ matrix.browser }} ${{ matrix.shard }}/3)" --in ci-timings/raw-e2e-pwa.json --out ci-timings/e2e-pwa.json
          fi

      # Artifact name includes the browser — REQUIRED, not cosmetic: this
      # job is a per-browser matrix, and `actions/upload-artifact@v7`
      # errors on two legs uploading the same artifact name within one run.
      - name: Upload E2E timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-timings-e2e-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            ci-timings/e2e-${{ matrix.browser }}-${{ matrix.shard }}.json
            ci-timings/e2e-pwa.json
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload PWA Playwright report
        if: failure() && matrix.browser == 'chromium' && matrix.shard == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-pwa
          path: playwright-report-pwa/
          if-no-files-found: ignore

      - name: Upload PWA traces, screenshots and videos
        if: failure() && matrix.browser == 'chromium' && matrix.shard == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-pwa
          path: test-results-pwa/
          if-no-files-found: ignore

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  # [18.4.1] Route sweeps (a11y/reflow/target-size — nightly-e2e.yml's
  # `chromium-sweeps` project, 79% of full E2E runtime, see
  # playwright.config.ts's [18.1.2] comment) only ran nightly before this.
  # A merge queue entry is the last check before `main`, so it's the one
  # place that can afford them without slowing every PR down — chromium
  # only, same engine restriction as the PR-facing `e2e` job above.
  sweeps:
    name: Route sweeps (chromium-sweeps)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'merge_group'
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betonboi_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/betonboi_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-e2e-jwt-secret-do-not-use-in-production-1234567890
      # Every e2e spec approves as the one seeded admin, so the whole run shares
      # step-up's 5-per-15-min verification budget (step-up.service.ts). Raised
      # for this job only; the server default stays 5.
      STEP_UP_RATE_LIMIT_MAX_ATTEMPTS: '1000'
      NODE_ENV: test
      SEED_ADMIN_PASSWORD: ci-e2e-seed-password-123
      # [15.5] See the "integration"/"e2e" jobs above.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: biddaloy-ci
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      S3_ALLOW_INSECURE_HTTP: 'true'
      S3_FORCE_PATH_STYLE: 'true'
      E2E_BROWSERS: chromium
      # [44.2.03] Build the sweeps' client-admin like the e2e job's, (?) included.
      VITE_HANDBOOK_URL: https://schoolmanagerp.gitbook.io/schoolmanagerp-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build shared package
        run: yarn build:shared

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run migrations
        run: yarn workspace @biddaloy/server migration:run

      - name: Seed database
        run: yarn workspace @biddaloy/server seed

      - name: Route sweeps (chromium-sweeps)
        run: yarn e2e --project=chromium-sweeps

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-chromium-sweeps
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-chromium-sweeps
          path: test-results/
          if-no-files-found: ignore

  # [18.4.1] Same "last gate before main" reasoning as `sweeps` above —
  # Lighthouse moved off ci.yml onto a nightly schedule in [18.1.1], but a
  # merge queue entry calls it back in via `workflow_call` (no inputs
  # needed — nightly-quality.yml's `lighthouse` job self-provisions
  # services/env exactly like it does on its own schedule).
  quality:
    name: Nightly quality (merge queue)
    needs: changes
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/nightly-quality.yml
    secrets: inherit
    # A reusable workflow call cannot escalate to a permission the caller
    # doesn't grant — nightly-quality.yml's own `report` job requests
    # `issues: write`, and neither this job nor ci.yml's top level declared
    # any `permissions:`, so GitHub rejected the ENTIRE run at parse time
    # (a whole-run `startup_failure`, no jobs listed at all — not a single
    # job failing). Reproduced and bisected: removing just this job let the
    # run start normally; adding this block back fixed it.
    permissions:
      contents: read
      issues: write

  bundle-delta:
    name: Bundle size delta
    runs-on: ubuntu-latest
    # #766: `verify`'s `check:route-chunks` step already produced this PR's
    # report — reuse it via build-dist instead of rebuilding client-admin a
    # second time just to regenerate the same file.
    needs: [changes, verify]
    if: github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-dist

      # Baseline = the latest successful main run's artifact — one build
      # instead of two (~1.5 min saved). The delta reads "current main vs
      # this PR" rather than the PR's exact merge-base; fine for a drift
      # signal, the hard ceiling still gates absolutes.
      - name: Download baseline report from latest main run
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" -q '.workflow_runs[0].id')
          gh run download "$RUN_ID" -n route-chunks-report -D baseline || echo "no baseline yet"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compose delta comment
        run: node scripts/bundle-delta.mjs baseline/route-chunks-report.json client-admin/dist/route-chunks-report.json delta.md

      - name: Post sticky PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: bundle-delta
          path: delta.md

  storybook:
    name: Storybook build
    runs-on: ubuntu-latest
    needs: changes
    # [18.1.1] Path-filtered on the narrower `ui` output, not `frontend` —
    # a `server/**`-only PR touches none of `ui/`'s stories, so this job
    # has nothing to build.
    if: github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.ui == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Storybook resolves @biddaloy/shared through the ui vite config's
      # alias; if the build errors on shared imports, add `yarn build:shared`
      # above this step (same caveat as the frontend job).
      - name: Build Storybook
        run: yarn workspace @biddaloy/ui build-storybook

      - name: Upload Storybook static build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static
          path: ui/storybook-static/
          retention-days: 14

  # [50.2] Static marketing site (D20). Builds landing/, checks its tokens
  # against the app's, and keeps dist/ as an artifact for the deploy step.
  landing:
    name: Landing build
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.landing == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Before the build: build-collateral.mjs renders the PDFs with Chromium.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build landing
        run: yarn workspace @biddaloy/landing build

      - name: Check landing tokens match the app
        run: node landing/scripts/check-tokens.mjs

      # [50.13] Budget gate (D21): serve the built site and run Lighthouse + the
      # landing smoke project against it. Either one failing fails the job.
      # `serve` and `wait-on` are locked landing devDependencies (security Rule 21);
      # serve also backs playwright.landing.config.ts.
      - name: Serve landing dist
        run: yarn workspace @biddaloy/landing serve &

      - name: Wait for the landing server
        run: yarn workspace @biddaloy/landing exec wait-on http://localhost:4321/bn/ --timeout 60000

      - name: Lighthouse budget (landing)
        run: npx lhci autorun --config lighthouserc.landing.cjs

      - name: Landing smoke (Playwright)
        run: npx playwright test -c playwright.landing.config.ts --project landing

      - name: Upload landing reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-reports
          path: |
            .lighthouseci-landing/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Pack landing dist
        run: tar -czf "landing-dist-${{ github.sha }}.tar.gz" -C landing/dist .

      - name: Upload landing dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: landing-dist-${{ github.sha }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30

  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: yarn audit (fails on new high/critical, ignores allowlisted advisories)
        run: node scripts/ci-audit.js

      - name: yarn audit, production deps (fails on new moderate+)
        run: node scripts/ci-audit.js --production

      - name: Lint workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: Forbidden tracked files
        run: node scripts/check-tracked-files.mjs

      # [61.1] A typo in a playbook should fail here, not at 2 a.m. on the VM.
      # Syntax only: nothing connects to a host. ansible-core is pinned (Rule 21).
      - name: Ansible playbooks (syntax check)
        working-directory: infra/ansible
        run: |
          python3 -m pip install --user 'ansible-core==2.18.6'
          export PATH="$HOME/.local/bin:$PATH"
          ansible-galaxy install -r requirements.yml
          ansible-playbook -i inventory/prod.yml --syntax-check provision.yml
          # deploy.yml runs on the VM with -c local (Epic 79 W3.01); one syntax check per stack.
          for stack in prod staging demo edge ops; do
            ansible-playbook -c local -i localhost, --syntax-check deploy.yml -e stack=$stack -e version=0000000000000000000000000000000000000000
          done
          # Here, not only in the infra job: that job has no ansible-playbook, so it skips this one.
          bash test/report.infra.test.sh
          bash test/app-services.infra.test.sh
          bash test/tunnel-recreate.infra.test.sh
          # The VM-side CLIs (Epic 79 W3). Docker-free shims; ansible-playbook is on PATH here, so
          # the deploy test also proves a Jinja hotfix reason stays text in deploy.yml.
          # *.infra.test.sh files already run in the infra job.
          failed=""
          for t in ../../deploy/bin/test/*.test.sh; do
            case "$t" in *.infra.test.sh) continue ;; esac
            echo "::group::$t"
            bash "$t" || failed="$failed $t"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::failed:$failed"; exit 1; }

  # [15.1] "tests got slower" needs to be a graph, not a feeling — this
  # publishes wall/work/gap, a per-job budget verdict, and the top-10
  # slowest files as a job summary, on every run, so nobody has to open logs
  # to see it. `if: always()` is required so a red run — the run whose
  # timing usually matters most — still gets a summary.
  #
  # `needs:` MUST list every job above that can produce a `ci-timings-*`
  # artifact, or that otherwise finishes test work (bundle-delta, storybook,
  # lighthouse, audit have no timing artifact of their own today, but their
  # `completed_at` still feeds wall/work via the Jobs API). Add a job above
  # without adding it here and this job starts — and queries the Jobs API —
  # before that job finishes, silently under-reporting wall time.
  timings:
    name: Test timings & budgets
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, verify, frontend-merge, integration, e2e, bundle-delta, storybook, audit, infra]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Every `ci-timings-*` artifact from this run, whichever jobs actually
      # produced one. `|| echo` because a run where every test-producing job
      # was path-filtered out (a docs-only PR) uploads zero timing
      # artifacts, and that must not fail this job — same "in-progress
      # current run" `gh run download` mechanism the coverage and
      # bundle-size baselines already use (see README's CI section), just
      # against this run instead of a past one.
      - name: Download timing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -p 'ci-timings-*' -D ci-timings || echo "no timing artifacts to download"

      - name: Fetch job timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > jobs.json

      - name: Summarize
        # `--out`, not `>> $GITHUB_STEP_SUMMARY`. The markdown has to reach the
        # step summary, but the `::warning::` lines have to reach the step LOG —
        # that is where GitHub parses workflow commands from. Redirecting all of
        # stdout sends the annotations into the summary file, where they render
        # as literal `::warning title=...` text and no annotation is ever created.
        run: node scripts/ci-timings.mjs summarize --records ci-timings --jobs jobs.json --budgets ci-budgets.json --out "$GITHUB_STEP_SUMMARY"
