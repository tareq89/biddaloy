name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Build, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        run: yarn build:shared

      - name: Build server
        run: yarn build:server

      - name: Typecheck (lint)
        run: yarn lint

      - name: Unit tests
        run: yarn test:unit

  integration:
    name: Integration & e2e tests
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betonboi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/betonboi_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-integration-jwt-secret-do-not-use-in-production-1234567890
      NODE_ENV: test
      SEED_ADMIN_PASSWORD: ci-integration-seed-password-123
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        # test/setup.ts registers ts-node to load TypeORM entities/migrations
        # via its own glob, which resolves `@beton-boi/shared` through plain
        # Node `require()` — not vitest's `resolve.alias` to shared/src. That
        # alias only covers vitest's own transform pipeline, so without a
        # built dist/ here, entity loading fails at DataSource.initialize().
        run: yarn build:shared

      - name: Integration tests
        run: yarn test:integration

      - name: E2E tests
        run: yarn test:e2e

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: server/coverage/
          if-no-files-found: ignore

  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: yarn audit (fails on new high/critical, ignores allowlisted advisories)
        run: node scripts/ci-audit.js
