name: CI
# Editing a job? Mirror it in scripts/ci-local.sh (#152) — the script runs
# the same commands job-for-job so "works on my machine" stays true.

on:
  pull_request:
  push:
    branches: [main]
  # For running the lighthouse job on demand from a feature branch.
  workflow_dispatch:

env:
  NODE_VERSION: "24"

concurrency:
  group: ci-${{ github.ref }}
  # Guarded: cancel superseded PR pushes, but never a main run — the main
  # run is the only run that enforces frontend coverage thresholds.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Path-filter gate (#147): PRs skip jobs whose paths are untouched.
  # Push to main always runs everything — it's the merge gate, and
  # dorny diffs against the previous push there, which under-reports
  # on force-pushes.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      server: ${{ steps.filter.outputs.server }}
      api-surface: ${{ steps.filter.outputs.api-surface }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'ui/**'
              - 'client-admin/**'
              - 'shared/**'
              - 'e2e/**'
              - 'scripts/coverage-offenders.mjs'
              - 'scripts/coverage-delta.mjs'
              - 'scripts/bundle-delta.mjs'
              - 'scripts/ci-timings.mjs'
              - 'scripts/ci-timings.spec.mjs'
              - 'scripts/ci-timings-trend.mjs'
              - 'scripts/ci-timings-trend.spec.mjs'
              - 'scripts/flake-report.mjs'
              - 'scripts/flake-report.spec.mjs'
              - 'ci-budgets.json'
              - 'quarantine.json'
              - 'package.json'
              - 'yarn.lock'
              - 'vitest.config.ts'
              - 'playwright.config.ts'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - 'shared/**'
              - 'scripts/ci-timings.mjs'
              - 'scripts/ci-timings.spec.mjs'
              - 'scripts/ci-timings-trend.mjs'
              - 'scripts/ci-timings-trend.spec.mjs'
              - 'ci-budgets.json'
              - 'package.json'
              - 'yarn.lock'
              - '.github/workflows/ci.yml'
            api-surface:
              - 'server/src/**'
              - 'ui/src/api/**'

  verify:
    name: Build, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # [15.6] Config-consistency check — the runtime half is a tautology
      # here (setup-node just installed the pinned version above), but the
      # drift-between-.nvmrc/ci.yml/the-nightly-workflow half is exactly
      # what CI should be enforcing, so a future edit to any one of them
      # fails loudly instead of silently drifting.
      - name: Node version parity
        run: node scripts/check-node-version.mjs --no-runtime-check

      - name: Build shared package
        run: yarn build:shared

      - name: Build server
        run: yarn build:server

      - name: Typecheck (lint)
        run: yarn lint

      - name: Unit tests
        env:
          # Absolute: `yarn test:unit` delegates to `yarn workspace @biddaloy/server`,
          # so the test process runs with cwd=server/ and a relative path would
          # write server/ci-timings/ — where the repo-root collect step below
          # (and .gitignore's root-anchored /ci-timings/) would never look.
          CI_TIMINGS_OUT: ${{ github.workspace }}/ci-timings/raw-unit.json
        run: yarn test:unit

      # [15.1]: `if: always()` so a red "Unit tests" step above still
      # produces a timing record — a failing suite's timing is exactly the
      # kind of run the timings job most needs to see, not one it should
      # silently drop. `ci-timings.mjs collect` never crashes on a missing
      # `--in` (a failure early enough not to reach the reporter's write)
      # either, so this step itself never fails the job.
      - name: Collect unit test timings
        if: always()
        run: node scripts/ci-timings.mjs collect --runner vitest --suite unit --job "Build, lint, unit tests" --in ci-timings/raw-unit.json --out ci-timings/unit.json

      - name: Upload unit test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-timings-unit
          path: ci-timings/unit.json
          if-no-files-found: ignore

      # `ui`'s own checks — none of these ran in CI before [8.1.5], even
      # check:exports and check:contrast from already-merged tickets. Wired
      # in together here since [8.1.5]'s own AC ("CI fails if the committed
      # schema.d.ts is stale") needed this file touched anyway, and leaving
      # the pre-existing ones unwired while adding a new one right next to
      # them would be an arbitrary line to draw.
      - name: UI typecheck
        run: yarn workspace @biddaloy/ui lint

      # [8.12.1]: `client-admin`'s own lint had never run in CI — the root
      # `yarn lint` above is the server's. That was tolerable while `tsc -b`
      # inside `build:client-admin` covered the app's types, but the service
      # worker (`src/sw.ts`) is compiled by esbuild through `vite-plugin-pwa`
      # and is excluded from the app's tsconfig, so *nothing* type-checked
      # the one file that talks to Cache Storage. This step runs both `tsc`
      # passes (app and `tsconfig.sw.json`) plus eslint.
      - name: Admin SPA typecheck
        run: yarn workspace @biddaloy/client-admin lint

      # `e2e/` is not a yarn workspace, so nothing else typechecks it — and
      # its specs only run in the much slower E2E job against a real stack.
      # [8.9.10] renamed a key in `e2e/config.ts` and the stale reference in
      # a spec surfaced 20 minutes later as a Playwright TypeError; this
      # catches that class of break in seconds.
      - name: E2E typecheck
        run: npx tsc -p e2e/tsconfig.json --noEmit

      # [8.9.1]: a real `vite build`, so it runs on its own here rather
      # than as a Vitest spec — see the script's own comment for why
      # (running a production build inside the same worker pool as the
      # rest of the frontend test suite exhausted its heap).
      # Also enforces the entry-chunk gzip ceiling ([8.9.10]) — the number
      # that makes "split the guardian app out again if it gets heavy" a
      # decision CI notices rather than one someone remembers.
      - name: client-admin route code-splitting and bundle-size check
        run: yarn workspace @biddaloy/client-admin check:route-chunks

      # Baseline for the bundle-delta PR comment (#150): the latest
      # successful main run's report is downloaded by the bundle-delta job.
      - name: Upload route-chunks report
        uses: actions/upload-artifact@v7
        with:
          name: route-chunks-report
          path: client-admin/dist/route-chunks-report.json

      - name: UI export map check
        run: yarn workspace @biddaloy/ui check:exports

      - name: UI contrast check
        run: yarn workspace @biddaloy/ui check:contrast

      # [8.13.7]: a raw Tailwind hue class (bg-zinc-900, text-blue-500) is
      # invisible to the contrast check above — it reads tokens, and these
      # classes bypass tokens entirely. Cheap regex scan, so it rides along
      # in the same job.
      - name: UI raw-palette check
        run: yarn workspace @biddaloy/ui check:raw-palette

      # [8.7.5]: fails on a translation key present in one locale but not
      # the other, or a t() call with no matching key in any locale.
      # Cheap enough (a handful of JSON files + a source-tree regex scan)
      # to sit in this same job rather than needing its own.
      - name: UI missing-translation-key check
        run: yarn workspace @biddaloy/ui check:i18n

      # Non-blocking per [8.2.5]'s acceptance criteria: the baseline is
      # clean today (see knip.json's ignoreDependencies/ignoreIssues for
      # the handful of documented false positives), but a new one slipping
      # in shouldn't fail the build until this has run for a while and the
      # false-positive rate is proven low. Flip to a hard failure once that
      # holds — see README's knip section for the false-positive guidance.
      - name: Dead code check (knip, non-blocking)
        run: yarn knip
        continue-on-error: true

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The root vitest.config.ts aliases @biddaloy/shared to shared/src
      # for most of the suite, but shared:node's own specs resolve the
      # package through its "main" (dist/index.js) — proven by the first
      # CI run failing with "Failed to resolve entry for package
      # @biddaloy/shared" without this build.
      - name: Build shared package
        run: yarn build:shared

      # Coverage on every run (#153 amends #307's PR/no-coverage split):
      # the PR delta comment below needs PR coverage, and since this job is
      # parallel the instrumentation cost sits off the critical path either
      # way. [15.3] re-measured this from scratch rather than trust the old
      # "~105s instrumentation penalty" note here — it didn't survive
      # re-measurement: coverage on vs. off was ~4.7s wall / ~58 CPU-s
      # locally (10 cores), a few seconds on a 4-vCPU runner, not 105s.
      # `--coverage.reporter` narrowed to `text` (the console summary a
      # human reads on a failed run) and `lcovonly` (the machine-readable
      # `lcov.info` `coverage-offenders.mjs`/`coverage-delta.mjs` below both
      # read — deliberately `lcovonly`, not `lcov`: istanbul's plain `lcov`
      # reporter writes an `lcov-report/` html tree alongside `lcov.info`,
      # `lcovonly` writes just the file). Dropping `html` costs nothing
      # downstream (nothing in CI opens it) and shrinks the
      # `frontend-coverage` artifact every PR run re-downloads for its
      # baseline diff (see "Upload frontend coverage" below). `yarn
      # coverage` (local) is untouched — its `vitest.config.ts` reporter
      # list still includes `html` for the local report.
      - name: Frontend tests with coverage
        env:
          CI_TIMINGS_OUT: ci-timings/raw-frontend.json
        run: yarn test:frontend:coverage --coverage.reporter=text --coverage.reporter=lcovonly

      # [#437] Quarantined tests still run, just don't gate the pipeline —
      # otherwise "quarantine" would mean "deleted" and nobody ever learns
      # a test healed. `quarantine.spec.ts` (in the blocking step above)
      # caps the list at 10 and expires entries after 14 days, so this
      # escape hatch has its own escape hatch. Runs even if the gating
      # step above failed, since a real failure there shouldn't hide
      # whether the quarantined tests are still misbehaving too.
      #
      # Guarded on the list being non-empty: with `tests: []`, QUARANTINE_MODE=only
      # skips every test, but Vitest still transforms, imports and sets up all
      # ~200 files first — a second near-full frontend run, on every PR, for
      # zero information. On the job [15.1] exists to speed up, that is not a
      # cost worth paying for an empty list.
      - name: Quarantined frontend tests (non-blocking)
        if: always()
        continue-on-error: true
        env:
          QUARANTINE_MODE: only
        run: |
          if [ "$(jq '.tests | length' quarantine.json)" -gt 0 ]; then
            yarn test:frontend --run
          else
            echo "quarantine.json is empty — nothing quarantined, nothing to run."
          fi

      # [15.1]: see the "verify" job's "Collect unit test timings" comment —
      # same `if: always()` reasoning applies here.
      - name: Collect frontend test timings
        if: always()
        run: node scripts/ci-timings.mjs collect --runner vitest --suite frontend --job "Frontend tests" --in ci-timings/raw-frontend.json --out ci-timings/frontend.json

      - name: Upload frontend test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-timings-frontend
          path: ci-timings/frontend.json
          if-no-files-found: ignore

      # `if: failure()` also fires on non-coverage failures; the script
      # prints nothing when nothing is under threshold, which is the
      # honest output in that case.
      - name: Name files under threshold
        if: failure()
        run: node scripts/coverage-offenders.mjs coverage/lcov.info

      # [15.3] Narrowed from `coverage/` (the whole reporter output — text,
      # lcov, and an html tree) to just `lcov.info`: nothing downstream
      # reads the html tree (`coverage-offenders.mjs`, `coverage-delta.mjs`
      # below both take only `lcov.info`), and this artifact is
      # re-downloaded whole on *every* PR run for the baseline diff — see
      # "Fetch main coverage baseline" below.
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      # Baseline = latest successful main run's coverage artifact (same
      # pattern as bundle-delta). A missing baseline (first ever run)
      # degrades to an absolute-numbers comment, not a failure.
      - name: Fetch main coverage baseline
        if: github.event_name == 'pull_request'
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" -q '.workflow_runs[0].id')
          gh run download "$RUN_ID" -n frontend-coverage -D coverage-baseline || echo "no baseline yet"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compose coverage comment
        if: github.event_name == 'pull_request'
        run: node scripts/coverage-delta.mjs coverage-baseline/lcov.info coverage/lcov.info > coverage-comment.md

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          path: coverage-comment.md

  integration:
    name: Integration & e2e tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.server == 'true' || needs.changes.outputs.api-surface == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biddaloy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/biddaloy_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-integration-jwt-secret-do-not-use-in-production-1234567890
      NODE_ENV: test
      SEED_ADMIN_PASSWORD: ci-integration-seed-password-123
      # Throwaway — see .env.example. Without it, any integration/e2e test
      # that writes tenant settings secrets (SchoolsService.updateSettings)
      # fails with "Settings encryption is not configured".
      SETTINGS_ENCRYPTION_KEY: YmSqNpwxzusjAF12JSD+JNe+3LXrbNJiQza2yTnQyR0=
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        # test/setup.ts registers ts-node to load TypeORM entities/migrations
        # via its own glob, which resolves `@biddaloy/shared` through plain
        # Node `require()` — not vitest's `resolve.alias` to shared/src. That
        # alias only covers vitest's own transform pipeline, so without a
        # built dist/ here, entity loading fails at DataSource.initialize().
        run: yarn build:shared

      # server/openapi.json is gitignored (a generated artifact, not checked
      # in) — a fresh CI checkout never has it. Generating it requires a real
      # DATABASE_URL/JWT_SECRET/REDIS_URL, because generate-openapi.ts's
      # NestFactory.create(AppModule) boots the full app including its DB
      # connection — see that script's own comment. That's only true of this
      # job, not "verify" (no Postgres/Redis service there at all): a first
      # attempt put this step in "verify" and it failed outright with no
      # usable error output, since NestFactory.create had nothing to connect
      # to. check-api-types.mjs needs a real file to diff schema.d.ts
      # against, so generate it here where the services this app needs to
      # boot actually exist.
      - name: Generate server OpenAPI document
        run: yarn workspace @biddaloy/server docs:generate

      - name: UI API types freshness check
        run: yarn workspace @biddaloy/ui check:api-types

      - name: Integration tests
        env:
          # Absolute — same cwd=server/ reason as the verify job's unit tests.
          CI_TIMINGS_OUT: ${{ github.workspace }}/ci-timings/raw-integration.json
        run: yarn test:integration

      - name: E2E tests
        env:
          # Absolute — same cwd=server/ reason as the verify job's unit tests.
          CI_TIMINGS_OUT: ${{ github.workspace }}/ci-timings/raw-server-e2e.json
        run: yarn test:e2e

      # [15.1]: `test:integration`/`test:e2e` (server/package.json) already
      # pass their own `--reporter=verbose`, which — verified locally — a
      # CLI `--reporter` flag replaces the vitest config's `reporters`
      # entirely, so `server/vitest.config.ts`'s env-gated reporters alone
      # wouldn't reach these two. Those two scripts append a conditional
      # `--reporter=json --outputFile.json=$CI_TIMINGS_OUT` of their own for
      # exactly that reason — see `server/package.json`.
      - name: Collect integration/server-e2e test timings
        if: always()
        run: |
          node scripts/ci-timings.mjs collect --runner vitest --suite integration --job "Integration & e2e tests" --in ci-timings/raw-integration.json --out ci-timings/integration.json
          node scripts/ci-timings.mjs collect --runner vitest --suite server-e2e --job "Integration & e2e tests" --in ci-timings/raw-server-e2e.json --out ci-timings/server-e2e.json

      - name: Upload integration/server-e2e test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-timings-integration
          path: |
            ci-timings/integration.json
            ci-timings/server-e2e.json
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: server/coverage/
          if-no-files-found: ignore

  e2e:
    name: E2E (${{ matrix.browser }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # Chromium only by default — a product decision (#148). To widen:
      # set the repo Actions variable E2E_BROWSERS_JSON to e.g.
      # ["chromium","firefox","webkit"] — no workflow edit needed (see
      # nightly-e2e.yml, which already runs all three every night).
      # The cache key, install step, --project flag and artifact names
      # below are already per-browser.
      #
      # Within-browser sharding (#440): the suite now exceeds the ~5 min
      # threshold from #307's out-of-scope notes, so each browser entry
      # is split 3 ways here.
      #
      # Changing the shard count means editing SIX places in this job, and
      # nothing enforces it — if they drift, tests silently vanish (a
      # --shard=1/3 run against a [1,2,3,4] matrix throws, but a [1,2]
      # matrix against /3 just drops the third shard's tests and stays
      # green). The six:
      #   1. `name:` above                    — "… ${{ matrix.shard }}/3"
      #   2. this `matrix.shard` list         — [1, 2, 3]
      #   3. the "E2E tests" step `name:`     — "… ${{ matrix.shard }}/3"
      #   4. its `--shard=${{ … }}/3` flag
      #   5-6. the three `matrix.shard == 3` pins on the PWA step and its
      #        two artifact uploads (the "last shard" pin — see there).
      # nightly-e2e.yml mirrors 1-4 and must move with them.
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(vars.E2E_BROWSERS_JSON || '["chromium"]') }}
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betonboi_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/betonboi_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-e2e-jwt-secret-do-not-use-in-production-1234567890
      NODE_ENV: test
      SEED_ADMIN_PASSWORD: ci-e2e-seed-password-123
      # Keeps playwright.config.ts's projects list consistent with the
      # --project flag this matrix entry passes.
      E2E_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        # webServer boots the real server/clients (yarn dev:*), which resolve
        # @biddaloy/shared through its package.json "main" (dist/index.js,
        # not src) — same reason the other jobs build this first.
        run: yarn build:shared

      # Playwright's package version, used below so the browser cache key
      # actually matches its own comment (it previously keyed on
      # hashFiles('yarn.lock'), so unrelated lockfile bumps invalidated a
      # perfectly good browser cache — see #440). Must run after "Install
      # dependencies" so the package is on disk to inspect.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Playwright's own browser cache, keyed on the resolved package
      # version so a dependabot bump invalidates it automatically. On a
      # cache hit the browser binary is already there, so only the OS-level
      # shared libraries (apt) need reinstalling — skips the ~1min download.
      # All 3 shards of a browser share this key; on a cold cache the first
      # to finish wins and the other two get a benign "already exists" 409
      # from actions/cache — expected, not a bug to "fix".
      #
      # Deliberately no `restore-keys:` (#440's plan proposed one; review
      # found it net-negative). Playwright installs into version-stamped
      # directories, so a prefix match would restore the *previous*
      # version's binaries — not one reusable byte, since the exact-key
      # miss re-runs `playwright install --with-deps` anyway — and then
      # re-save both under the new key, growing the entry on every bump
      # until it evicts other caches. The version key self-invalidates
      # cleanly on its own.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser (${{ matrix.browser }})
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Run migrations
        run: yarn workspace @biddaloy/server migration:run

      - name: Seed database
        run: yarn workspace @biddaloy/server seed

      - name: E2E tests (${{ matrix.browser }} ${{ matrix.shard }}/3)
        env:
          CI_TIMINGS_OUT: ci-timings/raw-e2e-${{ matrix.browser }}-${{ matrix.shard }}.json
        run: yarn e2e --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3

      # [8.12.6]: the PWA/offline suite runs here rather than as its own
      # job so it reuses this job's postgres, redis, migrations, seed and
      # browser cache. It has its own config because the service worker
      # only exists in a production build (`devOptions.enabled: false`),
      # so it builds client-admin and drives `vite preview` on :5175 —
      # roughly 2-4 minutes, paid on every PR deliberately: a PWA suite
      # that only ran post-merge would not have caught the class of bug
      # #184 found. Chromium only; offline emulation reaching service
      # workers is verified on Chromium's CDP path.
      #
      # Runs once per browser, arbitrarily pinned to the LAST shard. Not
      # shard 1 by preference: when measured on 2026-08-30 shard 3 was the
      # lightest leg (~256s of ~939s total work), so stacking the ~55s PWA
      # suite there kept the three shards finishing close together.
      #
      # That is a snapshot, not an invariant. Playwright's filterForShard
      # slices by TEST COUNT, not duration, so adding or removing a single
      # test case anywhere shifts the boundaries and shard 3 may stop being
      # the lightest. The cost of being wrong is bounded and visible (the
      # critical shard grows by roughly the PWA suite's ~55s, showing up
      # directly in CI timings) — so re-measure before moving this, rather
      # than shuffling it on the assumption the old comment still holds.
      #
      # If the shard count changes, this `== 3` and the two identical pins
      # on the PWA artifact uploads below must change with it, or the whole
      # PWA/offline suite silently stops running while CI stays green.
      - name: PWA and offline E2E tests
        if: matrix.browser == 'chromium' && matrix.shard == 3
        env:
          CI_TIMINGS_OUT: ci-timings/raw-e2e-pwa.json
        run: yarn e2e:pwa

      # [15.1]: the main record always exists (this step is `if: always()`);
      # the PWA one only does on the one matrix leg that ran it (chromium,
      # last shard). Rather than a 4th `matrix.shard == 3` pin duplicating
      # the invariant the comment above already tracks, this checks for the
      # raw PWA file directly — the file's presence *is* the signal that the
      # PWA step ran, so this stays correct even if the "lightest shard"
      # this suite is pinned to ever moves.
      - name: Collect E2E timings
        if: always()
        run: |
          node scripts/ci-timings.mjs collect --runner playwright --suite e2e-${{ matrix.browser }}-${{ matrix.shard }} --job "E2E (${{ matrix.browser }} ${{ matrix.shard }}/3)" --in ci-timings/raw-e2e-${{ matrix.browser }}-${{ matrix.shard }}.json --out ci-timings/e2e-${{ matrix.browser }}-${{ matrix.shard }}.json
          if [ -f ci-timings/raw-e2e-pwa.json ]; then
            node scripts/ci-timings.mjs collect --runner playwright --suite e2e-pwa --job "E2E (${{ matrix.browser }} ${{ matrix.shard }}/3)" --in ci-timings/raw-e2e-pwa.json --out ci-timings/e2e-pwa.json
          fi

      # Artifact name includes both browser and shard — REQUIRED, not
      # cosmetic: this job is a 3-way (browser x shard) matrix, and
      # `actions/upload-artifact@v7` errors on two legs uploading the same
      # artifact name within one run.
      - name: Upload E2E timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-timings-e2e-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            ci-timings/e2e-${{ matrix.browser }}-${{ matrix.shard }}.json
            ci-timings/e2e-pwa.json
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload PWA Playwright report
        if: failure() && matrix.browser == 'chromium' && matrix.shard == 3
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-pwa
          path: playwright-report-pwa/
          if-no-files-found: ignore

      - name: Upload PWA traces, screenshots and videos
        if: failure() && matrix.browser == 'chromium' && matrix.shard == 3
        uses: actions/upload-artifact@v7
        with:
          name: test-results-pwa
          path: test-results-pwa/
          if-no-files-found: ignore

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  bundle-delta:
    name: Bundle size delta
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        run: yarn build:shared

      - name: Build report (PR)
        run: yarn workspace @biddaloy/client-admin check:route-chunks

      # Baseline = the latest successful main run's artifact — one build
      # instead of two (~1.5 min saved). The delta reads "current main vs
      # this PR" rather than the PR's exact merge-base; fine for a drift
      # signal, the hard ceiling still gates absolutes.
      - name: Download baseline report from latest main run
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" -q '.workflow_runs[0].id')
          gh run download "$RUN_ID" -n route-chunks-report -D baseline || echo "no baseline yet"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compose delta comment
        run: node scripts/bundle-delta.mjs baseline/route-chunks-report.json client-admin/dist/route-chunks-report.json delta.md

      - name: Post sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: bundle-delta
          path: delta.md

  storybook:
    name: Storybook build
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Storybook resolves @biddaloy/shared through the ui vite config's
      # alias; if the build errors on shared imports, add `yarn build:shared`
      # above this step (same caveat as the frontend job).
      - name: Build Storybook
        run: yarn workspace @biddaloy/ui build-storybook

      - name: Upload Storybook static build
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: ui/storybook-static/
          retention-days: 14

  # Not PR-blocking (#149): full stack boot + 3 routes x 3 runs would
  # become the wall and break #307's <4-min PR target. A perf regression
  # is caught at merge instead; revisit if that proves too late.
  lighthouse:
    name: Lighthouse (3G budgets)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biddaloy_lighthouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/biddaloy_lighthouse
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-lighthouse-jwt-secret-do-not-use-in-production-1234567890
      NODE_ENV: test
      SEED_ADMIN_PASSWORD: ci-lighthouse-seed-password-123
      SETTINGS_ENCRYPTION_KEY: YmSqNpwxzusjAF12JSD+JNe+3LXrbNJiQza2yTnQyR0=
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        run: yarn build:shared

      - name: Run migrations
        run: yarn workspace @biddaloy/server migration:run

      - name: Seed database
        run: yarn workspace @biddaloy/server seed

      # Production builds on both sides — never the dev servers.
      - name: Build and start server
        run: |
          yarn build:server
          node server/dist/main.js &

      - name: Build and start client preview
        run: |
          yarn build:client-admin
          yarn workspace @biddaloy/client-admin preview --port 5174 &

      - name: Wait for server and client
        run: npx wait-on tcp:3000 tcp:5174 --timeout 120000

      - name: Resolve seeded student detail URL
        id: student
        # Assigned on its own line, never inside the `echo` (#356): command
        # substitution discards the resolver's exit status, so the old
        # one-liner *succeeded* while writing an empty `url=`, and lhci then
        # died on `--collect.url=` with `TypeError: Invalid URL`. Worse, the
        # same shape meant a URL could silently drop out of the measured set
        # while this job stayed green. `set -euo pipefail` + an explicit
        # non-empty check make both failures loud.
        run: |
          set -euo pipefail
          url="$(node scripts/lighthouse-student-url.mjs)"
          if [ -z "${url//[[:space:]]/}" ]; then
            echo "::error::lighthouse-student-url.mjs produced no URL" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # These flags override lighthouserc.cjs's own url list entirely, so a URL
      # added there is a no-op in CI unless it is added here too. /portal comes
      # last on purpose: it is the only guardian-authenticated URL, and
      # lighthouse-auth.cjs re-logs-in whenever the required identity changes,
      # so measuring it last costs exactly one extra login.
      - name: Lighthouse
        run: >
          npx lhci autorun
          --collect.url=http://localhost:5174/login
          --collect.url=http://localhost:5174/fees/dues
          --collect.url=${{ steps.student.outputs.url }}
          --collect.url=http://localhost:5174/portal

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore

  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: yarn audit (fails on new high/critical, ignores allowlisted advisories)
        run: node scripts/ci-audit.js

  # [15.1] "tests got slower" needs to be a graph, not a feeling — this
  # publishes wall/work/gap, a per-job budget verdict, and the top-10
  # slowest files as a job summary, on every run, so nobody has to open logs
  # to see it. `if: always()` is required so a red run — the run whose
  # timing usually matters most — still gets a summary.
  #
  # `needs:` MUST list every job above that can produce a `ci-timings-*`
  # artifact, or that otherwise finishes test work (bundle-delta, storybook,
  # lighthouse, audit have no timing artifact of their own today, but their
  # `completed_at` still feeds wall/work via the Jobs API). Add a job above
  # without adding it here and this job starts — and queries the Jobs API —
  # before that job finishes, silently under-reporting wall time.
  timings:
    name: Test timings & budgets
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, verify, frontend, integration, e2e, bundle-delta, storybook, lighthouse, audit]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Every `ci-timings-*` artifact from this run, whichever jobs actually
      # produced one. `|| echo` because a run where every test-producing job
      # was path-filtered out (a docs-only PR) uploads zero timing
      # artifacts, and that must not fail this job — same "in-progress
      # current run" `gh run download` mechanism the coverage and
      # bundle-size baselines already use (see README's CI section), just
      # against this run instead of a past one.
      - name: Download timing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -p 'ci-timings-*' -D ci-timings || echo "no timing artifacts to download"

      - name: Fetch job timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > jobs.json

      - name: Summarize
        # `--out`, not `>> $GITHUB_STEP_SUMMARY`. The markdown has to reach the
        # step summary, but the `::warning::` lines have to reach the step LOG —
        # that is where GitHub parses workflow commands from. Redirecting all of
        # stdout sends the annotations into the summary file, where they render
        # as literal `::warning title=...` text and no annotation is ever created.
        run: node scripts/ci-timings.mjs summarize --records ci-timings --jobs jobs.json --budgets ci-budgets.json --out "$GITHUB_STEP_SUMMARY"
