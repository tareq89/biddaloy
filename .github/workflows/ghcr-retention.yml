name: GHCR retention

# [Epic 79 #2794 W5] Weekly: keep the newest 30 tagged images of each package, delete the rest.
# A version on GHCR is one manifest, not one image: a push can add an index, the image manifest
# and an attestation manifest. ghcr-cleanup-action counts tagged images and deletes an image
# together with its children, so it never cuts part of a kept image (a plain "keep N versions"
# cut could, and that sha would no longer pull). `main` is always kept.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [biddaloy-app, biddaloy-backup, biddaloy-demo-reset, biddaloy-landing]
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ matrix.package }}
          keep-n-tagged: 30
          exclude-tags: main
          # Untagged leftovers (a superseded `main`), never the children of a kept image.
          delete-untagged: true
          validate: true
