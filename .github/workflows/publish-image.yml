name: Publish images

# [1766 D10] Every merge to main publishes the three images to GHCR, tagged
# with the commit SHA and `main`, so the production VM only ever pulls.
# GITHUB_TOKEN pushes; SENTRY_AUTH_TOKEN (optional) uploads source maps.
# The app image is built, checked for SPA source maps, and only then pushed.
# [Epic 79 #2794] Four images: app, backup, demo-reset, landing.
# A manual run (workflow_dispatch) on any other branch publishes only the
# `<sha>` tags, so a branch can be deployed to a test VM before it merges.
# `:main` is written only by main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One group per commit: a shared group keeps only one pending run, so quick
# merges would cancel the middle commit's run and its <sha> images would never
# exist. `:main` may then be written out of order; production pins the SHA.
concurrency:
  group: publish-image-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/tareq89

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build into the local docker store first (no push): the source-map check runs on the exact
      # image that `docker push` sends afterwards, so a leaking image never reaches GHCR.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/biddaloy-app:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/biddaloy-app:main', env.REGISTRY) || '' }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      # Vite maps are for Sentry only; none may ship in the SPA. Scoped to /app/client-admin:
      # server/dist (tsconfig sourceMap) and node_modules carry .map files on purpose.
      - name: SPA has no source maps
        run: |
          out=$(docker run --rm --entrypoint sh "$REGISTRY/biddaloy-app:${{ github.sha }}" -c 'cd /app/client-admin && find . -name "*.map" | head -1')
          [ -z "$out" ] || { echo "source map in image: $out"; exit 1; }
      # A package only a dev install provides would crash prod at boot ("Cannot find module").
      - name: Image resolves every module the server requires
        run: docker run --rm -v "$PWD/scripts/check-image-requires.cjs:/check.cjs:ro" "$REGISTRY/biddaloy-app:${{ github.sha }}" node /check.cjs
      - name: Push
        run: |
          docker push "$REGISTRY/biddaloy-app:${{ github.sha }}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then docker push "$REGISTRY/biddaloy-app:main"; fi

  # demo-reset is `FROM app`, so it builds after the app image is pushed.
  # backup is independent but rides along (small, cached).
  satellites:
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: biddaloy-backup
            context: scripts/backup
            app_context: ""
            extra_context: ""
          - image: biddaloy-demo-reset
            context: scripts/demo
            app_context: app=docker-image://ghcr.io/tareq89/biddaloy-app:${{ github.sha }}
            # db-swap.sh is copied from the backup context (scripts/demo/Dockerfile).
            extra_context: backup=scripts/backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          build-contexts: |
            ${{ matrix.app_context }}
            ${{ matrix.extra_context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}:main', env.REGISTRY, matrix.image) || '' }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # Static site: built on the runner (Chromium renders the PDFs), then wrapped in nginx.
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_UMAMI_ID: ${{ vars.PUBLIC_UMAMI_ID }}
      PUBLIC_UMAMI_SRC: ${{ vars.PUBLIC_UMAMI_SRC }}
      PUBLIC_CLARITY_ID: ${{ vars.PUBLIC_CLARITY_ID }}
      PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
      PUBLIC_WA_NUMBER: ${{ vars.PUBLIC_WA_NUMBER }}
      PUBLIC_AIPRAKTOR_SITE: ${{ vars.PUBLIC_AIPRAKTOR_SITE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: yarn workspace @biddaloy/landing build
      - run: node landing/scripts/check-tokens.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: landing
          push: true
          tags: |
            ${{ env.REGISTRY }}/biddaloy-landing:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/biddaloy-landing:main', env.REGISTRY) || '' }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
