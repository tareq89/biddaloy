name: Publish images

# [1766 D10] Every merge to main publishes the three images to GHCR, tagged
# with the commit SHA and `main`, so the production VM only ever pulls.
# Only GITHUB_TOKEN is used; the two VITE_* values are repo variables (public
# in the bundle anyway).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One group per commit: a shared group keeps only one pending run, so quick
# merges would cancel the middle commit's run and its <sha> images would never
# exist. `:main` may then be written out of order; production pins the SHA.
concurrency:
  group: publish-image-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/tareq89

jobs:
  app:
    # workflow_dispatch can start on any branch; only main may publish `:main`.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/biddaloy-app:${{ github.sha }}
            ${{ env.REGISTRY }}/biddaloy-app:main
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
            VITE_SUPPORT_URL=${{ vars.VITE_SUPPORT_URL }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  # demo-reset is `FROM app`, so it builds after the app image is pushed.
  # backup is independent but rides along (small, cached).
  satellites:
    needs: app
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: biddaloy-backup
            context: scripts/backup
            app_context: ""
          - image: biddaloy-demo-reset
            context: scripts/demo
            app_context: app=docker-image://ghcr.io/tareq89/biddaloy-app:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          build-contexts: ${{ matrix.app_context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:main
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
