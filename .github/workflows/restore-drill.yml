name: Restore drill

# Proves the backup/restore path end-to-end on a disposable environment:
# seed a database, back it up (encrypted), restore it into a second empty
# database, and diff integrity counts between the two. Runs on pull requests
# that touch the backup scripts, and on demand. The real weekly drill against
# R2 runs in the backup container (docs/architecture/13-backup-restore.md).
on:
  pull_request:
    paths:
      - scripts/backup/**
      - .github/workflows/restore-drill.yml
  workflow_dispatch:

env:
  NODE_VERSION: "24"

jobs:
  restore-drill:
    name: Backup + restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biddaloy_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The e2e seed boots AppModule, which refuses to start without Redis.
      redis:
        image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      seaweedfs:
        image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
        env:
          AWS_ACCESS_KEY_ID: drill-access-key
          AWS_SECRET_ACCESS_KEY: drill-secret-key
          S3_BUCKET: biddaloy-drill
        ports:
          - 9000:8333
        options: >-
          --health-cmd "curl -sf -o /dev/null http://localhost:8333/status && curl -sf -o /dev/null http://localhost:8888/buckets/biddaloy-drill/"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/biddaloy_drill
      RESTORE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/biddaloy_drill_restored
      JWT_SECRET: ci-restore-drill-jwt-secret-do-not-use-1234567890
      NODE_ENV: test
      SEED_ADMIN_PASSWORD: ci-restore-drill-seed-password-123
      S3_ENDPOINT: http://localhost:9000
      S3_ALLOW_INSECURE_HTTP: "true"
      S3_REGION: us-east-1
      S3_BUCKET: biddaloy-drill
      S3_ACCESS_KEY_ID: drill-access-key
      S3_SECRET_ACCESS_KEY: drill-secret-key
      S3_FORCE_PATH_STYLE: "true"
      BACKUP_RETENTION_DAYS: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        run: yarn build:shared

      - name: Install age and matching postgresql-18 client tools
        # Pinned to the -18 client package deliberately — client and server
        # majors must match. An older pg_dump refuses a newer server, and a
        # newer pg_restore can emit settings an older server rejects
        # (confirmed locally: an 18 pg_restore into pg16 fails with
        # "unrecognized configuration parameter transaction_timeout").
        # Ubuntu's own archive has no -18 client, so add the PGDG repo first.
        # The runner also ships a PostgreSQL 16 cluster, and Ubuntu's
        # pg_dump wrapper picks that cluster's version over the newest
        # client, so the -18 bin dir goes first on PATH.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y age postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version


      # aws-cli ships preinstalled on GitHub-hosted ubuntu runners.
      - name: Verify aws-cli is available
        run: aws --version

      - name: Generate a throwaway age keypair
        run: |
          age-keygen -o "$RUNNER_TEMP/drill-key.txt" 2>"$RUNNER_TEMP/keygen.log"
          echo "AGE_PUBLIC_KEY=$(grep 'Public key:' "$RUNNER_TEMP/keygen.log" | sed 's/.*: //')" >> "$GITHUB_ENV"
          echo "BACKUP_AGE_PRIVATE_KEY_FILE=$RUNNER_TEMP/drill-key.txt" >> "$GITHUB_ENV"

      - name: Run migrations + e2e seed
        run: |
          yarn workspace @biddaloy/server migration:run
          yarn workspace @biddaloy/server seed

      - name: Upload a test logo through StorageService
        id: upload-logo
        run: |
          output=$(yarn --silent ts-node -P server/tsconfig.json scripts/backup/upload-test-object.ts)
          echo "$output"
          key=$(echo "$output" | grep '^key=' | sed 's/^key=//')
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Run backup.sh
        env:
          BACKUP_AGE_PUBLIC_KEY: ${{ env.AGE_PUBLIC_KEY }}
        run: bash scripts/backup/backup.sh

      - name: Create the second, empty database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c "CREATE DATABASE biddaloy_drill_restored;"

      - name: Find the backup object just uploaded
        id: latest-backup
        env:
          AWS_ACCESS_KEY_ID: ${{ env.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.S3_REGION }}
        run: |
          key=$(aws s3api list-objects-v2 \
            --endpoint-url "$S3_ENDPOINT" \
            --bucket "$S3_BUCKET" \
            --prefix "backups/db/" \
            --query 'sort_by(Contents, &LastModified)[-1].Key' \
            --output text)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Run restore.sh
        run: |
          bash scripts/backup/restore.sh \
            "${{ steps.latest-backup.outputs.key }}" \
            "$RESTORE_DATABASE_URL"

      - name: Verify the restored object still exists in the bucket
        run: |
          yarn --silent ts-node -P server/tsconfig.json scripts/backup/verify-test-object.ts \
            "${{ steps.upload-logo.outputs.key }}"

      - name: Verify counts on both databases and diff
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d biddaloy_drill \
            -f scripts/backup/verify.sql -t -A -F',' > "$RUNNER_TEMP/before.csv"
          PGPASSWORD=postgres psql -h localhost -U postgres -d biddaloy_drill_restored \
            -f scripts/backup/verify.sql -t -A -F',' > "$RUNNER_TEMP/after.csv"
          if ! diff -u "$RUNNER_TEMP/before.csv" "$RUNNER_TEMP/after.csv"; then
            echo "::error::Integrity counts differ between the source and restored database"
            exit 1
          fi
          echo "Counts match — restore verified."
