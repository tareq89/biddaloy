name: Nightly quality

# [18.1.1] Lighthouse moved off the PR/push path (ci.yml) and onto this
# nightly schedule. It was never PR-blocking to begin with (#149's
# `if: github.event_name == 'push' || ...'` already deferred it to
# push-to-main), but it had gone red on every main run since 2026-08-24
# (see ci-budgets.json's note) without anyone reliably noticing — a
# dedicated nightly run with its own workflow surfaces that directly,
# instead of being one job in a much bigger, mostly-unrelated run.
#
# `workflow_call` (no inputs) lets another workflow invoke this job
# on demand without duplicating it — mirrors the `workflow_dispatch`
# affordance ci.yml's lighthouse job used to have, but as a proper reusable
# job instead of a trigger on the big CI workflow.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: nightly-quality
  cancel-in-progress: false

jobs:
  # Not PR-blocking (#149): full stack boot + 3 routes x 3 runs would
  # become the wall and break #307's <4-min PR target. A perf regression
  # is caught here instead; revisit if that proves too late.
  lighthouse:
    name: Lighthouse (3G budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biddaloy_lighthouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/biddaloy_lighthouse
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-lighthouse-jwt-secret-do-not-use-in-production-1234567890
      NODE_ENV: test
      SEED_ADMIN_PASSWORD: ci-lighthouse-seed-password-123
      SETTINGS_ENCRYPTION_KEY: YmSqNpwxzusjAF12JSD+JNe+3LXrbNJiQza2yTnQyR0=
      # [15.5] See ci.yml's "integration" job's identical block.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: biddaloy-ci
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      S3_ALLOW_INSECURE_HTTP: 'true'
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build shared package
        run: yarn build:shared

      - name: Build site-themes package
        run: yarn build:site-themes

      - name: Run migrations
        run: yarn workspace @biddaloy/server migration:run

      - name: Seed database
        run: yarn workspace @biddaloy/server seed

      # Production builds on both sides — never the dev servers.
      - name: Build and start server
        run: |
          yarn build:server
          node server/dist/main.js &

      - name: Build and start client preview
        run: |
          yarn build:client-admin
          yarn workspace @biddaloy/client-admin preview --port 5174 &

      - name: Wait for server and client
        run: npx wait-on tcp:3000 tcp:5174 --timeout 120000

      - name: Resolve seeded student detail URL
        id: student
        # Assigned on its own line, never inside the `echo` (#356): command
        # substitution discards the resolver's exit status, so the old
        # one-liner *succeeded* while writing an empty `url=`, and lhci then
        # died on `--collect.url=` with `TypeError: Invalid URL`. Worse, the
        # same shape meant a URL could silently drop out of the measured set
        # while this job stayed green. `set -euo pipefail` + an explicit
        # non-empty check make both failures loud.
        run: |
          set -euo pipefail
          url="$(node scripts/lighthouse-student-url.mjs)"
          if [ -z "${url//[[:space:]]/}" ]; then
            echo "::error::lighthouse-student-url.mjs produced no URL" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # These flags override lighthouserc.cjs's own url list entirely, so a URL
      # added there is a no-op in CI unless it is added here too. /portal comes
      # last on purpose: it is the only guardian-authenticated URL, and
      # lighthouse-auth.cjs re-logs-in whenever the required identity changes,
      # so measuring it last costs exactly one extra login.
      - name: Lighthouse
        run: >
          npx lhci autorun
          --collect.url=http://localhost:5174/login
          --collect.url=http://localhost:5174/fees/dues
          --collect.url=${{ steps.student.outputs.url }}
          --collect.url=http://localhost:5174/portal

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore

  # [40.4.09] Theme screenshots for the school websites. The site e2e specs write their
  # screenshots into the committed site/e2e/__screenshots__/<theme>/ (stub API, no database), so
  # a changed theme shows up as a diff against the committed baseline. The diff is printed and the
  # images uploaded, not failed on: font rendering differs a little between runners. A spec
  # failure (page broken, overflow) does fail the job.
  site-themes:
    name: Site theme screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: yarn build:shared
      - run: yarn build:site-themes
      - run: yarn workspace @biddaloy/site build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Site e2e (writes the theme screenshots)
        run: yarn workspace @biddaloy/site e2e

      - name: Screenshot diff against the committed baseline
        if: always()
        run: |
          git status --short -- site/e2e/__screenshots__ | tee screenshot-diff.txt
          {
            echo "### Changed theme screenshots"
            echo '```'
            cat screenshot-diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-theme-screenshots
          path: site/e2e/__screenshots__/
          retention-days: 14

  # [40.4.09] (moved here from ci.yml by [101.1.01], D6) Budget gate for school websites (D21, D38): the real API with the demo school,
  # the built site, Lighthouse on a mobile profile. Thresholds live in lighthouserc.site.cjs;
  # raising one is a decision, never a CI fix. Same path filter as `site` (plus the website
  # server module), so a PR that cannot change a school page does not pay for it.
  site-budget:
    name: Site budget (Lighthouse)
    # ci.yml's `quality` job calls this whole workflow in the merge queue; these two budgets are
    # nightly-only (D6), so the queue skips them.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biddaloy_demo_site_budget # seed:demo refuses any name not starting biddaloy_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      seaweedfs:
        image: chrislusf/seaweedfs:4.48
        env:
          AWS_ACCESS_KEY_ID: ci-access-key
          AWS_SECRET_ACCESS_KEY: ci-secret-key
          S3_BUCKET: biddaloy-ci
        ports:
          - 9000:8333
        options: >-
          --health-cmd "curl -sf -o /dev/null http://localhost:8333/status && curl -sf -o /dev/null http://localhost:8888/buckets/biddaloy-ci/"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/biddaloy_demo_site_budget
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-site-budget-jwt-secret-do-not-use-in-production-1234567890
      SEED_ADMIN_PASSWORD: ci-site-budget-seed-password-123
      SETTINGS_ENCRYPTION_KEY: YmSqNpwxzusjAF12JSD+JNe+3LXrbNJiQza2yTnQyR0=
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: biddaloy-ci
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      S3_ALLOW_INSECURE_HTTP: 'true'
      S3_FORCE_PATH_STYLE: 'true'
      SITE_ROOT_DOMAIN: site.localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: yarn build:shared
      - run: yarn build:site-themes

      # NODE_ENV=test only where the API and seed need it. Set job-wide it leaks into `astro build`
      # and produces a React dev build (slow pages, wrong Lighthouse numbers).
      - name: Migrate and seed the demo school
        env:
          NODE_ENV: test
        run: |
          yarn workspace @biddaloy/server migration:run
          yarn workspace @biddaloy/server seed:demo --scale 0.05 --years 2

      - name: Build and start the API
        env:
          NODE_ENV: test
        run: |
          yarn build:server
          node server/dist/main.js &

      - name: Build and start the site
        run: |
          yarn workspace @biddaloy/site build
          HOST=127.0.0.1 PORT=4321 SITE_API_BASE=http://localhost:3000/api/v1 SITE_PREVIEW_PATHS=1 \
            node site/dist/server/entry.mjs &

      # The demo school's subdomain is its tenant slug (bmsc-high).
      - name: Point the demo school host at localhost
        run: echo "127.0.0.1 bmsc-high.site.localhost" | sudo tee -a /etc/hosts

      - name: Wait for the API and the site
        run: npx wait-on tcp:3000 http://bmsc-high.site.localhost:4321/bn/ --timeout 120000

      - name: Lighthouse budget (school site)
        run: npx lhci autorun --config lighthouserc.site.cjs

      - name: Upload site reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-reports
          path: .lighthouseci-site/
          # .lighthouseci-site/ is a dot-directory; upload-artifact skips those by default.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # [50.13] (moved here from ci.yml by [101.1.01], D6) Landing Lighthouse budget.
  # The landing build, token check and Playwright smoke stay in ci.yml.
  landing-budget:
    name: Landing budget (Lighthouse)
    # ci.yml's `quality` job calls this whole workflow in the merge queue; these two budgets are
    # nightly-only (D6), so the queue skips them.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Before the build: build-collateral.mjs renders the PDFs with Chromium.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build landing
        run: yarn workspace @biddaloy/landing build

      - name: Serve landing dist
        run: yarn workspace @biddaloy/landing serve &

      - name: Wait for the landing server
        run: yarn workspace @biddaloy/landing exec wait-on http://localhost:4321/bn/ --timeout 60000

      - name: Lighthouse budget (landing)
        run: npx lhci autorun --config lighthouserc.landing.cjs

      - name: Upload landing reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-reports
          path: .lighthouseci-landing/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # [#759] Sticky-issue failure visibility — see
  # scripts/nightly-sticky-issue.sh's header. This workflow declares
  # `workflow_call` (nothing calls it that way yet, but the trigger makes
  # it reusable in future); `report` only reacts to `needs.lighthouse.result`,
  # so it stays correct whatever triggers the run.
  report:
    name: Report nightly status
    needs: [lighthouse, site-themes, site-budget, landing-budget]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.lighthouse.result }}" = "success" ] && [ "${{ needs.site-themes.result }}" = "success" ] \
             && { [ "${{ needs.site-budget.result }}" = "success" ] || [ "${{ needs.site-budget.result }}" = "skipped" ]; } \
             && { [ "${{ needs.landing-budget.result }}" = "success" ] || [ "${{ needs.landing-budget.result }}" = "skipped" ]; }; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Write report body
        if: steps.status.outputs.status == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Nightly quality (Lighthouse) failed."
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Failed jobs:"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
              --jq '.jobs[] | select(.conclusion=="failure") | "- " + .name' \
              || echo "- (unable to list failed jobs — see run link above)"
          } > nightly-report.md

      - name: Report status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/nightly-sticky-issue.sh \
            nightly-quality-red \
            "Nightly quality (Lighthouse) is red" \
            nightly-report.md \
            "${{ steps.status.outputs.status }}"
