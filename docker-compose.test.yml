# [18.4.2] Local mirror of ci.yml's `integration` job services, so
# `yarn test:server` runs the full server suite against real Postgres,
# Redis and MinIO with only Docker installed — no manual setup.
#
# Images, ports and env values are kept in lockstep with
# .github/workflows/ci.yml's `integration` job (postgres/redis service
# blocks + the "Start MinIO" / "Create MinIO bucket" steps). If those
# change, update both.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biddaloy_test
    ports:
      - '5432:5432'
    volumes:
      - biddaloy-test-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - biddaloy-test-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ci-access-key
      MINIO_ROOT_PASSWORD: ci-secret-key
    ports:
      - '9000:9000'
    volumes:
      - biddaloy-test-minio:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket integration tests expect (biddaloy-ci,
  # same name as ci.yml's `S3_BUCKET`), then exits. `db:test:up` waits on
  # this via --wait, so callers don't have to create the bucket by hand.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ci-access-key ci-secret-key &&
      mc mb --ignore-existing local/biddaloy-ci &&
      exit 0
      "

volumes:
  biddaloy-test-postgres:
  biddaloy-test-redis:
  biddaloy-test-minio:
