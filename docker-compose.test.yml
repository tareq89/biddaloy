# [18.4.2] Local mirror of ci.yml's `integration` job services, so
# `yarn test:server` runs the full server suite against real Postgres,
# Redis and SeaweedFS with only Docker installed — no manual setup.
#
# Images, ports and env values are kept in lockstep with
# .github/workflows/ci.yml's `integration` job (postgres/redis/seaweedfs
# service blocks). If those change, update both.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biddaloy_test
    ports:
      - '5432:5432'
    volumes:
      - biddaloy-test-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - biddaloy-test-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    environment:
      AWS_ACCESS_KEY_ID: ci-access-key
      AWS_SECRET_ACCESS_KEY: ci-secret-key
      S3_BUCKET: biddaloy-ci
    ports:
      - '9000:8333'
    volumes:
      - biddaloy-test-seaweedfs:/data
    healthcheck:
      test: ['CMD', 'curl', '-sf', '-o', '/dev/null', 'http://localhost:8888/buckets/biddaloy-ci/']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  biddaloy-test-postgres:
  biddaloy-test-redis:
  biddaloy-test-seaweedfs:
