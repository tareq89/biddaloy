services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: beton-boi-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redisdata:/data
    # Bound to loopback only — reachable for local `yarn start:dev`, not exposed
    # publicly. Note this is the IPv4 loopback specifically, so the app's
    # REDIS_URL default is "redis://127.0.0.1:6379" rather than "localhost":
    # ioredis >=5.8.2 defaults to family:0 and lets the OS resolve, and on a
    # dual-stack host "localhost" commonly resolves to ::1 first — which nothing
    # is listening on.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to localhost only — reachable for migrations/psql, not exposed publicly.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Generates a short-lived self-signed cert if none exists yet, so nginx has
  # something to load on first boot before certbot has ever run. See
  # nginx/generate-dummy-cert.sh and the README for the real first-issuance
  # flow that replaces it.
  cert-bootstrap:
    image: certbot/certbot
    entrypoint: ["sh", "/scripts/generate-dummy-cert.sh"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - certs:/etc/letsencrypt
      - ./nginx/generate-dummy-cert.sh:/scripts/generate-dummy-cert.sh:ro
    restart: "no"

  # Renews certbot-issued certs on a loop. Does NOT perform first issuance —
  # that's a one-off manual command (see README) since it needs --email and
  # --staging/production endpoint choices a human should make deliberately.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/reload-loop.sh:/docker-entrypoint.d/99-reload-loop.sh:ro
      - certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_started
      cert-bootstrap:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  certs:
  certbot-webroot:
