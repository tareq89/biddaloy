# LOCAL DEV ONLY: db, redis, seaweedfs and mailpit on loopback ports. The production stack lives in
# deploy/ (stack.yml, edge.yml, ops.yml); docker-compose.build.yml builds it locally.
# Rotate container logs: 3 x 10 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # Test inbox (Epic 87): catches every email/SMS the app sends while MESSAGE_SINK=mailpit, which
  # .env.example turns on. No profile here, so `docker compose up` starts it with the rest; UI at
  # http://localhost:8025. In memory: a restart empties it.
  mailpit:
    logging: *logging
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: '1000'
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    # The image is scratch-based (no wget/curl): the binary has its own readiness probe.
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    logging: *logging
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # --databases 64: scripts/test-env.sh gives each parallel test run its
    # own block of 5 db slots (slot 0 stays the app's); 16 fits only 2 runs.
    command: ['redis-server', '--appendonly', 'yes', '--databases', '64']
    restart: unless-stopped
    volumes:
      - redisdata:/data
    # Bound to loopback only — reachable for local `yarn start:dev`, not exposed
    # publicly. Note this is the IPv4 loopback specifically, so the app's
    # REDIS_URL default is "redis://127.0.0.1:6379" rather than "localhost":
    # ioredis >=5.8.2 defaults to family:0 and lets the OS resolve, and on a
    # dual-stack host "localhost" commonly resolves to ::1 first — which nothing
    # is listening on.
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    logging: *logging
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    # The default 100 runs out locally: the dev server plus several parallel
    # test runs (scripts/test-env.sh), each with 4 vitest workers' pools.
    command: ['postgres', '-c', 'max_connections=300']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    # Postgres 18+ images keep data in /var/lib/postgresql/18/docker and
    # refuse to start if /var/lib/postgresql/data is a mount, so the volume
    # sits one level up. A volume holding Postgres 16 data won't open on 18:
    # drop it locally (`docker compose down -v`) or dump and restore.
    volumes:
      - pgdata:/var/lib/postgresql
    # Bound to localhost only — reachable for migrations/psql, not exposed publicly.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:?POSTGRES_DB must be set}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    logging: *logging
    # SeaweedFS `mini` = master + volume + filer + S3 gateway in one
    # process. It creates S3_BUCKET on boot if missing (idempotent), which
    # replaces the old one-shot bucket-init service. Official image lives
    # on Docker Hub; keep the tag pinned.
    image: chrislusf/seaweedfs:4.50@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    restart: unless-stopped
    command: ['mini', '-dir=/data', '-webdav=false', '-admin.ui=false']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
      S3_BUCKET: ${S3_BUCKET:-biddaloy}
    volumes:
      - seaweedfsdata:/data
    # Loopback only, same posture as db/redis. S3 is 8333 in the
    # container; 9000 on the host keeps every local S3_ENDPOINT unchanged.
    ports:
      - '127.0.0.1:9000:8333'
    # Healthy = S3 up AND the bucket exists. /status on 8333 is
    # unauthenticated and proves the S3 listener itself is serving — the
    # filer's /buckets/<name>/ alone can return 200 before 8333 is ready,
    # which would let app/backup start against a not-yet-serving S3.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf -o /dev/null http://localhost:8333/status && curl -sf -o /dev/null http://localhost:8888/buckets/${S3_BUCKET:-biddaloy}/',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  seaweedfsdata:
