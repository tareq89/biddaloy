services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: biddaloy-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-biddaloy}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - '3000'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    restart: unless-stopped
    volumes:
      - redisdata:/data
    # Bound to loopback only — reachable for local `yarn start:dev`, not exposed
    # publicly. Note this is the IPv4 loopback specifically, so the app's
    # REDIS_URL default is "redis://127.0.0.1:6379" rather than "localhost":
    # ioredis >=5.8.2 defaults to family:0 and lets the OS resolve, and on a
    # dual-stack host "localhost" commonly resolves to ::1 first — which nothing
    # is listening on.
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to localhost only — reachable for migrations/psql, not exposed publicly.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - miniodata:/data
    # Bound to loopback only, same posture as db/redis — the app talks to
    # it over the compose network, not the host network.
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: creates the app's bucket if it doesn't already exist, then
  # exits. `app` doesn't depend on this completing (only on minio itself
  # being healthy) since the bucket only needs to exist once, not on every
  # boot — but on a fresh volume this is what makes `docker compose up`
  # produce a working bucket with zero manual steps.
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-biddaloy}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY_ID\" \"$$S3_SECRET_ACCESS_KEY\" &&
             mc mb --ignore-existing local/$$S3_BUCKET"

  # Daily encrypted pg_dump to the bucket — see scripts/backup/README.md.
  # Only needs `db` (to dump) and `minio` (to upload to in dev); it does
  # not sit on the app's request path, so it isn't in `app`'s depends_on.
  backup:
    build:
      context: ./scripts/backup
      dockerfile: Dockerfile
    image: biddaloy-backup
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BACKUP_AGE_PUBLIC_KEY: ${BACKUP_AGE_PUBLIC_KEY}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      SENTRY_CRON_MONITOR_URL: ${SENTRY_CRON_MONITOR_URL:-}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-biddaloy}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Generates a short-lived self-signed cert if none exists yet, so nginx has
  # something to load on first boot before certbot has ever run. See
  # nginx/generate-dummy-cert.sh and the README for the real first-issuance
  # flow that replaces it.
  cert-bootstrap:
    image: certbot/certbot
    entrypoint: ['sh', '/scripts/generate-dummy-cert.sh']
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - certs:/etc/letsencrypt
      - ./nginx/generate-dummy-cert.sh:/scripts/generate-dummy-cert.sh:ro
    restart: 'no'

  # Renews certbot-issued certs on a loop. Does NOT perform first issuance —
  # that's a one-off manual command (see README) since it needs --email and
  # --staging/production endpoint choices a human should make deliberately.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/reload-loop.sh:/docker-entrypoint.d/99-reload-loop.sh:ro
      - certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_started
      cert-bootstrap:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  miniodata:
  certs:
  certbot-webroot:
