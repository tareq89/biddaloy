services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Inlined into the client bundle at build time (see .env.example).
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_SUPPORT_URL: ${SUPPORT_CONTACT_URL:-}
    image: biddaloy-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # SeaweedFS isn't TLS-terminated on this shared Compose network yet — see
      # "Known gap: SeaweedFS traffic is not TLS-terminated" in
      # docs/architecture/08-security.md. The opt-in below documents that
      # this is a deliberate, tracked exception, not an unnoticed default.
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ALLOW_INSECURE_HTTP: 'true'
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-biddaloy}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
      S3_FORCE_PATH_STYLE: 'true'
      # Public https origin; invitation, reset and social sign-in links are
      # built from it. Required in production (see .env.example).
      APP_BASE_URL: ${APP_BASE_URL:-}
      # Public https origin of invoice share links (`/i/<token>`). Required in production.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # Opt-in token for /api/health/ready (12-operations.md); unset = that route 404s.
      HEALTH_TOKEN: ${HEALTH_TOKEN:-}
      # Both are required to boot in production (encryption-key.ts, db-ssl.ts).
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      DB_SSL: ${DB_SSL:-}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-}
      # Onboarding (Epic 13). Empty means "off": no captcha check, no social
      # sign-in button, no support link. The trial values repeat the server's
      # defaults here because an empty TRIAL_* fails env validation.
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_OAUTH_CLIENT_ID: ${FACEBOOK_OAUTH_CLIENT_ID:-}
      FACEBOOK_OAUTH_CLIENT_SECRET: ${FACEBOOK_OAUTH_CLIENT_SECRET:-}
      SUPPORT_CONTACT_URL: ${SUPPORT_CONTACT_URL:-}
      OTP_SMS_ALLOWED_PREFIXES: ${OTP_SMS_ALLOWED_PREFIXES:-+880}
      TRIAL_DAYS: ${TRIAL_DAYS:-30}
      TRIAL_SEAT_LIMIT: ${TRIAL_SEAT_LIMIT:-10}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    expose:
      - '3000'
    # /api/health is unthrottled; busybox wget ships in node:*-alpine.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      # nginx waits for this (service_healthy): give a slow cold boot ~2 min before compose gives up.
      start_period: 60s

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # --databases 64: scripts/test-env.sh gives each parallel test run its
    # own block of 5 db slots (slot 0 stays the app's); 16 fits only 2 runs.
    command: ['redis-server', '--appendonly', 'yes', '--databases', '64']
    restart: unless-stopped
    volumes:
      - redisdata:/data
    # Bound to loopback only — reachable for local `yarn start:dev`, not exposed
    # publicly. Note this is the IPv4 loopback specifically, so the app's
    # REDIS_URL default is "redis://127.0.0.1:6379" rather than "localhost":
    # ioredis >=5.8.2 defaults to family:0 and lets the OS resolve, and on a
    # dual-stack host "localhost" commonly resolves to ::1 first — which nothing
    # is listening on.
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    # The default 100 runs out locally: the dev server plus several parallel
    # test runs (scripts/test-env.sh), each with 4 vitest workers' pools.
    command: ['postgres', '-c', 'max_connections=300']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to localhost only — reachable for migrations/psql, not exposed publicly.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:?POSTGRES_DB must be set}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    # SeaweedFS `mini` = master + volume + filer + S3 gateway in one
    # process. It creates S3_BUCKET on boot if missing (idempotent), which
    # replaces the old one-shot bucket-init service. Official image lives
    # on Docker Hub; keep the tag pinned.
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    command: ['mini', '-dir=/data', '-webdav=false', '-admin.ui=false']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
      S3_BUCKET: ${S3_BUCKET:-biddaloy}
    volumes:
      - seaweedfsdata:/data
    # Loopback only, same posture as db/redis. S3 is 8333 in the
    # container; 9000 on the host keeps every local S3_ENDPOINT unchanged.
    ports:
      - '127.0.0.1:9000:8333'
    # Healthy = S3 up AND the bucket exists. /status on 8333 is
    # unauthenticated and proves the S3 listener itself is serving — the
    # filer's /buckets/<name>/ alone can return 200 before 8333 is ready,
    # which would let app/backup start against a not-yet-serving S3.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf -o /dev/null http://localhost:8333/status && curl -sf -o /dev/null http://localhost:8888/buckets/${S3_BUCKET:-biddaloy}/',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Daily encrypted pg_dump to the bucket — see scripts/backup/README.md.
  # Only needs `db` (to dump) and `seaweedfs` (to upload to in dev); it does
  # not sit on the app's request path, so it isn't in `app`'s depends_on.
  backup:
    build:
      context: ./scripts/backup
      dockerfile: Dockerfile
    image: biddaloy-backup
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      BACKUP_AGE_PUBLIC_KEY: ${BACKUP_AGE_PUBLIC_KEY}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      SENTRY_CRON_MONITOR_URL: ${SENTRY_CRON_MONITOR_URL:-}
      # See the matching comment on `app`'s S3_ALLOW_INSECURE_HTTP above.
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ALLOW_INSECURE_HTTP: 'true'
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-biddaloy}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # Generates a short-lived self-signed cert if none exists yet, so nginx has
  # something to load on first boot before certbot has ever run. See
  # nginx/generate-dummy-cert.sh and the README for the real first-issuance
  # flow that replaces it.
  cert-bootstrap:
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    entrypoint: ['sh', '/scripts/generate-dummy-cert.sh']
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - certs:/etc/letsencrypt
      - ./nginx/generate-dummy-cert.sh:/scripts/generate-dummy-cert.sh:ro
    restart: 'no'

  # Renews certbot-issued certs on a loop. Does NOT perform first issuance —
  # that's a one-off manual command (see README) since it needs --email and
  # --staging/production endpoint choices a human should make deliberately.
  certbot:
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    restart: unless-stopped
    volumes:
      - certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/trusted-proxies.sh:/docker-entrypoint.d/15-trusted-proxies.sh:ro
      - ./nginx/reload-loop.sh:/docker-entrypoint.d/99-reload-loop.sh:ro
      - certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    # /healthz answers loopback callers only (nginx/templates/default.conf.template).
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy
      cert-bootstrap:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  seaweedfsdata:
  certs:
  certbot-webroot:
