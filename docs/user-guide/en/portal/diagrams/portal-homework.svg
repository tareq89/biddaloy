<svg id="my-svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="background-color: transparent;" viewBox="0 0 759.859375 231.28125" width="760" height="232" role="img" aria-labelledby="t d"><title id="t">When homework shows on this page</title><desc id="d">A teacher gives homework to the section or to the child. It shows from its given date until its due date, grouped by due date, soonest first. After the due date it leaves this page.</desc><style>#my-svg{font-family:'Noto Sans Bengali','Hind Siliguri','Bangla Sangam MN',system-ui,sans-serif;font-size:16px;fill:#212529;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#dfe3fd;}#my-svg .error-text{fill:#201c02;stroke:#201c02;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#868e96;stroke:#868e96;}#my-svg .marker.cross{stroke:#868e96;}#my-svg svg{font-family:'Noto Sans Bengali','Hind Siliguri','Bangla Sangam MN',system-ui,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .label{font-family:'Noto Sans Bengali','Hind Siliguri','Bangla Sangam MN',system-ui,sans-serif;color:#212529;}#my-svg .cluster-label text{fill:#201c02;}#my-svg .cluster-label span{color:#201c02;}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#212529;color:#212529;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellip