ock;height:1em;overflow:visible;vertical-align:-0.125em;}#my-svg .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#my-svg .node .neo-node{stroke:#adb5bd;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#adb5bd;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .teacher&gt;*{fill:rgb(231, 245, 255)!important;stroke:rgb(28, 126, 214)!important;color:rgb(11, 61, 102)!important;}#my-svg .teacher span{fill:rgb(231, 245, 255)!important;stroke:rgb(28, 126, 214)!important;color:rgb(11, 61, 102)!important;}#my-svg .teacher tspan{fill:rgb(11, 61, 102)!important;}#my-svg .admin&gt;*{fill:rgb(255, 244, 230)!important;stroke:rgb(232, 89, 12)!important;color:rgb(122, 46, 5)!important;}#my-svg .admin span{fill:rgb(255, 244, 230)!important;stroke:rgb(232, 89, 12)!important;color:rgb(122, 46, 5)!important;}#my-svg .admin tspan{fill:rgb(122, 46, 5)!important;}#my-svg .guardian&gt;*{fill:rgb(235, 251, 238)!important;stroke:rgb(43, 138, 62)!important;color:rgb(20, 65, 29)!important;}#my-svg .guardian span{fill:rgb(235, 251, 238)!important;stroke:rgb(43, 138, 62)!important;color:rgb(20, 65, 29)!important;}#my-svg .guardian tspan{fill:rgb(20, 65, 29)!important;}#my-svg .note&gt;*{fill:rgb(241, 243, 245)!important;stroke:rgb(134, 142, 150)!important;color:rgb(52, 58, 64)!important;}#my-svg .note span{fill:rgb(241, 243, 245)!important;stroke:rgb(134, 142, 150)!important;color:rgb(52, 58, 64)!important;}#my-svg .note tspan{fill:rgb(52, 58, 64)!important;}</style><g><marker id="my-svg_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 0 14 z" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-pointStart-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits="userSpaceOnUse" markerWidth="11.5" markerHeight="14" orient="auto"><polygon points="0,7 11.5,14 11.5,0" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-circleEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="11" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><circle cx="5" cy="5" r="5" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-cir