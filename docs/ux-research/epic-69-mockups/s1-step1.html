<!doctype html>
<html lang="bn">
<head>
<!-- app:head -->
<title>Mockup — full-page modal</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-bg text-body text-text-primary">

<!-- ============================================================================
     FullPageShell (D22) — a full-page modal. It covers the app chrome: no top bar,
     no sidebar, no bottom bar. Used for the tasks listed in D23.
     Body width: forms → max-w-3xl · a table, list or preview → max-w-5xl.
     The footer's inner width must be the SAME max-w-* as the body's.
     ============================================================================ -->

<!-- Sticky header: title on the left, a very visible Close (X + word, 44px) on the right. -->
<header class="sticky top-0 z-30 border-b border-border-subtle bg-surface">
  <div class="flex h-14 items-center justify-between gap-4 px-4 md:h-16 md:px-6">
    <h1 class="min-w-0 truncate text-h2 md:text-h1">পরের বছর বানাও</h1>
    <button type="button" class="inline-flex h-11 shrink-0 items-center justify-center gap-2 rounded-md border border-border-functional bg-surface px-4 font-medium text-text-primary hover:bg-muted"><i data-lucide="x"></i>বন্ধ করুন</button>
  </div>
</header>

<!-- PROPOSAL — everything inside <main> is the page design. -->
<main id="main-content" class="flex-1"><div class="mx-auto w-full max-w-3xl space-y-6 px-4 py-4 md:px-6 md:py-6"><nav aria-label="পথ" class="text-caption text-text-secondary">একাডেমিক › শিক্ষাবর্ষ › ২০২৬ › পরের বছর বানাও</nav><nav aria-label="ধাপ" class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5">
<div class="flex flex-col gap-2 sm:hidden"><p class="text-label text-text-secondary">ধাপ ১/৩</p><p class="text-h3">নাম ও তারিখ</p><div aria-hidden="true" class="flex gap-1"><span class="h-1 flex-1 rounded-full bg-primary"></span><span class="h-1 flex-1 rounded-full bg-muted"></span><span class="h-1 flex-1 rounded-full bg-muted"></span></div></div>
<ol class="hidden items-center gap-2 sm:flex"><li aria-current="step" class="flex items-center gap-2 text-body font-medium text-text-primary"><span class="flex size-7 items-center justify-center rounded-full border border-primary bg-primary text-label text-primary-foreground">১</span>নাম ও তারিখ</li><li aria-hidden="true" class="h-px w-6 bg-border-subtle"></li><li  class="flex items-center gap-2 text-body text-text-secondary"><span class="flex size-7 items-center justify-center rounded-full border border-border-subtle text-label">২</span>যা তৈরি হবে</li><li aria-hidden="true" class="h-px w-6 bg-border-subtle"></li><li  class="flex items-center gap-2 text-body text-text-secondary"><span class="flex size-7 items-center justify-center rounded-full border border-border-subtle text-label">৩</span>শেষ</li></ol></nav><section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5"><h2 class="text-h2">২০২৬ থেকে ২০২৭</h2><p class="mt-1 text-text-secondary">নাম আর তারিখ ঠিক থাকলে সরাসরি পরের ধাপে যান।</p><div class="mt-4 grid gap-4 md:grid-cols-3"><div class="flex flex-col gap-1.5"><label for="n" class="text-label text-text-primary">বছরের নাম</label><input id="n" type="text" value="২০২৭" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"></div><div class="flex flex-col gap-1.5"><label for="s" class="text-label text-text-primary">শুরুর তারিখ</label><input id="s" type="text" value="১ জানু ২০২৭" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"></div><div class="flex flex-col gap-1.5"><label for="e" class="text-label text-text-primary">শেষের তারিখ</label><input id="e" type="text" value="৩১ ডিসেম্বর ২০২৭" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"></div></div><p class="mt-3 text-caption text-text-secondary">২০২৬ শেষ হওয়ার পরের দিন থেকে ধরা হয়েছে।</p></section></div></main>

<!-- Footer: secondary action on the left, the ONE primary on the right. 44px at every width.
     IN THE APP it is "sticky bottom-0 z-30". IN A MOCKUP it stays in normal flow (last child of <body>):
     the screenshot tool captures the whole page as one tall frame, and a sticky footer would be painted
     across the middle of it. Do not add "sticky bottom-0" or "fixed" here. -->
<footer class="border-t border-border-subtle bg-surface"><div class="mx-auto flex w-full max-w-3xl items-center justify-between gap-2 px-4 py-3 md:px-6"><button type="button" class="inline-flex h-11 items-center justify-center gap-2 rounded-md px-4 font-medium md:h-8 md:px-3 border border-border-functional bg-surface text-text-primary hover:bg-muted">বাতিল করুন</button><button type="button" class="inline-flex h-11 items-center justify-center gap-2 rounded-md px-4 font-medium md:h-8 md:px-3 bg-primary text-primary-foreground"><i data-lucide="arrow-right"></i>পরের ধাপ</button></div></footer>

<script>lucide.createIcons({ attrs: { width: 18, height: 18, "stroke-width": 1.75, "aria-hidden": "true" } });</script>
</body>
</html>
