<!doctype html>
<html lang="bn">
<head>
<!-- app:head -->
<title>ফি পরিশোধ</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-bg text-body text-text-primary">

<!-- ============================================================================
     FullPageShell (D22) — a full-page modal. It covers the app chrome: no top bar,
     no sidebar, no bottom bar. Used for the tasks listed in D23.
     Body width: forms → max-w-3xl · a table, list or preview → max-w-5xl.
     The footer's inner width must be the SAME max-w-* as the body's.
     ============================================================================ -->

<!-- Sticky header: title on the left, a very visible Close (X + word, 44px) on the right. -->
<header class="sticky top-0 z-30 border-b border-border-subtle bg-surface">
  <div class="flex h-14 items-center justify-between gap-4 px-4 md:h-16 md:px-6">
    <h1 class="min-w-0 truncate text-h2 md:text-h1">ফি পরিশোধ</h1>
    <button type="button" class="inline-flex h-11 shrink-0 items-center justify-center gap-2 rounded-md border border-border-functional bg-surface px-4 font-medium text-text-primary hover:bg-muted"><i data-lucide="x"></i>বন্ধ করুন</button>
  </div>
</header>

<!-- PROPOSAL — everything inside <main> is the page design. -->
<main id="main-content" class="flex-1"><div class="mx-auto w-full max-w-3xl space-y-6 px-4 py-4 md:px-6 md:py-6"><nav aria-label="পথ" class="mb-1 flex flex-wrap items-center gap-1 text-text-secondary"><a href="#" class="hover:text-text-primary">ফি ও চালান</a><i data-lucide="chevron-right" class="size-4"></i><a href="#" class="hover:text-text-primary">পরিশোধ</a></nav><section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5 "><h2 class="text-h2">১. কোন বিল দিচ্ছেন</h2><p class="mt-0.5 text-text-secondary">সব বিল আগে থেকে বাছাই করা আছে। যেটা দেবেন না, তার টিক তুলে দিন।</p><div class="mt-3 divide-y divide-border-subtle"><label for="b-rahim" class="flex min-h-11 cursor-pointer items-center gap-3 rounded-md px-1"><input id="b-rahim" type="checkbox" checked class="size-5 shrink-0 accent-[var(--color-primary)]"><span class="min-w-0 flex-1"><span class="flex justify-between gap-3"><span class="font-medium">এপ্রিল ২০২৭ মাসিক ফি</span><span class="tabular-nums font-medium">৳১,২০০.০০</span></span><span class="block text-text-secondary">রহিম উদ্দিন · সপ্তম ক</span></span></label><label for="b-rahim2" class="flex min-h-11 cursor-pointer items-center gap-3 rounded-md px-1"><input id="b-rahim2" type="checkbox" checked class="size-5 shrink-0 accent-[var(--color-primary)]"><span class="min-w-0 flex-1"><span class="flex justify-between gap-3"><span class="font-medium">পরীক্ষার ফি (প্রথম সাময়িক)</span><span class="tabular-nums font-medium">৳৩০০.০০</span></span><span class="block text-text-secondary">রহিম উদ্দিন · সপ্তম ক</span></span></label><label for="b-sumi" class="flex min-h-11 cursor-pointer items-center gap-3 rounded-md px-1"><input id="b-sumi" type="checkbox" checked class="size-5 shrink-0 accent-[var(--color-primary)]"><span class="min-w-0 flex-1"><span class="flex justify-between gap-3"><span class="font-medium">এপ্রিল ২০২৭ মাসিক ফি</span><span class="tabular-nums font-medium">৳১,০০০.০০</span></span><span class="block text-text-secondary">সুমি আক্তার · চতুর্থ খ</span></span></label></div><div class="mt-3 flex justify-between border-t border-border-subtle pt-3 text-h3"><span>মোট</span><span class="tabular-nums">৳২,৫০০.০০</span></div></section><section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5 "><h2 class="text-h2">২. কীভাবে দেবেন</h2><div class="mt-3 grid gap-3 md:grid-cols-2"><label class="flex min-h-11 cursor-pointer items-center gap-3 rounded-lg border p-4 border-primary bg-secondary"><input type="radio" name="m" checked class="size-5 shrink-0 accent-[var(--color-primary)]"><span class="min-w-0 flex-1"><span class="block font-medium">বিকাশে পরিশোধ করুন</span><span class="block text-text-secondary">বিদ্যালয়ের বিকাশ অ্যাকাউন্টে সরাসরি যাবে। এখনই নিশ্চিত হয়।</span></span><i data-lucide="smartphone" class="size-6 shrink-0 text-text-secondary"></i></label><label class="flex min-h-11 cursor-pointer items-center gap-3 rounded-lg border p-4 border-border-functional bg-surface"><input type="radio" name="m"  class="size-5 shrink-0 accent-[var(--color-primary)]"><span class="min-w-0 flex-1"><span class="block font-medium">আগেই দিয়েছি — প্রমাণ জমা দিন</span><span class="block text-text-secondary">যেকোনো মাধ্যমে দিয়েছেন? লেনদেন নম্বর বা ছবি দিন।</span></span><i data-lucide="file-up" class="size-6 shrink-0 text-text-secondary"></i></label></div><div class="mt-3"><div class="flex items-start gap-2 rounded-md bg-status-paid-bg p-3 text-status-paid-fg"><i data-lucide="info" class="mt-0.5 shrink-0"></i><p>আপনি ঠিক ৳২,৫০০ই দেবেন। কোনো বাড়তি খরচ নেই।</p></div></div></section></div></main>

<!-- Footer: secondary action on the left, the ONE primary on the right. 44px at every width.
     IN THE APP it is "sticky bottom-0 z-30". IN A MOCKUP it stays in normal flow (last child of <body>):
     the screenshot tool captures the whole page as one tall frame, and a sticky footer would be painted
     across the middle of it. Do not add "sticky bottom-0" or "fixed" here. -->
<footer class="border-t border-border-subtle bg-surface"><div class="mx-auto flex w-full max-w-3xl flex-col-reverse gap-2 px-4 py-3 md:flex-row md:items-center md:justify-between md:px-6"><button type="button" class="inline-flex h-11 items-center justify-center gap-2 rounded-md px-4 font-medium border border-border-functional bg-surface text-text-primary hover:bg-muted ">ফিরে যান</button><button type="button" class="inline-flex h-11 items-center justify-center gap-2 rounded-md px-4 font-medium bg-primary text-primary-foreground "><i data-lucide="arrow-right"></i>বিকাশে ৳২,৫০০ দিন</button></div></footer>

<script>lucide.createIcons({ attrs: { width: 18, height: 18, "stroke-width": 1.75, "aria-hidden": "true" } });</script>
</body>
</html>
