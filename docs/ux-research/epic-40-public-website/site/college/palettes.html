<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palettes · স্বপ্নপুর কলেজ</title>
<style>
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f1f2f4;color:#16181d}
h1{font-size:20px;margin:0;padding:16px;background:#16181d;color:#fff}
h1 small{display:block;font-weight:400;font-size:14px;opacity:.8;margin-top:2px}
.pal{margin:0 0 28px;background:#fff;border-bottom:1px solid #d7dae0}
.pal iframe{display:block;width:100%;height:1000px;border:0}
.pal figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:14px 16px}
.pal figcaption b{font-size:17px}
.sw{display:flex;gap:6px}
.sw i{width:28px;height:28px;border-radius:6px;border:1px solid rgba(0,0,0,.25)}
</style></head><body>
<h1>স্বপ্নপুর কলেজ<small>Three predefined palettes. Each frame is the live home page (bar, hero and the next sections) with that palette applied.</small></h1>
<figure class="pal"><iframe src="home.html?crop=1&amp;palette=0" title="স্বপ্নপুর কলেজ, palette 1" scrolling="no"></iframe>
<figcaption><b>বন সবুজ</b><span>Forest</span><span class="sw" aria-hidden="true"><i style="background:#0F5132" title="primary"></i><i style="background:#5E6B7A" title="secondary"></i><i style="background:#E0552C" title="accent"></i><i style="background:#FFFFFF" title="surface"></i><i style="background:#0E1B2A" title="ink"></i></span><span>#0F5132 #5E6B7A #E0552C #FFFFFF #0E1B2A</span></figcaption></figure><figure class="pal"><iframe src="home.html?crop=1&amp;palette=1" title="স্বপ্নপুর কলেজ, palette 2" scrolling="no"></iframe>
<figcaption><b>গভীর নীল</b><span>Deep blue</span><span class="sw" aria-hidden="true"><i style="background:#173F7A" title="primary"></i><i style="background:#566274" title="secondary"></i><i style="background:#C2410C" title="accent"></i><i style="background:#FFFFFF" title="surface"></i><i style="background:#0E1B2A" title="ink"></i></span><span>#173F7A #566274 #C2410C #FFFFFF #0E1B2A</span></figcaption></figure><figure class="pal"><iframe src="home.html?crop=1&amp;palette=2" title="স্বপ্নপুর কলেজ, palette 3" scrolling="no"></iframe>
<figcaption><b>বেগুনি</b><span>Plum</span><span class="sw" aria-hidden="true"><i style="background:#5B2A7A" title="primary"></i><i style="background:#5E6670" title="secondary"></i><i style="background:#B4380F" title="accent"></i><i style="background:#FFFFFF" title="surface"></i><i style="background:#1A1224" title="ink"></i></span><span>#5B2A7A #5E6670 #B4380F #FFFFFF #1A1224</span></figcaption></figure>
<script>
addEventListener('message',function(e){if(!e.data||!e.data.h)return;
  document.querySelectorAll('iframe').forEach(function(f){if(f.contentWindow===e.source)f.style.height=e.data.h+'px';});});
</script>
</body></html>
