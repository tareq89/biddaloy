  <h1 style="margin-top:6px"><x-t data-field="post.title" bn="বিজ্ঞান মেলায় আমাদের তিনটি প্রকল্প জেলায় প্রথম" en="Three of our projects took first place at the district science fair"></x-t></h1>
  <p class="tiny" style="margin:10px 0 24px"><x-t data-field="post.text_2" bn="২ নভেম্বর ২০২৬ · ৪ মিনিটের পড়া" en="2 November 2026 · 4 min read"></x-t></p>
  <div class="slot" data-size="1200×630" style="aspect-ratio:1200/630;margin-bottom:28px" role="img" aria-label="Cover image slot"><span class="cap"><x-t data-field="post.caption" bn="কভার ছবি" en="Cover image"></x-t></span></div>
  <div class="prose">
    <p><x-t data-field="post.text_3" bn="গত সপ্তাহে ব্রাহ্মণবাড়িয়া জেলা বিজ্ঞান মেলায় ৩৮টি স্কুল অংশ নেয়। আমাদের নবম ও দশম শ্রেণির তিনটি দল তিনটি আলাদা বিভাগে প্রথম হয়েছে। এই লেখায় প্রকল্পগুলো কী, কারা করেছে আর আমরা কী শিখলাম।" en="Thirty-eight schools took part in last week's Brahmanbaria district science fair. Three teams from our Classes 9 and 10 won first place in three separate categories. Here is what the projects were, who built them, and what we learned."></x-t></p>
    <h2><x-t data-field="post.title_2" bn="তিনটি প্রকল্প" en="The three projects"></x-t></h2>
    <ul><li><x-t data-field="post.a_solar_paddy" bn="সৌরচালিত ধান শুকানোর যন্ত্র — বৃষ্টির মৌসুমে কৃষকের ক্ষতি কমায়।" en="A solar paddy dryer that cuts farmers' losses in the rainy season."></x-t></li><li><x-t data-field="post.a_cheap_dissolved" bn="পুকুরের পানির অক্সিজেন মাপার সস্তা সেন্সর — দাম ৪০০ টাকার নিচে।" en="A cheap dissolved-oxygen sensor for fish ponds, under BDT 400."></x-t></li><li><x-t data-field="post.a_small_bangla" bn="বাংলা হাতের লেখা চেনার একটি ছোট প্রোগ্রাম, স্কুলের পুরোনো কম্পিউটারে চলে।" en="A small Bangla handwriting recogniser that runs on the school's old computers."></x-t></li></ul>
    <h2><x-t data-field="post.title_3" bn="ফলাফল এক নজরে" en="Results at a glance"></x-t></h2>

    <blockquote><x-t data-field="post.quote" bn="“যন্ত্রটা কাজ করছে দেখে বাবা প্রথম বললেন, এবার বর্ষায় ধান পচবে না।”" en="“When my father saw the machine work, the first thing he said was: the paddy won't rot this monsoon.”"></x-t><cite><x-t data-field="post.cite" bn="— দশম শ্রেণির একজন দলনেতা" en="— a Class 10 team leader"></x-t></cite></blockquote>
    <div class="slot" data-size="≤1200 wide" style="aspect-ratio:3/2" role="img" aria-label="In-post image slot"><span class="cap"><x-t data-field="post.caption_2" bn="লেখার ভেতরের ছবি: প্রকল্পের টেবিল" en="In-post image: the project table"></x-t></span></div>
    <p><x-t data-field="post.text_4" bn="তিনটি দলই এখন বিভাগীয় মেলায় যাবে। যন্ত্রগুলো দেখতে চাইলে বিজ্ঞানাগারে রাখা আছে; অফিস সময়ে এলে দেখানো হবে। পুরো প্রতিযোগিতার নিয়মাবলি" en="All three teams now go to the divisional fair. The machines are in the science lab; come during office hours and we will show you. The full competition rules are"></x-t> <a href="#"><x-t data-field="post.on_the_district" bn="জেলা শিক্ষা অফিসের পাতায়" en="on the district education office page"></x-t></a>।</p>
