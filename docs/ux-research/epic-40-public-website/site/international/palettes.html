<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palettes · Dreamhill International School</title>
<style>
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f1f2f4;color:#16181d}
h1{font-size:20px;margin:0;padding:16px;background:#16181d;color:#fff}
h1 small{display:block;font-weight:400;font-size:14px;opacity:.8;margin-top:2px}
.pal{margin:0 0 28px;background:#fff;border-bottom:1px solid #d7dae0}
.pal iframe{display:block;width:100%;height:1000px;border:0}
.pal figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:14px 16px}
.pal figcaption b{font-size:17px}
.sw{display:flex;gap:6px}
.sw i{width:28px;height:28px;border-radius:6px;border:1px solid rgba(0,0,0,.25)}
</style></head><body>
<h1>Dreamhill International School<small>Three predefined palettes. Each frame is the live home page (bar, hero and the next sections) with that palette applied.</small></h1>
<figure class="pal"><iframe src="home.html?crop=1&amp;palette=0" title="Dreamhill International School, palette 1" scrolling="no"></iframe>
<figcaption><b>নেভি ও সোনালি</b><span>Navy and gold</span><span class="sw" aria-hidden="true"><i style="background:#0A1E3C" title="primary"></i><i style="background:#7A5600" title="secondary"></i><i style="background:#F0B429" title="accent"></i><i style="background:#F5F3EC" title="surface"></i><i style="background:#15213A" title="ink"></i></span><span>#0A1E3C #7A5600 #F0B429 #F5F3EC #15213A</span></figcaption></figure><figure class="pal"><iframe src="home.html?crop=1&amp;palette=1" title="Dreamhill International School, palette 2" scrolling="no"></iframe>
<figcaption><b>পাইন ও সোনালি</b><span>Pine and gold</span><span class="sw" aria-hidden="true"><i style="background:#0C3B33" title="primary"></i><i style="background:#7A5600" title="secondary"></i><i style="background:#F0B429" title="accent"></i><i style="background:#F4F4EE" title="surface"></i><i style="background:#12251F" title="ink"></i></span><span>#0C3B33 #7A5600 #F0B429 #F4F4EE #12251F</span></figcaption></figure><figure class="pal"><iframe src="home.html?crop=1&amp;palette=2" title="Dreamhill International School, palette 3" scrolling="no"></iframe>
<figcaption><b>বেগুনি ও সোনালি</b><span>Aubergine and gold</span><span class="sw" aria-hidden="true"><i style="background:#2E1A47" title="primary"></i><i style="background:#7A5600" title="secondary"></i><i style="background:#F0B429" title="accent"></i><i style="background:#F6F3EE" title="surface"></i><i style="background:#1E1530" title="ink"></i></span><span>#2E1A47 #7A5600 #F0B429 #F6F3EE #1E1530</span></figcaption></figure>
<script>
addEventListener('message',function(e){if(!e.data||!e.data.h)return;
  document.querySelectorAll('iframe').forEach(function(f){if(f.contentWindow===e.source)f.style.height=e.data.h+'px';});});
</script>
</body></html>
