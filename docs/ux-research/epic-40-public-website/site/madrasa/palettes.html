<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palettes · জামিয়া দারুল উলূম মাদ্রাসা</title>
<style>
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#f1f2f4;color:#16181d}
h1{font-size:20px;margin:0;padding:16px;background:#16181d;color:#fff}
h1 small{display:block;font-weight:400;font-size:14px;opacity:.8;margin-top:2px}
.pal{margin:0 0 28px;background:#fff;border-bottom:1px solid #d7dae0}
.pal iframe{display:block;width:100%;height:1000px;border:0}
.pal figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:14px 16px}
.pal figcaption b{font-size:17px}
.sw{display:flex;gap:6px}
.sw i{width:28px;height:28px;border-radius:6px;border:1px solid rgba(0,0,0,.25)}
</style></head><body>
<h1>জামিয়া দারুল উলূম মাদ্রাসা<small>Three predefined palettes. Each frame is the live home page (bar, hero and the next sections) with that palette applied.</small></h1>
<figure class="pal"><iframe src="home.html?crop=1&amp;palette=0" title="জামিয়া দারুল উলূম মাদ্রাসা, palette 1" scrolling="no"></iframe>
<figcaption><b>সবুজ ও সোনালি</b><span>Green and gold</span><span class="sw" aria-hidden="true"><i style="background:#0F3D2E" title="primary"></i><i style="background:#B8903F" title="secondary"></i><i style="background:#D5B36A" title="accent"></i><i style="background:#FBF7EE" title="surface"></i><i style="background:#1D2A24" title="ink"></i></span><span>#0F3D2E #B8903F #D5B36A #FBF7EE #1D2A24</span></figcaption></figure><figure class="pal"><iframe src="home.html?crop=1&amp;palette=1" title="জামিয়া দারুল উলূম মাদ্রাসা, palette 2" scrolling="no"></iframe>
<figcaption><b>গাঢ় নীল</b><span>Midnight blue</span><span class="sw" aria-hidden="true"><i style="background:#12324F" title="primary"></i><i style="background:#B8903F" title="secondary"></i><i style="background:#D5B36A" title="accent"></i><i style="background:#F8F7F2" title="surface"></i><i style="background:#17222C" title="ink"></i></span><span>#12324F #B8903F #D5B36A #F8F7F2 #17222C</span></figcaption></figure><figure class="pal"><iframe src="home.html?crop=1&amp;palette=2" title="জামিয়া দারুল উলূম মাদ্রাসা, palette 3" scrolling="no"></iframe>
<figcaption><b>খেজুর বাদামি</b><span>Date brown</span><span class="sw" aria-hidden="true"><i style="background:#4A2E1C" title="primary"></i><i style="background:#B8903F" title="secondary"></i><i style="background:#D5B36A" title="accent"></i><i style="background:#FAF5EC" title="surface"></i><i style="background:#2A1E16" title="ink"></i></span><span>#4A2E1C #B8903F #D5B36A #FAF5EC #2A1E16</span></figcaption></figure>
<script>
addEventListener('message',function(e){if(!e.data||!e.data.h)return;
  document.querySelectorAll('iframe').forEach(function(f){if(f.contentWindow===e.source)f.style.height=e.data.h+'px';});});
</script>
</body></html>
