<!doctype html>
<html lang="bn">
<head>
<!-- app:head -->
<title>নতুন নোটিশ</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-bg text-body text-text-primary">

<!-- ============================================================================
     FullPageShell (D22) — a full-page modal. It covers the app chrome: no top bar,
     no sidebar, no bottom bar. Used for the tasks listed in D23.
     Body width: forms → max-w-3xl · a table, list or preview → max-w-5xl.
     The footer's inner width must be the SAME max-w-* as the body's.
     ============================================================================ -->

<!-- Sticky header: title on the left, a very visible Close (X + word, 44px) on the right. -->
<header class="sticky top-0 z-30 border-b border-border-subtle bg-surface">
  <div class="flex h-14 items-center justify-between gap-4 px-4 md:h-16 md:px-6">
    <h1 class="min-w-0 truncate text-h2 md:text-h1">নতুন নোটিশ</h1>
    <button type="button" class="inline-flex h-11 shrink-0 items-center justify-center gap-2 rounded-md border border-border-functional bg-surface px-4 font-medium text-text-primary hover:bg-muted"><i data-lucide="x"></i>বন্ধ করুন</button>
  </div>
</header>

<!-- PROPOSAL — everything inside <main> is the page design. -->
<main id="main-content" class="flex-1">
  <div class="mx-auto w-full max-w-3xl space-y-6 px-4 py-4 md:px-6 md:py-6">
<section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5 "><h2 class="text-h2">নোটিশ</h2><div class="mt-4 space-y-4"><div class="flex flex-col gap-1.5 "><label for="f-25" class="text-label text-text-primary">শিরোনাম <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label><input id="f-25" type="text"  value="বার্ষিক ক্রীড়া প্রতিযোগিতা" placeholder="" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary placeholder:text-text-secondary md:h-8 md:text-body"></div><div class="flex flex-col gap-1.5 "><label for="f-26" class="text-label text-text-primary">বিবরণ <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label><textarea id="f-26" rows="3"  placeholder="" class="min-h-24 w-full rounded-md border border-border-functional bg-surface px-3 py-2 text-body-lg text-text-primary placeholder:text-text-secondary md:text-body">আগামী ১২ ডিসেম্বর স্কুল মাঠে বার্ষিক ক্রীড়া প্রতিযোগিতা অনুষ্ঠিত হবে।</textarea></div><div class="flex flex-col gap-1.5 "><label for="f-27" class="text-label text-text-primary">কাদের জন্য</label><button type="button" id="f-27" aria-haspopup="listbox" class="flex h-11 w-full items-center justify-between gap-2 rounded-md border border-border-functional bg-surface px-3 text-left text-body-lg text-text-primary md:h-8 md:text-body"><span class="truncate">সব শ্রেণি</span><i data-lucide="chevron-down" class="size-4"></i></button></div></div></section><section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5 "><div class="flex items-start justify-between gap-2"><h2 class="text-h2">ওয়েবসাইটে দেখান</h2><span class="inline-flex h-6 items-center rounded-full bg-secondary px-2 text-label text-secondary-foreground">নতুন</span></div><div class="mt-3 divide-y divide-border-subtle"><div class="flex min-h-11 items-center justify-between gap-3"><div class="min-w-0"><p class="font-medium">ওয়েবসাইটে দেখাও</p><p class="text-caption text-text-secondary">যে কেউ ওয়েবসাইটে এই নোটিশ পড়তে পারবে।</p></div><button type="button" role="switch" aria-checked="true" aria-label="ওয়েবসাইটে দেখাও" class="inline-flex h-11 w-14 shrink-0 items-center justify-center md:h-8 md:w-11 "><span class="flex h-6 w-11 items-center rounded-full bg-primary md:h-5 md:w-9"><span class="block size-5 rounded-full bg-background shadow-e1 translate-x-5 md:size-4 md:translate-x-4"></span></span></button></div><div class="flex min-h-11 items-center justify-between gap-3"><div class="min-w-0"><p class="font-medium">হোমপেজে পিন করুন</p><p class="text-caption text-text-secondary">হোমপেজের নোটিশ অংশের সবার ওপরে থাকবে।</p></div><button type="button" role="switch" aria-checked="false" aria-label="হোমপেজে পিন করুন" class="inline-flex h-11 w-14 shrink-0 items-center justify-center md:h-8 md:w-11 "><span class="flex h-6 w-11 items-center rounded-full bg-input md:h-5 md:w-9"><span class="block size-5 rounded-full bg-background shadow-e1 translate-x-0 md:size-4"></span></span></button></div></div></section>
  </div>
</main>

<footer class="border-t border-border-subtle bg-surface">
  <div class="mx-auto flex w-full max-w-3xl items-center justify-between gap-2 px-4 py-3 md:px-6">
    <button type="button" class="inline-flex h-11 items-center justify-center gap-2 rounded-md px-4 font-medium md:h-8 md:px-3 border border-border-functional bg-surface text-text-primary hover:bg-muted ">বাতিল করুন</button>
    <button type="submit" class="inline-flex h-11 items-center justify-center gap-2 rounded-md px-4 font-medium md:h-8 md:px-3 bg-primary text-primary-foreground ">নোটিশ পাঠান</button>
  </div>
</footer>

<script>lucide.createIcons({ attrs: { width: 18, height: 18, "stroke-width": 1.75, "aria-hidden": "true" } });</script>
</body>
</html>
