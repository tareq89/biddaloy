<!doctype html>
<html lang="en">
<head>
<!-- app:head -->
<title>Mockup</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-bg text-text-primary text-body">

<!-- SHELL — a rough copy of the staff app shell, here only for context.
     It is NOT part of the proposal. Do not redesign it unless asked. -->
<header class="flex h-14 items-center gap-3 border-b border-border-subtle bg-surface px-3 md:px-5">
  <button class="inline-flex size-11 items-center justify-center rounded-md md:hidden" aria-label="Open menu"><i data-lucide="menu"></i></button>
  <span class="text-h3">Default School</span>
  <span class="hidden text-text-secondary md:inline">Super admin</span>
  <div class="ml-auto hidden h-9 w-64 items-center gap-2 rounded-md border border-border-functional px-3 text-text-secondary md:flex">
    <i data-lucide="search"></i>Search…<span class="ml-auto text-caption">Ctrl+K</span>
  </div>
  <button class="ml-auto inline-flex size-11 items-center justify-center rounded-md md:ml-0" aria-label="Notifications"><i data-lucide="bell"></i></button>
  <button class="inline-flex size-11 items-center justify-center rounded-md" aria-label="Account"><i data-lucide="user"></i></button>
</header>

<div class="md:grid md:min-h-[calc(100vh-3.5rem)] md:grid-cols-[248px_minmax(0,1fr)]">
  <nav class="hidden border-r border-border-subtle p-3 md:block" aria-label="Main">
    <a href="#" class="flex h-10 items-center gap-2.5 rounded-md px-3 text-text-secondary"><i data-lucide="layout-dashboard"></i>Dashboard</a>
    <p class="px-3 pt-4 pb-1 text-label">Section</p>
    <a href="#" aria-current="page" class="flex h-10 items-center gap-2.5 rounded-md bg-secondary px-3 font-semibold text-secondary-foreground"><i data-lucide="circle"></i>This page</a>
    <a href="#" class="flex h-10 items-center gap-2.5 rounded-md px-3 text-text-secondary"><i data-lucide="circle"></i>Sibling page</a>
  </nav>

  <!-- PROPOSAL — everything inside <main> is the design. -->
  <main class="p-4 md:p-6">
    <div class="flex items-center gap-3">
      <h1 class="mr-auto text-h1">Page title</h1>
      <button class="inline-flex h-11 items-center gap-2 rounded-md bg-primary px-4 font-medium text-primary-foreground"><i data-lucide="plus"></i>Primary action</button>
    </div>
    <section class="mt-4 rounded-lg border border-border-subtle bg-surface p-4 shadow-e1">
      <h2 class="text-h2">Section</h2>
      <p class="text-text-secondary">Content goes here.</p>
    </section>
  </main>
</div>

<script>lucide.createIcons({ attrs: { width: 18, height: 18, "stroke-width": 1.75, "aria-hidden": "true" } });</script>
</body>
</html>
