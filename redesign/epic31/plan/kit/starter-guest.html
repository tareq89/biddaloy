<!doctype html>
<html lang="bn" data-density="comfortable">
<head>
<!-- app:head -->
<title>Mockup — guest</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-bg text-body-lg text-text-primary">

<!-- ============================================================================
     AuthLayout (D34) — every guest page (sign in, forgot / reset password,
     activate, verify, select school). Comfortable density: controls are 44px
     at every width. Logo, centred card max-w-md, language switcher top right.
     ============================================================================ -->

<div class="flex justify-end p-4">
  <button type="button" class="inline-flex h-11 items-center justify-center gap-2 rounded-md border border-border-functional bg-surface px-4 font-medium text-text-primary hover:bg-muted" aria-label="ভাষা পরিবর্তন করুন" aria-haspopup="menu"><i data-lucide="languages"></i>বাংলা<i data-lucide="chevron-down" class="size-4 text-text-secondary"></i></button>
</div>

<!-- PROPOSAL — everything inside <main> is the page design. Replace only what is inside the card. -->
<main id="main-content" class="flex flex-1 items-start justify-center px-4 pt-4 pb-16 md:items-center md:pt-0">
  <div class="w-full max-w-md">
    <div class="mb-6 flex flex-col items-center gap-2">
      <span class="flex size-12 items-center justify-center rounded-lg bg-primary text-primary-foreground"><i data-lucide="school"></i></span>
      <p class="text-h3">SchoolManager</p>
    </div>

    <section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5">
      <h1 class="text-h1">লগ ইন</h1>
      <p class="mt-0.5 text-text-secondary">আপনার ইমেইল বা ফোন নম্বর ও পাসওয়ার্ড দিন।</p>
      <form class="mt-5 flex flex-col gap-4">
        <div class="flex flex-col gap-1.5">
          <label for="g-id" class="text-label text-text-primary">ইমেইল বা ফোন নম্বর</label>
          <input id="g-id" type="text" autocomplete="username" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary">
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="g-pw" class="text-label text-text-primary">পাসওয়ার্ড</label>
          <input id="g-pw" type="password" autocomplete="current-password" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary">
        </div>
        <button type="submit" class="inline-flex h-11 w-full items-center justify-center gap-2 rounded-md bg-primary px-4 font-medium text-primary-foreground">লগ ইন</button>
      </form>
      <!-- A link that stands alone is a ghost button (no underline, 44px); underline is only for links inside a sentence (D29). -->
      <div class="mt-2 flex justify-center">
        <a href="#" class="inline-flex h-11 items-center rounded-md px-3 font-medium text-primary hover:bg-muted">পাসওয়ার্ড ভুলে গেছেন?</a>
      </div>
    </section>
  </div>
</main>

<script>lucide.createIcons({ attrs: { width: 18, height: 18, "stroke-width": 1.75, "aria-hidden": "true" } });</script>
</body>
</html>
