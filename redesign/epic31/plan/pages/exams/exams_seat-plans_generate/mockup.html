<!doctype html>
<html lang="bn">
<head>
<!-- app:head -->
<title>Mockup — full-page modal</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-bg text-body text-text-primary">

<!-- ============================================================================
     FullPageShell (D22) — a full-page modal. It covers the app chrome: no top bar,
     no sidebar, no bottom bar. Used for the tasks listed in D23.
     Body width: forms → max-w-3xl · a table, list or preview → max-w-5xl.
     The footer's inner width must be the SAME max-w-* as the body's.
     ============================================================================ -->

<!-- Sticky header: title on the left, a very visible Close (X + word, 44px) on the right. -->
<header class="sticky top-0 z-30 border-b border-border-subtle bg-surface">
  <div class="flex h-14 items-center justify-between gap-4 px-4 md:h-16 md:px-6">
    <h1 class="min-w-0 truncate text-h2 md:text-h1">সিট প্ল্যান তৈরি করুন</h1>
    <button type="button" class="inline-flex h-11 shrink-0 items-center justify-center gap-2 rounded-md border border-border-functional bg-surface px-4 font-medium text-text-primary hover:bg-muted"><i data-lucide="x"></i>বন্ধ করুন</button>
  </div>
</header>

<!-- PROPOSAL — everything inside <main> is the page design. -->
<main id="main-content" class="flex-1">
  <div class="mx-auto w-full max-w-3xl space-y-6 px-4 py-4 md:px-6 md:py-6">
<p class="text-text-secondary">একটি পরীক্ষার কোন কোন বিষয়ের জন্য আর কোন কোন কক্ষে আসন সাজানো হবে, তা বেছে নিন। তৈরির পরে আসন বদলানো যাবে।</p>
<section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5">
  <h2 class="text-h2">প্ল্যানের তথ্য</h2>
  <div class="mt-4 grid gap-4 md:grid-cols-2">
    <div class="flex flex-col gap-1.5"><label for="g-name" class="text-label text-text-primary">প্ল্যানের নাম <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label><input id="g-name" type="text" value="অর্ধ-বার্ষিক পরীক্ষা — আসন" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"></div>
    <div class="flex flex-col gap-1.5"><label for="g-exam" class="text-label text-text-primary">পরীক্ষা <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label><button type="button" id="g-exam" aria-haspopup="listbox" class="flex items-center justify-between gap-2 text-left h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body "><span class="truncate">অর্ধ-বার্ষিক পরীক্ষা ২০২৬ · সপ্তম শ্রেণি</span><i data-lucide="chevron-down" class="size-4 shrink-0 text-text-secondary"></i></button></div>
    <fieldset class="flex flex-col gap-1.5 md:col-span-2"><legend class="text-label text-text-primary">আসন ক্রম</legend>
      <div role="radiogroup" class="grid gap-x-6 md:grid-cols-2">
        <button type="button" role="radio" aria-checked="false" class="flex min-h-11 items-start gap-3 py-2 text-left md:min-h-8"><span class="mt-0.5"><span class="flex size-5 shrink-0 rounded-full border border-border-functional bg-surface"></span></span><span><span class="block">ক্রমানুসারে</span><span class="block text-caption text-text-secondary">শ্রেণি, শাখা ও রোল অনুযায়ী পরপর বসবে।</span></span></button>
        <button type="button" role="radio" aria-checked="true" class="flex min-h-11 items-start gap-3 py-2 text-left md:min-h-8"><span class="mt-0.5"><span class="flex size-5 shrink-0 items-center justify-center rounded-full border-2 border-primary"><span class="size-2.5 rounded-full bg-primary"></span></span></span><span><span class="block">এলোমেলো</span><span class="block text-caption text-text-secondary">আসন এলোমেলোভাবে দেওয়া হবে।</span></span></button>
      </div>
    </fieldset>
  </div>
</section>
<section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5">
  <div class="flex items-start justify-between gap-3">
    <div><h2 class="text-h2">পরীক্ষার বিষয় <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></h2><p class="mt-1 text-text-secondary">২টি বাছাই করা হয়েছে</p></div>
    <button type="button" class="inline-flex h-11 items-center rounded-md px-2 text-label font-medium text-primary hover:bg-muted md:h-8">সব বাছুন</button>
  </div>
  <ul class="mt-3 divide-y divide-border-subtle">
<li><button type="button" role="checkbox" aria-checked="true" class="flex min-h-11 w-full items-center gap-3 py-2 text-left md:min-h-8"><span class="flex size-5 shrink-0 items-center justify-center rounded-sm bg-primary text-primary-foreground"><i data-lucide="check" class="size-3.5"></i></span><span class="min-w-0"><span class="block">বাংলা</span><span class="block text-caption text-text-secondary">১২ই অক্টোবর, ২০২৬ · সকাল ১০:০০ – দুপুর ১২:০০</span></span></button></li>
<li><button type="button" role="checkbox" aria-checked="true" class="flex min-h-11 w-full items-center gap-3 py-2 text-left md:min-h-8"><span class="flex size-5 shrink-0 items-center justify-center rounded-sm bg-primary text-primary-foreground"><i data-lucide="check" class="size-3.5"></i></span><span class="min-w-0"><span class="block">ইংরেজি</span><span class="block text-caption text-text-secondary">১৩ই অক্টোবর, ২০২৬ · সকাল ১০:০০ – দুপুর ১২:০০</span></span></button></li>
<li><button type="button" role="checkbox" aria-checked="false" class="flex min-h-11 w-full items-center gap-3 py-2 text-left md:min-h-8"><span class="flex size-5 shrink-0 items-center justify-center rounded-sm border border-border-functional bg-surface"></span><span class="min-w-0"><span class="block">গণিত</span><span class="block text-caption text-text-secondary">১৪ই অক্টোবর, ২০২৬ · সকাল ১০:০০ – দুপুর ১২:৩০</span></span></button></li>
<li><button type="button" role="checkbox" aria-checked="false" class="flex min-h-11 w-full items-center gap-3 py-2 text-left md:min-h-8"><span class="flex size-5 shrink-0 items-center justify-center rounded-sm border border-border-functional bg-surface"></span><span class="min-w-0"><span class="block">বিজ্ঞান</span><span class="block text-caption text-text-secondary">১৫ই অক্টোবর, ২০২৬ · সকাল ১০:০০ – দুপুর ১২:০০</span></span></button></li>
  </ul>
</section>
<section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5">
  <div class="flex items-start justify-between gap-3">
    <div><h2 class="text-h2">কক্ষ <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></h2><p class="mt-1 text-text-secondary">২টি বাছাই করা হয়েছে · মোট ৮০টি আসন</p></div>
    <button type="button" class="inline-flex h-11 items-center rounded-md px-2 text-label font-medium text-primary hover:bg-muted md:h-8">সব বাছুন</button>
  </div>
  <ul class="mt-3 divide-y divide-border-subtle">
<li><button type="button" role="checkbox" aria-checked="true" class="flex min-h-11 w-full items-center gap-3 py-2 text-left md:min-h-8"><span class="flex size-5 shrink-0 items-center justify-center rounded-sm bg-primary text-primary-foreground"><i data-lucide="check" class="size-3.5"></i></span><span class="min-w-0"><span class="block">প্রশাসনিক ভবন — ১০১</span></span><span class="ms-auto shrink-0 text-text-secondary">৪০টি আসন</span></button></li>
<li><button type="button" role="checkbox" aria-checked="true" class="flex min-h-11 w-full items-center gap-3 py-2 text-left md:min-h-8"><span class="flex size-5 shrink-0 items-center justify-center rounded-sm bg-primary text-primary-foreground"><i data-lucide="check" class="size-3.5"></i></span><span class="min-w-0"><span class="block">প্রশাসনিক ভবন — ১০২</span></span><span class="ms-auto shrink-0 text-text-secondary">৪০টি আসন</span></button></li>
<li><button type="button" role="checkbox" aria-checked="false" class="flex min-h-11 w-full items-center gap-3 py-2 text-left md:min-h-8"><span class="flex size-5 shrink-0 items-center justify-center rounded-sm border border-border-functional bg-surface"></span><span class="min-w-0"><span class="block">বিজ্ঞান ভবন — ২০১</span></span><span class="ms-auto shrink-0 text-text-secondary">৩০টি আসন</span></button></li>
<li><button type="button" role="checkbox" aria-checked="false" class="flex min-h-11 w-full items-center gap-3 py-2 text-left md:min-h-8"><span class="flex size-5 shrink-0 items-center justify-center rounded-sm border border-border-functional bg-surface"></span><span class="min-w-0"><span class="block">বিজ্ঞান ভবন — ২০২</span></span><span class="ms-auto shrink-0 text-text-secondary">৩০টি আসন</span></button></li>
  </ul>
</section>
  </div>
</main>

<!-- Footer: secondary action on the left, the ONE primary on the right. 44px at every width.
     IN THE APP it is "sticky bottom-0 z-30". IN A MOCKUP it stays in normal flow (last child of <body>):
     the screenshot tool captures the whole page as one tall frame, and a sticky footer would be painted
     across the middle of it. Do not add "sticky bottom-0" or "fixed" here. -->
<footer class="border-t border-border-subtle bg-surface">
  <div class="mx-auto flex w-full max-w-3xl items-center justify-between gap-2 px-4 py-3 md:px-6">
    <button type="button" class="inline-flex h-11 items-center justify-center gap-2 rounded-md border border-border-functional bg-surface px-4 font-medium text-text-primary hover:bg-muted">বাতিল</button>
    <button type="submit" class="inline-flex h-11 items-center justify-center gap-2 rounded-md bg-primary px-4 font-medium text-primary-foreground">তৈরি করুন</button>
  </div>
</footer>

<script>lucide.createIcons({ attrs: { width: 18, height: 18, "stroke-width": 1.75, "aria-hidden": "true" } });</script>
</body>
</html>
