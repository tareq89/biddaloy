<!doctype html>
<html lang="bn">
<head>
<!-- app:head -->
<title>আইডি কার্ড প্রিন্ট</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-bg text-body text-text-primary">

<!-- ============================================================================
     FullPageShell (D22) — a full-page modal. It covers the app chrome: no top bar,
     no sidebar, no bottom bar. Used for the tasks listed in D23.
     Body width: forms → max-w-3xl · a table, list or preview → max-w-5xl.
     The footer's inner width must be the SAME max-w-* as the body's.
     ============================================================================ -->

<!-- Sticky header: title on the left, a very visible Close (X + word, 44px) on the right. -->
<header class="sticky top-0 z-30 border-b border-border-subtle bg-surface">
  <div class="flex h-14 items-center justify-between gap-4 px-4 md:h-16 md:px-6">
    <h1 class="min-w-0 truncate text-h2 md:text-h1">আইডি কার্ড প্রিন্ট</h1>
    <button type="button" class="inline-flex h-11 shrink-0 items-center justify-center gap-2 rounded-md border border-border-functional bg-surface px-4 font-medium text-text-primary hover:bg-muted"><i data-lucide="x"></i>বন্ধ করুন</button>
  </div>
</header>

<!-- PROPOSAL — everything inside <main> is the page design. -->
<main id="main-content" class="flex-1">
  <div class="mx-auto w-full max-w-3xl space-y-6 px-4 py-4 md:px-6 md:py-6">
    <section class="flex flex-col items-center gap-2 rounded-lg border border-border-subtle bg-surface px-4 py-10 text-center shadow-e1 md:hidden">
      <span class="flex size-12 items-center justify-center rounded-full bg-muted text-text-secondary"><i data-lucide="monitor"></i></span>
      <h2 class="text-h3">এটি কম্পিউটারে খুলুন</h2>
      <p class="text-text-secondary">নকশা আর প্রিন্টের জন্য বড় পর্দা লাগে। নিচের বোতামে লিংক কপি করে কম্পিউটারে খুলুন।</p>
    </section>
    <div class="hidden space-y-6 md:block">
    <section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5">
      <div role="tablist" aria-label="কার কার্ড" class="flex overflow-x-auto border-b border-border-subtle [scrollbar-width:none]">
        <button type="button" role="tab" aria-selected="true" class="inline-flex h-11 shrink-0 items-center gap-2 border-b-2 border-transparent px-3 whitespace-nowrap text-text-secondary hover:text-text-primary aria-selected:border-primary aria-selected:font-semibold aria-selected:text-primary md:h-10"><i data-lucide="graduation-cap" class="size-4"></i>শিক্ষার্থী</button>
        <button type="button" role="tab" aria-selected="false" class="inline-flex h-11 shrink-0 items-center gap-2 border-b-2 border-transparent px-3 whitespace-nowrap text-text-secondary hover:text-text-primary aria-selected:border-primary aria-selected:font-semibold aria-selected:text-primary md:h-10"><i data-lucide="briefcase" class="size-4"></i>কর্মী</button>
      </div>
      <fieldset class="mt-4">
        <legend class="text-label text-text-primary">কীভাবে বাছবেন?</legend>
        <div class="mt-1.5 grid gap-2 md:grid-cols-2">
          <label for="m1" class="flex min-h-11 cursor-pointer items-start gap-3 rounded-md border p-3 border-primary bg-secondary"><input id="m1" type="radio" name="mode" class="sr-only" checked><span class="flex size-5 shrink-0 items-center justify-center rounded-full border-2 border-primary"><span class="size-2.5 rounded-full bg-primary"></span></span><span><span class="block font-medium">নাম দিয়ে বাছুন</span><span class="block text-caption text-text-secondary">কয়েকজনের কার্ড — খুঁজে টিক দিন</span></span></label>
          <label for="m2" class="flex min-h-11 cursor-pointer items-start gap-3 rounded-md border p-3 border-border-subtle bg-surface hover:bg-muted"><input id="m2" type="radio" name="mode" class="sr-only" ><span class="flex size-5 shrink-0 items-center justify-center rounded-full border-2 border-border-functional"></span><span><span class="block font-medium">পুরো শাখা</span><span class="block text-caption text-text-secondary">একটি শাখার সব শিক্ষার্থীর কার্ড</span></span></label>
        </div>
      </fieldset>
    </section>
    <section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5">
      <h2 class="text-h2">নাম দিয়ে বাছুন</h2>
      <p class="mt-1 text-text-secondary">নাম বা রোল লিখে খুঁজুন, তারপর যাদের কার্ড লাগবে তাদের টিক দিন।</p>
      <div class="mt-4 flex flex-col gap-1.5">
        <label for="pk-q" class="text-label text-text-primary">নাম দিয়ে খুঁজুন</label>
        <div class="relative"><i data-lucide="search" class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-text-secondary"></i><input id="pk-q" type="search" value="রহ" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 pl-10 text-body-lg text-text-primary md:h-8 md:text-body"></div>
      </div>
      <div class="mt-3 flex flex-wrap items-center gap-x-2 md:gap-y-2">
        <span class="text-label text-text-secondary">বাছাই করা ৩ জন:</span>
        <button type="button" class="inline-flex h-11 items-center md:h-7" aria-label="ফিল্টার সরান — রহিম উদ্দিন"><span class="inline-flex h-7 items-center gap-1 rounded-full bg-secondary pr-2 pl-3 text-label text-secondary-foreground">রহিম উদ্দিন<i data-lucide="x" class="size-3.5"></i></span></button><button type="button" class="inline-flex h-11 items-center md:h-7" aria-label="ফিল্টার সরান — রহমত আলী"><span class="inline-flex h-7 items-center gap-1 rounded-full bg-secondary pr-2 pl-3 text-label text-secondary-foreground">রহমত আলী<i data-lucide="x" class="size-3.5"></i></span></button><button type="button" class="inline-flex h-11 items-center md:h-7" aria-label="ফিল্টার সরান — রাশেদ করিম"><span class="inline-flex h-7 items-center gap-1 rounded-full bg-secondary pr-2 pl-3 text-label text-secondary-foreground">রাশেদ করিম<i data-lucide="x" class="size-3.5"></i></span></button>
        <button type="button" class="inline-flex h-11 items-center rounded-md px-2 text-label font-medium text-primary hover:bg-muted md:h-7">সব মুছুন</button>
      </div>
      <ul class="mt-3 divide-y divide-border-subtle rounded-md border border-border-subtle" aria-label="খোঁজের ফলাফল"><li><label for="p1" class="flex min-h-11 cursor-pointer items-center gap-3 rounded-md px-3 hover:bg-muted md:min-h-10"><input id="p1" type="checkbox" class="sr-only" checked><span class="flex size-5 shrink-0 items-center justify-center rounded-sm bg-primary text-primary-foreground"><i data-lucide="check" class="size-3.5"></i></span><span class="min-w-0 flex-1"><span class="block font-medium">রহিম উদ্দিন</span><span class="block text-caption text-text-secondary">REG-2026-0001</span></span></label></li><li><label for="p2" class="flex min-h-11 cursor-pointer items-center gap-3 rounded-md px-3 hover:bg-muted md:min-h-10"><input id="p2" type="checkbox" class="sr-only" checked><span class="flex size-5 shrink-0 items-center justify-center rounded-sm bg-primary text-primary-foreground"><i data-lucide="check" class="size-3.5"></i></span><span class="min-w-0 flex-1"><span class="block font-medium">রহমত আলী</span><span class="block text-caption text-text-secondary">REG-2026-0014</span></span></label></li><li><label for="p3" class="flex min-h-11 cursor-pointer items-center gap-3 rounded-md px-3 hover:bg-muted md:min-h-10"><input id="p3" type="checkbox" class="sr-only" ><span class="flex size-5 shrink-0 items-center justify-center rounded-sm border border-border-functional bg-surface"></span><span class="min-w-0 flex-1"><span class="block font-medium">রাহেলা খাতুন</span><span class="block text-caption text-text-secondary">REG-2026-0027</span></span></label></li><li><label for="p4" class="flex min-h-11 cursor-pointer items-center gap-3 rounded-md px-3 hover:bg-muted md:min-h-10"><input id="p4" type="checkbox" class="sr-only" checked><span class="flex size-5 shrink-0 items-center justify-center rounded-sm bg-primary text-primary-foreground"><i data-lucide="check" class="size-3.5"></i></span><span class="min-w-0 flex-1"><span class="block font-medium">রাশেদ করিম</span><span class="block text-caption text-text-secondary">REG-2026-0031</span></span></label></li><li><label for="p5" class="flex min-h-11 cursor-pointer items-center gap-3 rounded-md px-3 hover:bg-muted md:min-h-10"><input id="p5" type="checkbox" class="sr-only" ><span class="flex size-5 shrink-0 items-center justify-center rounded-sm border border-border-functional bg-surface"></span><span class="min-w-0 flex-1"><span class="block font-medium">রুমানা আক্তার</span><span class="block text-caption text-text-secondary">REG-2026-0045</span></span></label></li></ul>
      <p class="mt-2 text-caption text-text-secondary">প্রথম ২০ জন দেখানো হচ্ছে। না পেলে নাম আরও লিখুন।</p>
    </section>
    </div>
  </div>
</main>

<!-- Footer: secondary action on the left, the ONE primary on the right. 44px at every width.
     IN THE APP it is "sticky bottom-0 z-30". IN A MOCKUP it stays in normal flow (last child of <body>):
     the screenshot tool captures the whole page as one tall frame, and a sticky footer would be painted
     across the middle of it. Do not add "sticky bottom-0" or "fixed" here. -->
<footer class="border-t border-border-subtle bg-surface">
  <div class="mx-auto flex w-full max-w-3xl items-center justify-between gap-2 px-4 py-3 md:px-6">
    <button type="button" class="hidden md:inline-flex h-11 items-center justify-center gap-2 whitespace-nowrap rounded-md px-4 font-medium border border-border-functional bg-surface text-text-primary hover:bg-muted">বাতিল করুন</button>
    <button type="button" class="hidden md:inline-flex h-11 items-center justify-center gap-2 whitespace-nowrap rounded-md px-4 font-medium bg-primary text-primary-foreground">৩ জনকে নিয়ে এগিয়ে যান<i data-lucide="arrow-right"></i></button>
    <button type="button" class="inline-flex h-11 items-center justify-center gap-2 whitespace-nowrap rounded-md px-4 font-medium bg-primary text-primary-foreground ms-auto md:hidden"><i data-lucide="copy"></i>লিংক কপি করুন</button>
  </div>
</footer>

<script>lucide.createIcons({ attrs: { width: 18, height: 18, "stroke-width": 1.75, "aria-hidden": "true" } });</script>
</body>
</html>
