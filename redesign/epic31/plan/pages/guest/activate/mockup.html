<!doctype html>
<html lang="bn" data-density="comfortable">
<head>
<!-- app:head -->
<title>Mockup — guest · activate</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-bg text-body-lg text-text-primary">

<!-- AuthLayout (D34, foundation 31.2.12): language switcher, logo + product name, one centred max-w-md card. -->
<div class="flex justify-end p-4">
  <button type="button" class="inline-flex h-11 items-center justify-center gap-2 rounded-md border border-border-functional bg-surface px-4 font-medium text-text-primary hover:bg-muted" aria-label="ভাষা পরিবর্তন করুন" aria-haspopup="menu"><i data-lucide="languages"></i>বাংলা<i data-lucide="chevron-down" class="size-4 text-text-secondary"></i></button>
</div>

<main id="main-content" class="flex flex-1 items-start justify-center px-4 pt-4 pb-16 md:items-center md:pt-0">
  <div class="w-full max-w-md">
    <div class="mb-6 flex flex-col items-center gap-2">
      <span class="flex size-12 items-center justify-center rounded-lg bg-primary text-primary-foreground"><i data-lucide="school"></i></span>
      <p class="text-h3">SchoolManager</p>
    </div>

    <section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5">
      <div class="flex flex-col items-center gap-2 text-center">
        <span class="flex size-12 items-center justify-center rounded-full bg-status-due-bg text-status-due-fg"><i data-lucide="link-2-off"></i></span>
        <h1 class="text-h2 text-balance">লিংকটি অসম্পূর্ণ — নতুন একটি লিংক চেয়ে নিন।</h1>
        <p class="text-text-secondary">যিনি আপনাকে আমন্ত্রণ জানিয়েছেন তার কাছে নতুন লিংক চান, অথবা নিচে আপনার ইমেইল বা ফোন নম্বর দিয়ে নিজেই চেয়ে নিন।</p>
      </div>
      <!-- New: the resend form now shows in this state too (was only for expired / revoked) -->
      <form class="mt-5 flex flex-col gap-4 border-t border-border-subtle pt-5">
        <div class="flex flex-col gap-1.5">
          <label for="a-id" class="text-label text-text-primary">ইমেইল বা ফোন নম্বর</label>
          <input id="a-id" type="text" placeholder="01XXXXXXXXX বা ইমেইল" autocomplete="username"  class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary placeholder:text-text-secondary">
        </div>
        <button type="submit" class="inline-flex h-11 w-full items-center justify-center gap-2 rounded-md bg-primary px-4 font-medium text-primary-foreground">নতুন লিংক পাঠান</button>
        <a href="#" class="flex h-11 w-full items-center justify-center rounded-md px-3 font-medium text-primary hover:bg-muted">সাইন ইন পাতায় যান</a>
      </form>
    </section>
  </div>
</main>

<script>lucide.createIcons({ attrs: { width: 18, height: 18, "stroke-width": 1.75, "aria-hidden": "true" } });</script>
</body>
</html>
