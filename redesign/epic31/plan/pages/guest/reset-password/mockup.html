<!doctype html>
<html lang="bn" data-density="comfortable">
<head>
<!-- app:head -->
<title>Mockup — guest · reset-password</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-bg text-body-lg text-text-primary">

<!-- AuthLayout (D34, foundation 31.2.12): language switcher, logo + product name, one centred max-w-md card. -->
<div class="flex justify-end p-4">
  <button type="button" class="inline-flex h-11 items-center justify-center gap-2 rounded-md border border-border-functional bg-surface px-4 font-medium text-text-primary hover:bg-muted" aria-label="ভাষা পরিবর্তন করুন" aria-haspopup="menu"><i data-lucide="languages"></i>বাংলা<i data-lucide="chevron-down" class="size-4 text-text-secondary"></i></button>
</div>

<main id="main-content" class="flex flex-1 items-start justify-center px-4 pt-4 pb-16 md:items-center md:pt-0">
  <div class="w-full max-w-md">
    <div class="mb-6 flex flex-col items-center gap-2">
      <span class="flex size-12 items-center justify-center rounded-lg bg-primary text-primary-foreground"><i data-lucide="school"></i></span>
      <p class="text-h3">SchoolManager</p>
    </div>

    <section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5">
      <h1 class="text-h1 text-balance">নতুন পাসওয়ার্ড দিন</h1>
      <p class="mt-0.5 text-text-secondary">এরপর থেকে এই পাসওয়ার্ড দিয়ে সাইন ইন করবেন।</p>
      <form class="mt-5 flex flex-col gap-4">
        <div class="flex flex-col gap-1.5">
          <label for="r-pw" class="text-label text-text-primary">নতুন পাসওয়ার্ড</label>
          <div class="relative">
            <input id="r-pw" type="password" autocomplete="new-password" value="••••••••" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary pe-24">
            <button type="button" aria-pressed="false" aria-controls="r-pw" class="absolute end-0 top-0 inline-flex h-11 items-center rounded-md px-3 text-label text-text-primary hover:bg-muted">পাসওয়ার্ড দেখান</button>
          </div>
          <p id="r-pw-hint" class="text-caption text-text-secondary">কমপক্ষে ৮ অক্ষর।</p>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="r-pw2" class="text-label text-text-primary">পাসওয়ার্ড নিশ্চিত করুন</label>
          <div class="relative">
            <input id="r-pw2" type="password" autocomplete="new-password" value="••••••••" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary pe-24">
            <button type="button" aria-pressed="false" aria-controls="r-pw2" class="absolute end-0 top-0 inline-flex h-11 items-center rounded-md px-3 text-label text-text-primary hover:bg-muted">পাসওয়ার্ড দেখান</button>
          </div>
        </div>
        <button type="submit" class="inline-flex h-11 w-full items-center justify-center gap-2 rounded-md bg-primary px-4 font-medium text-primary-foreground mt-1">পাসওয়ার্ড সেট করুন</button>
      </form>
    </section>
  </div>
</main>

<script>lucide.createIcons({ attrs: { width: 18, height: 18, "stroke-width": 1.75, "aria-hidden": "true" } });</script>
</body>
</html>
