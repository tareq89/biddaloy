<!doctype html>
<html lang="bn">
<head>
<!-- app:head -->
<title>Add student</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-bg text-body text-text-primary">

<!-- ============================================================================
     FullPageShell (D22) — a full-page modal. It covers the app chrome: no top bar,
     no sidebar, no bottom bar. Used for the tasks listed in D23.
     Body width: forms → max-w-3xl · a table, list or preview → max-w-5xl.
     The footer's inner width must be the SAME max-w-* as the body's.
     ============================================================================ -->

<!-- Sticky header: title on the left, a very visible Close (X + word, 44px) on the right. -->
<header class="sticky top-0 z-30 border-b border-border-subtle bg-surface">
  <div class="flex h-14 items-center justify-between gap-4 px-4 md:h-16 md:px-6">
    <h1 class="min-w-0 truncate text-h2 md:text-h1">শিক্ষার্থী যোগ করুন</h1>
    <button type="button" class="inline-flex h-11 shrink-0 items-center justify-center gap-2 rounded-md border border-border-functional bg-surface px-4 font-medium text-text-primary hover:bg-muted"><i data-lucide="x"></i>বন্ধ করুন</button>
  </div>
</header>

<!-- PROPOSAL — everything inside <main> is the page design. -->
<main id="main-content" class="flex-1">
  <div class="mx-auto w-full max-w-3xl space-y-6 px-4 py-4 md:px-6 md:py-6">

    <section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5">
      <h2 class="text-h2">পরিচিতি</h2>
      <div class="mt-4 grid gap-4 md:grid-cols-2">
        <div class="flex flex-col gap-1.5 ">
          <label for="s-name" class="text-label text-text-primary">পূর্ণ নাম <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label>
          <input id="s-name" type="text" value="Rahim Uddin" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body placeholder:text-text-secondary">
        </div>
        <div class="flex flex-col gap-1.5 ">
          <label for="s-name-bn" class="text-label text-text-primary">নাম (বাংলা)</label>
          <input id="s-name-bn" type="text" value="রহিম উদ্দিন" lang="bn" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body placeholder:text-text-secondary">
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="s-dob" class="text-label text-text-primary">জন্ম তারিখ</label>
          <button type="button" id="s-dob" aria-haspopup="dialog" class="flex items-center justify-between gap-2 text-left h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"><span class="truncate">১২ই মার্চ, ২০১৩</span><i data-lucide="calendar" class="size-4 shrink-0 text-text-secondary"></i></button>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="s-gender" class="text-label text-text-primary">লিঙ্গ</label>
          <button type="button" id="s-gender" aria-haspopup="listbox" class="flex items-center justify-between gap-2 text-left h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"><span class="truncate">পুরুষ</span><i data-lucide="chevron-down" class="size-4 shrink-0 text-text-secondary"></i></button>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="s-blood" class="text-label text-text-primary">রক্তের গ্রুপ</label>
          <button type="button" id="s-blood" aria-haspopup="listbox" class="flex items-center justify-between gap-2 text-left h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"><span class="truncate text-text-secondary">বাছুন</span><i data-lucide="chevron-down" class="size-4 shrink-0 text-text-secondary"></i></button>
        </div>
      </div>
    </section>
    <section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5">
      <h2 class="text-h2">শ্রেণি বিন্যাস</h2>
      <div class="mt-4 grid gap-4 md:grid-cols-2">
        <div class="flex flex-col gap-1.5">
          <label for="s-class" class="text-label text-text-primary">শ্রেণি <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label>
          <button type="button" id="s-class" aria-haspopup="listbox" class="flex items-center justify-between gap-2 text-left h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"><span class="truncate">সপ্তম</span><i data-lucide="chevron-down" class="size-4 shrink-0 text-text-secondary"></i></button>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="s-section" class="text-label text-text-primary">শাখা <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label>
          <button type="button" id="s-section" aria-haspopup="listbox" class="flex items-center justify-between gap-2 text-left h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"><span class="truncate">ক</span><i data-lucide="chevron-down" class="size-4 shrink-0 text-text-secondary"></i></button>
        </div>
        <div class="flex flex-col gap-1.5 ">
          <label for="s-roll" class="text-label text-text-primary">রোল নম্বর</label>
          <input id="s-roll" type="text" placeholder="যেমন ১২" aria-describedby="s-roll-help" inputmode="numeric" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body placeholder:text-text-secondary">
          <p id="s-roll-help" class="text-caption text-text-secondary">ফাঁকা রাখলে শাখার পরের রোল নম্বর নিজে থেকে বসবে।</p>
        </div>
      </div>
    </section>
    <section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5">
      <h2 class="text-h2">অভিভাবক</h2>
      <p class="mt-0.5 text-text-secondary">যিনি আগে থেকে আছেন তাঁকে খুঁজে যুক্ত করুন, না পেলে নতুন যোগ করুন।</p>
      <div class="mt-4 grid gap-4 md:grid-cols-2">
        <div class="flex flex-col gap-1.5 md:col-span-2">
          <p id="g-linked" class="text-label text-text-primary">যুক্ত অভিভাবক</p>
          <ul class="divide-y divide-border-subtle rounded-md border border-border-subtle" aria-labelledby="g-linked">
            <li class="flex items-center gap-3 py-1 pr-1 pl-3">
              <span class="flex size-9 shrink-0 items-center justify-center rounded-full bg-secondary text-secondary-foreground"><i data-lucide="user-round" class="size-4"></i></span>
              <div class="min-w-0 flex-1">
                <p class="truncate font-medium">আব্দুল করিম <span class="font-normal text-text-secondary">· বাবা</span></p>
                <p class="truncate text-caption text-text-secondary">01711-000004</p>
              </div>
              <button type="button" class="inline-flex size-11 shrink-0 items-center justify-center rounded-md hover:bg-muted md:size-8 text-destructive" aria-label="আব্দুল করিম-কে সরান"><i data-lucide="circle-minus"></i></button>
            </li>
          </ul>
        </div>
        <div class="flex flex-col gap-1.5 md:col-span-2">
          <label for="g-search" class="text-label text-text-primary">অভিভাবক খুঁজুন</label>
          <div class="relative">
            <i data-lucide="search" class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-text-secondary"></i>
            <input id="g-search" type="search" value="রোকেয়া" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body pl-10">
          </div>
          <ul class="rounded-md border border-border-subtle p-1" aria-live="polite" aria-label="খোঁজার ফলাফল">
            <li><button type="button" role="checkbox" aria-checked="false" class="flex min-h-11 w-full items-center gap-3 rounded-md px-2 text-left hover:bg-muted md:min-h-8"><span class="flex size-5 shrink-0 rounded-sm border border-border-functional bg-surface"></span><span class="min-w-0 flex-1 truncate">রোকেয়া বেগম <span class="text-text-secondary">· 01711-000007</span></span></button></li>
            <li><button type="button" role="checkbox" aria-checked="false" class="flex min-h-11 w-full items-center gap-3 rounded-md px-2 text-left hover:bg-muted md:min-h-8"><span class="flex size-5 shrink-0 rounded-sm border border-border-functional bg-surface"></span><span class="min-w-0 flex-1 truncate">রোকেয়া সুলতানা <span class="text-text-secondary">· 01811-000021</span></span></button></li>
          </ul>
        </div>
        <div class="md:col-span-2">
          <button type="button" class="inline-flex h-11 items-center justify-center gap-2 rounded-md px-4 font-medium md:h-8 md:px-3 border border-border-functional bg-surface text-text-primary hover:bg-muted w-full md:w-auto"><i data-lucide="user-plus"></i>নতুন অভিভাবক যোগ করুন</button>
        </div>
      </div>
    </section>
    <section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5">
      <h2 class="text-h2">পছন্দসমূহ</h2>
      <div class="mt-4 grid gap-4 md:grid-cols-2">
        <div class="flex flex-col gap-1.5">
          <label for="s-comm" class="text-label text-text-primary">পছন্দের যোগাযোগ মাধ্যম</label>
          <button type="button" id="s-comm" aria-haspopup="listbox" class="flex items-center justify-between gap-2 text-left h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"><span class="truncate">এসএমএস</span><i data-lucide="chevron-down" class="size-4 shrink-0 text-text-secondary"></i></button>
        </div>
        <div class="flex flex-col gap-1.5 md:col-span-2">
          <label for="s-addr" class="text-label text-text-primary">বাড়ির ঠিকানা</label>
          <textarea id="s-addr" rows="3" class="w-full rounded-md border border-border-functional bg-surface px-3 py-2 text-body-lg text-text-primary md:text-body">গ্রাম: নমুনাপুর, ডাকঘর: নমুনাগঞ্জ, জেলা: নমুনা</textarea>
        </div>
      </div>
    </section>

  </div>
</main>

<!-- Footer: secondary action on the left, the ONE primary on the right. 44px at every width.
     IN THE APP it is "sticky bottom-0 z-30". IN A MOCKUP it stays in normal flow (last child of <body>):
     the screenshot tool captures the whole page as one tall frame, and a sticky footer would be painted
     across the middle of it. Do not add "sticky bottom-0" or "fixed" here. -->
<footer class="border-t border-border-subtle bg-surface">
  <div class="mx-auto flex w-full max-w-3xl items-center justify-between gap-2 px-4 py-3 md:px-6">
    <button type="button" class="inline-flex h-11 items-center justify-center gap-2 rounded-md border border-border-functional bg-surface px-4 font-medium text-text-primary hover:bg-muted">বাতিল করুন</button>
    <button type="submit" class="inline-flex h-11 items-center justify-center gap-2 rounded-md bg-primary px-4 font-medium text-primary-foreground"><i data-lucide="check"></i>শিক্ষার্থী যোগ করুন</button>
  </div>
</footer>

<script>lucide.createIcons({ attrs: { width: 18, height: 18, "stroke-width": 1.75, "aria-hidden": "true" } });</script>
</body>
</html>
