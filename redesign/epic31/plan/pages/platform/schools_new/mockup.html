<!doctype html>
<html lang="bn">
<head>
<!-- app:head -->
<title>New school</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-bg text-body text-text-primary">

<!-- ============================================================================
     FullPageShell (D22) — a full-page modal. It covers the app chrome: no top bar,
     no sidebar, no bottom bar. Used for the tasks listed in D23.
     Body width: forms → max-w-3xl · a table, list or preview → max-w-5xl.
     The footer's inner width must be the SAME max-w-* as the body's.
     ============================================================================ -->

<!-- Sticky header: title on the left, a very visible Close (X + word, 44px) on the right. -->
<header class="sticky top-0 z-30 border-b border-border-subtle bg-surface">
  <div class="flex h-14 items-center justify-between gap-4 px-4 md:h-16 md:px-6">
    <h1 class="min-w-0 truncate text-h2 md:text-h1">নতুন স্কুল</h1>
    <button type="button" class="inline-flex h-11 shrink-0 items-center justify-center gap-2 rounded-md border border-border-functional bg-surface px-4 font-medium text-text-primary hover:bg-muted"><i data-lucide="x"></i>বন্ধ করুন</button>
  </div>
</header>

<main id="main-content" class="flex-1">
  <div class="mx-auto w-full max-w-3xl space-y-6 px-4 py-4 md:px-6 md:py-6">

    <!-- Step indicator (New, route-local): 2 steps, the current one filled -->
    <ol aria-label="ধাপ" class="flex items-center gap-2">
      <li aria-current="step" class="flex min-w-0 items-center gap-2">
        <span class="flex size-7 shrink-0 items-center justify-center rounded-full bg-primary text-label font-semibold text-primary-foreground">১</span>
        <span class="truncate font-semibold text-text-primary">স্কুলের তথ্য</span>
      </li>
      <li aria-hidden="true" class="h-px min-w-6 flex-1 bg-border-subtle"></li>
      <li class="flex min-w-0 items-center gap-2">
        <span class="flex size-7 shrink-0 items-center justify-center rounded-full border border-border-functional text-label text-text-secondary">২</span>
        <span class="truncate text-text-secondary">প্রথম অ্যাডমিন</span>
      </li>
    </ol>

    <section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5">
      <h2 class="text-h2">স্কুলের তথ্য</h2>
      <p class="mt-0.5 text-text-secondary">স্কুলের নাম আর ওয়েব ঠিকানায় ব্যবহারের ছোট নাম দিন।</p>
      <div class="mt-4 grid gap-4">
        <div class="flex flex-col gap-1.5">
          <label for="cs-name" class="text-label text-text-primary">স্কুলের নাম <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label>
          <input id="cs-name" type="text" value="চরপাড়া উচ্চ বিদ্যালয়" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary placeholder:text-text-secondary md:h-8 md:text-body">
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="cs-slug" class="text-label text-text-primary">লিংকের নাম <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label>
          <input id="cs-slug" type="text" value="charpara-high" aria-describedby="cs-slug-help" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary placeholder:text-text-secondary md:h-8 md:text-body">
          <p id="cs-slug-help" class="text-caption text-text-secondary">শুধু ইংরেজি ছোট হাতের অক্ষর, সংখ্যা আর হাইফেন (-)। নাম ইংরেজিতে লিখলে এটি নিজে থেকে বসে যায়।</p>
        </div>
      </div>
    </section>

  </div>
</main>

<footer class="border-t border-border-subtle bg-surface">
  <div class="mx-auto flex w-full max-w-3xl items-center justify-between gap-2 px-4 py-3 md:px-6">
    <button type="button" class="inline-flex h-11 items-center justify-center gap-2 rounded-md border border-border-functional bg-surface px-4 font-medium text-text-primary hover:bg-muted">বাতিল করুন</button>
    <button type="submit" class="inline-flex h-11 items-center justify-center gap-2 rounded-md bg-primary px-4 font-medium text-primary-foreground">পরবর্তী<i data-lucide="arrow-right"></i></button>
  </div>
</footer>

<script>lucide.createIcons({ attrs: { width: 18, height: 18, "stroke-width": 1.75, "aria-hidden": "true" } });</script>
</body>
</html>
