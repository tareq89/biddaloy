<!doctype html>
<html lang="bn">
<head>
<!-- app:head -->
<title>Mockup — full-page modal</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-bg text-body text-text-primary">

<!-- ============================================================================
     FullPageShell (D22) — a full-page modal. It covers the app chrome: no top bar,
     no sidebar, no bottom bar. Used for the tasks listed in D23.
     Body width: forms → max-w-3xl · a table, list or preview → max-w-5xl.
     The footer's inner width must be the SAME max-w-* as the body's.
     ============================================================================ -->

<!-- Sticky header: title on the left, a very visible Close (X + word, 44px) on the right. -->
<header class="sticky top-0 z-30 border-b border-border-subtle bg-surface">
  <div class="flex h-14 items-center justify-between gap-4 px-4 md:h-16 md:px-6">
    <h1 class="min-w-0 truncate text-h2 md:text-h1">বাড়ির কাজ তৈরি করুন</h1>
    <button type="button" class="inline-flex h-11 shrink-0 items-center justify-center gap-2 rounded-md border border-border-functional bg-surface px-4 font-medium text-text-primary hover:bg-muted"><i data-lucide="x"></i>বন্ধ করুন</button>
  </div>
</header>

<!-- PROPOSAL — everything inside <main> is the page design. -->
<main id="main-content" class="flex-1">
  <div class="mx-auto w-full max-w-3xl space-y-6 px-4 py-4 md:px-6 md:py-6">

    <section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5" aria-labelledby="s1">
      <h2 id="s1" class="text-h2">১. কী কাজ</h2>
      <p class="mt-1 text-text-secondary">শ্রেণি আর বিষয় বেছে নিয়ে কাজটি লিখুন।</p>
      <div class="mt-4 grid gap-4 md:grid-cols-2">
        <div class="flex flex-col gap-1.5">
          <label for="hw-class" class="text-label text-text-primary">শ্রেণি <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label>
          <button type="button" id="hw-class" aria-haspopup="listbox" class="flex items-center justify-between gap-2 text-left h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"><span class="truncate">ষষ্ঠ</span><i data-lucide="chevron-down" class="size-4 shrink-0 text-text-secondary"></i></button>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="hw-subject" class="text-label text-text-primary">বিষয় <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label>
          <button type="button" id="hw-subject" aria-haspopup="listbox" class="flex items-center justify-between gap-2 text-left h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"><span class="truncate">গণিত</span><i data-lucide="chevron-down" class="size-4 shrink-0 text-text-secondary"></i></button>
        </div>
        <div class="flex flex-col gap-1.5 md:col-span-2">
          <label for="hw-title" class="text-label text-text-primary">শিরোনাম <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label>
          <input id="hw-title" type="text" value="অধ্যায় ৩ অনুশীলনী" class="h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body placeholder:text-text-secondary">
        </div>
        <div class="flex flex-col gap-1.5 md:col-span-2">
          <label for="hw-desc" class="text-label text-text-primary">বিবরণ</label>
          <textarea id="hw-desc" rows="3" class="w-full rounded-md border border-border-functional bg-surface px-3 py-2 text-body-lg text-text-primary placeholder:text-text-secondary md:text-body">পাঠ্যবইয়ের ৩.২ অনুশীলনীর ১ থেকে ১০ নম্বর প্রশ্নের সমাধান খাতায় লিখে আনবে।</textarea>
        </div>
        <div class="flex flex-col gap-1.5 md:col-span-2">
          <label for="hw-mode" class="text-label text-text-primary">মূল্যায়ন পদ্ধতি <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label>
          <button type="button" id="hw-mode" aria-haspopup="listbox" class="flex items-center justify-between gap-2 text-left h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"><span class="truncate">টিক (সম্পন্ন / অসম্পন্ন)</span><i data-lucide="chevron-down" class="size-4 shrink-0 text-text-secondary"></i></button>
          <p class="text-caption text-text-secondary">প্রত্যেক শিক্ষার্থীর পাশে শুধু সম্পন্ন বা অসম্পন্ন চিহ্ন দেবেন।</p>
        </div>
      </div>
    </section>

    <section class="rounded-lg border border-border-subtle bg-surface p-4 shadow-e1 md:p-5" aria-labelledby="s2">
      <h2 id="s2" class="text-h2">২. কাকে, কবে</h2>
      <p class="mt-1 text-text-secondary">পুরো শাখাকে বা একজন শিক্ষার্থীকে দিন।</p>
      <div class="mt-4 grid gap-4 md:grid-cols-2">
        <div role="radiogroup" aria-labelledby="hw-target" class="flex flex-col gap-1.5 md:col-span-2">
          <span id="hw-target" class="text-label text-text-primary">কাকে দেওয়া হবে</span>
          <div class="grid grid-cols-2 gap-2 md:max-w-sm">
            <button type="button" role="radio" aria-checked="false" class="flex h-11 items-center gap-3 rounded-md border border-border-functional bg-surface px-3 text-left md:h-8"><span class="size-4 shrink-0 rounded-full border-2 border-border-functional"></span>শাখা</button>
            <button type="button" role="radio" aria-checked="true" class="flex h-11 items-center gap-3 rounded-md border border-primary bg-secondary px-3 text-left font-medium text-secondary-foreground md:h-8"><span class="flex size-4 shrink-0 items-center justify-center rounded-full border-2 border-primary"><span class="size-2 rounded-full bg-primary"></span></span>শিক্ষার্থী</button>
          </div>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="hw-section" class="text-label text-text-primary">শাখা <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label>
          <button type="button" id="hw-section" aria-haspopup="listbox" class="flex items-center justify-between gap-2 text-left h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"><span class="truncate">ক</span><i data-lucide="chevron-down" class="size-4 shrink-0 text-text-secondary"></i></button>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="hw-student" class="text-label text-text-primary">শিক্ষার্থী <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label>
          <button type="button" id="hw-student" aria-haspopup="listbox" aria-invalid="true" aria-describedby="hw-student-err" class="flex items-center justify-between gap-2 text-left h-11 w-full rounded-md border border-destructive bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"><span class="truncate text-text-secondary">বাছুন</span><i data-lucide="chevron-down" class="size-4 shrink-0 text-text-secondary"></i></button>
          <p id="hw-student-err" class="flex items-center gap-1 text-caption text-destructive"><i data-lucide="circle-alert" class="size-3.5"></i>একজন শিক্ষার্থী বাছুন।</p>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="hw-from" class="text-label text-text-primary">দেওয়ার তারিখ <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label>
          <button type="button" id="hw-from" aria-haspopup="dialog" class="flex items-center justify-between gap-2 text-left h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"><span class="truncate">৪ঠা অক্টোবর, ২০২৬</span><i data-lucide="calendar" class="size-4 shrink-0 text-text-secondary"></i></button>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="hw-due" class="text-label text-text-primary">শেষ তারিখ <span class="text-destructive" aria-hidden="true">*</span><span class="sr-only">(আবশ্যক)</span></label>
          <button type="button" id="hw-due" aria-haspopup="dialog" class="flex items-center justify-between gap-2 text-left h-11 w-full rounded-md border border-border-functional bg-surface px-3 text-body-lg text-text-primary md:h-8 md:text-body"><span class="truncate">১১ই অক্টোবর, ২০২৬</span><i data-lucide="calendar" class="size-4 shrink-0 text-text-secondary"></i></button>
        </div>
      </div>
    </section>

  </div>
</main>

<!-- Footer: secondary action on the left, the ONE primary on the right. 44px at every width.
     IN THE APP it is "sticky bottom-0 z-30". IN A MOCKUP it stays in normal flow (last child of <body>):
     the screenshot tool captures the whole page as one tall frame, and a sticky footer would be painted
     across the middle of it. Do not add "sticky bottom-0" or "fixed" here. -->
<footer class="border-t border-border-subtle bg-surface">
  <div class="mx-auto flex w-full max-w-3xl items-center justify-between gap-2 px-4 py-3 md:px-6">
    <button type="button" class="inline-flex h-11 items-center justify-center gap-2 rounded-md border border-border-functional bg-surface px-4 font-medium text-text-primary hover:bg-muted">বাতিল করুন</button>
    <button type="submit" class="inline-flex h-11 items-center justify-center gap-2 rounded-md bg-primary px-4 font-medium text-primary-foreground">বাড়ির কাজ দিন</button>
  </div>
</footer>

<script>lucide.createIcons({ attrs: { width: 18, height: 18, "stroke-width": 1.75, "aria-hidden": "true" } });</script>
</body>
</html>
