<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><title>SchoolManager ERP</title>
<style>
{{FONTS}}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1080px;background:#fff;color:#191919;font:500 32px/1.35 'Hind Siliguri',sans-serif}
body{padding:64px;display:flex;flex-direction:column}
.wm{font-weight:700;font-size:36px;color:#4a3fd4}
h1{font-size:68px;line-height:1.15;margin:28px 0 12px;font-weight:700}
.sub{font-size:36px;font-weight:600;margin:0 0 28px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:18px}
li{background:#f7f7f5;border-left:10px solid #e4572e;border-radius:8px;padding:14px 22px;font-size:30px}
li b{display:block;font-size:32px}
.foot{margin-top:auto;font-size:38px;font-weight:700}
.foot span{font-size:30px;font-weight:500}
</style></head><body>
<div class="wm">{{WORDMARK}}</div>
<h1>{{HEADLINE}}</h1>
<p class="sub">{{PRICE}}</p>
<ul>{{OUTCOMES}}</ul>
<div class="foot">WhatsApp: {{PHONE}}<br><span>{{SITE}}</span></div>
</body></html>
