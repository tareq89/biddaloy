---
# One command deploys one stack, on the VM that runs it (D1). biddaloy-deploy runs:
#   ansible-playbook -c local -i localhost, /opt/biddaloy/repo/infra/ansible/deploy.yml \
#     -e stack=<prod|staging|demo|edge|ops> -e version=<full 40-hex git sha> \
#     [-e skip_backup=true]
# and BIDDALOY_HOTFIX_REASON="..." in the environment (never an extra var: Ansible templates
# extra vars, so a reason or stack holding {{ }} would run code as root). biddaloy-deploy MUST check
# stack against the five names and version against ^[0-9a-f]{40}$ in bash before calling
# ansible, and reject { } % # in anything it forwards. A -e hotfix_reason is ignored.
# It runs with ANSIBLE_COLLECTIONS_PATH=/opt/biddaloy/ansible/collections. Files come from the checkout in
# /opt/biddaloy/repo (already at `version`); compose runs from there with
# --project-directory /opt/biddaloy/<stack>, where the generated .env lives.
# Plan only (nothing pulled, written or restarted): add --check.
#
# Order, app stacks: preflight -> networks -> env + pg-tls -> pull -> backup (prod) -> migrate
#   -> db redis seaweedfs -> first rebuild (demo, fresh host only) -> app (prod: app, then app2)
#   -> the rest -> smoke -> keep stack.yml -> log.
# Order, edge: preflight -> networks -> env -> copy nginx/ to edge/release.new -> nginx -t on it
#   -> pull -> release.new becomes edge/release (what nginx mounts) -> up -> nginx recreate
#   -> cloudflared recreate (tunnel mode, only when its config or credentials changed).
# Order, ops: preflight -> networks -> env -> pull -> up.
# Host scripts never read the live checkout for a running stack: edge nginx mounts edge/release,
# and nightly / doctor / restore-prod use <stack>/stack.yml, both copied only by an ok deploy.
# Every failure prints FAILED at / Why / Next (tasks/report.yml), is appended to
# /opt/biddaloy/<stack>/deploys.log and sent to Telegram.
# On failure after pre-flight: the previous version is brought back. Migrations are NOT
# reverted (D11).
- name: Deploy biddaloy
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars:
    stack: ''
    version: ''
    # From the environment: lookup results are never templated again (see the header).
    hotfix_note: "{{ lookup('ansible.builtin.env', 'BIDDALOY_HOTFIX_REASON') }}"
    skip_backup: false
    repo_root: '{{ biddaloy_root }}/repo'
    stacks: [prod, staging, demo, edge, ops]
    app_stacks: [prod, staging, demo]
    project_dir: '{{ biddaloy_root }}/{{ stack }}'
    project_name: '{{ stack }}'
    # tunnel or direct, from edge.enc.env (preflight decrypts it before this is read).
    edge_mode: "{{ ((secret_env | default({})).edge | default({})).EDGE_MODE | default('tunnel') }}"
    # The subnet the deploy pins when it creates biddaloy-edge. nginx trusts CF-Connecting-IP
    # only from here in tunnel mode (EDGE_TRUSTED_CIDR, Rule 11).
    edge_subnet: 172.30.0.0/24
    compose_names:
      prod: [stack.yml]
      staging: [stack.yml]
      demo: [stack.yml]
      ops: [ops.yml]
      edge: "{{ ['edge.yml'] + (['edge.direct.yml'] if edge_mode == 'direct' else []) }}"
    compose_files: "{{ compose_names[stack] | map('regex_replace', '^', repo_root ~ '/deploy/') | list }}"
    dc: >-
      docker compose --project-directory {{ project_dir }} -p {{ project_name }}
      {% for f in compose_files %}-f {{ f }} {% endfor %}
      {{ '--profile tunnel' if stack == 'edge' and edge_mode == 'tunnel' else '' }}
    # Images each stack needs in GHCR, all tagged with the full commit sha. ops runs public
    # images pinned by digest.
    images_by_stack:
      prod: [biddaloy-app, biddaloy-backup]
      staging: [biddaloy-app, biddaloy-backup]
      demo: [biddaloy-app, biddaloy-demo-reset]
      edge: [biddaloy-landing]
      ops: []
    images: '{{ images_by_stack[stack] | default([]) }}'
    version_key: "{{ 'LANDING_VERSION' if stack == 'edge' else 'APP_VERSION' }}"
    rollout: "{{ ['app', 'app2'] if stack == 'prod' else ['app'] }}"
    # Named on every app-stack `up`, so it starts exactly these: a bare `up` starts whatever the
    # .env's COMPOSE_PROFILES enable, while a named service starts even when its profile is off.
    # Prod's hourly `backup` is held back while the database had no user before this deploy (a
    # fresh VM): it would upload empty dumps into the live R2 prefixes, push real hourlies out of
    # retention and maybe write today's daily. The next prod deploy (after restore-prod) starts it.
    # Staging and demo name `mailpit` (Epic 87 test inbox): a profile only makes a service
    # eligible, so an unnamed one never starts. --wait covers its healthcheck too.
    app_services: >-
      {{ ('db redis seaweedfs app app2' ~ ('' if (db_users_before | default(1) | int) == 0 else ' backup'))
         if stack == 'prod' else 'db redis seaweedfs mailpit app' }}
    # The rollback runs the previous compose file, which may predate mailpit ("no such service").
    # A mailpit already running is left as it is.
    rollback_services: "{{ app_services | replace(' mailpit', '') }}"
    # Users in the database, in one psql call; a missing table counts as 0 (query_to_xml keeps a
    # missing table from failing at parse time). Run with `dc exec db`, the query as $1.
    users_sql: >-
      SELECT CASE WHEN to_regclass('public.users') IS NULL THEN 0 ELSE (xpath('/row/c/text()',
      query_to_xml('select count(*) c from public.users', false, true, '')))[1]::text::int END
    psql_users_sh: 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc "$1"'
    # Same, on the maintenance db (staging: the active db may not exist yet).
    psql_admin_sh: 'psql -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 -tAc "$1"'
    # The rollback runs the previous version with the compose file(s) its own ok deploy kept
    # (<stack>/stack.yml, edge/release/edge*.yml), not the failing commit's; the checkout's
    # only when no copy exists yet.
    prev_compose_dir: "{{ project_dir ~ '/release' if stack == 'edge' else project_dir }}"
    # Overwritten by write-env; each is copied to <file>.prev first and put back by the rescue.
    rollback_files:
      [.env, cloudflared/config.yml, cloudflared/credentials.json, htpasswd, dozzle/users.yml]
    saved_files: []
    release_swapped: false
    # write-env registers both tunnel files (edge, tunnel mode); skipped elsewhere, so false.
    tunnel_files_changed: >-
      {{ (cloudflared_config | default({})) is changed or (cloudflared_credentials | default({})) is changed }}
    cloudflared_recreated: false
    # The compose command above on one line, for the `Next:` hints (runnable as printed).
    dc_hint: "{{ dc.split() | join(' ') }}"
    deploy_status: failed
    fail_step: deploy
    fail_why: ''
    fail_next: ''
    fail_ctx: { step: deploy, next: 'biddaloy-doctor {{ stack }}' }
    deploy_started: false
    previous_version: ''

  tasks:
    - name: Deploy
      block:
        - name: Pre-flight
          ansible.builtin.include_tasks:
            file: tasks/preflight.yml
            apply:
              tags: [always]
          tags: [always]

        # biddaloy-edge is external for every stack: app / app2 join it and edge nginx finds them
        # there. The subnet is pinned for tunnel mode; an existing network keeps whatever it
        # has and that subnet is what nginx is told to trust.
        - name: Step is the networks
          ansible.builtin.set_fact:
            fail_ctx:
              {
                step: networks,
                next: 'docker network ls; docker network inspect biddaloy-edge biddaloy-ops-edge',
              }
        - name: Create the shared networks (idempotent)
          ansible.builtin.shell: |
            docker network inspect {{ item.name }} >/dev/null 2>&1 || docker network create {{ item.args }} {{ item.name }}
          loop:
            - { name: biddaloy-edge, args: '--subnet {{ edge_subnet }}' }
            - { name: biddaloy-ops-edge, args: '' }
          changed_when: false
        - name: Read the subnet of biddaloy-edge
          ansible.builtin.command: docker network inspect -f '{% raw %}{{ (index .IPAM.Config 0).Subnet }}{% endraw %}' biddaloy-edge
          register: edge_net
          changed_when: false
          check_mode: false
          when: stack == 'edge'
        - name: Remember the subnet
          ansible.builtin.set_fact:
            edge_subnet_actual: '{{ edge_net.stdout | trim }}'
          when: stack == 'edge'

        # From here a failure rolls back (the .env is about to change).
        - name: Step is the env
          ansible.builtin.set_fact:
            deploy_started: true
            fail_ctx: { step: env, next: 'ls -l {{ project_dir }}; check the sops file with:
                  sops -d infra/secrets/{{ stack }}.enc.env >/dev/null' }
        # The rescue puts these back, so a rollback runs with the old secrets and derived values.
        # Only files that exist now are kept; a stale .prev from an older run is removed first.
        - name: Keep the current .env and secret files for a rollback
          ansible.builtin.shell: |
            set -e
            for f in {{ rollback_files | join(' ') }}; do
              rm -f "$f.prev"
              if [ -f "$f" ]; then cp -p "$f" "$f.prev"; echo "$f"; fi
            done
          args:
            chdir: '{{ project_dir }}'
          register: kept
          changed_when: false
          when: not ansible_check_mode
        - name: Remember which files were kept
          ansible.builtin.set_fact:
            saved_files: '{{ kept.stdout_lines | default([]) }}'
        - name: Self-signed Postgres TLS
          ansible.builtin.include_tasks: tasks/pg-tls.yml
          when: stack in app_stacks
        - name: Write .env and the files that come out of the secrets
          ansible.builtin.include_tasks: tasks/write-env.yml

        # Same image, entrypoint, env and mounts as the real nginx, so the templates render the
        # way a restart would. The mounts point at a staged copy of this version's nginx/
        # (REPO_DIR from the environment beats the .env): the live edge/release copy is replaced
        # only after the check passed. A failure here leaves the running edge untouched. Direct
        # mode first runs the one-shot that makes the placeholder certificate nginx needs to boot.
        - name: Step is the nginx check
          ansible.builtin.set_fact:
            fail_ctx:
              {
                step: nginx-check,
                next: 'fix nginx/ in the repo and deploy a new commit; the running edge was not touched',
              }
          when: stack == 'edge'
        - name: Stage this version's nginx files (edge)
          ansible.builtin.shell: |
            set -e
            rm -rf release.new
            mkdir release.new
            cp -a {{ repo_root }}/nginx release.new/nginx
            cp -p {{ repo_root }}/deploy/edge.yml {{ repo_root }}/deploy/edge.direct.yml release.new/
          args:
            chdir: '{{ project_dir }}'
          changed_when: false
          when: stack == 'edge' and not ansible_check_mode
        - name: Placeholder certificate (direct mode, first deploy only)
          ansible.builtin.command: '{{ dc }} run --rm --no-deps cert-bootstrap'
          environment:
            REPO_DIR: '{{ project_dir }}/release.new'
          changed_when: false
          when: stack == 'edge' and edge_mode == 'direct' and not ansible_check_mode
        - name: Check the new nginx config (nginx -t)
          ansible.builtin.command: '{{ dc }} run --rm --no-deps -T --entrypoint sh nginx -c "exec /docker-entrypoint.sh nginx -t"'
          environment:
            REPO_DIR: '{{ project_dir }}/release.new'
          changed_when: false
          when: stack == 'edge' and not ansible_check_mode

        - name: Step is the pull
          ansible.builtin.set_fact:
            fail_ctx:
              {
                step: pull,
                next: '{{ dc_hint }} pull; check disk (df -h /var/lib/docker) and the ghcr.io login',
              }
        - name: Pull the images
          ansible.builtin.command: '{{ dc }} pull --quiet'
          changed_when: false
          when: not ansible_check_mode

        # Counted BEFORE the migration: only a database that had no user before this deploy (a
        # fresh VM) may skip the login smoke (smoke.yml) and hold back prod's backup. A migration
        # that empties a populated users table still fails the smoke. Unknown is not empty.
        - name: Step is the user count
          ansible.builtin.set_fact:
            fail_ctx:
              { step: user-count, next: '{{ dc_hint }} ps db; {{ dc_hint }} logs --tail 100 db' }
          when: stack in ['prod', 'staging']
        - name: Database up for the user count
          ansible.builtin.command: '{{ dc }} up -d --wait --wait-timeout 180 db'
          changed_when: false
          when: stack in ['prod', 'staging'] and not ansible_check_mode
        # Staging: the active db may not exist yet (the db container only creates POSTGRES_DB on an
        # empty volume). The name is one of two fixed values (write-env asserts it).
        - name: Does the active staging database exist?
          ansible.builtin.command:
            argv: "{{ dc.split() + ['exec', '-T', 'db', 'sh', '-c', psql_admin_sh, 'sh', exists_sql] }}"
          vars:
            exists_sql: "SELECT 1 FROM pg_database WHERE datname = '{{ derived_env.POSTGRES_DB }}'"
          register: staging_db_exists
          changed_when: false
          when: stack == 'staging' and not ansible_check_mode
        - name: Create the active staging database
          ansible.builtin.command:
            argv: "{{ dc.split() + ['exec', '-T', 'db', 'sh', '-c', psql_admin_sh, 'sh', create_sql] }}"
          vars:
            create_sql: 'CREATE DATABASE "{{ derived_env.POSTGRES_DB }}"'
          changed_when: true
          when: stack == 'staging' and not ansible_check_mode and (staging_db_exists.stdout | trim) != '1'
        - name: How many users before the migration?
          ansible.builtin.command:
            argv: "{{ dc.split() + ['exec', '-T', 'db', 'sh', '-c', psql_users_sh, 'sh', users_sql] }}"
          register: users_before
          changed_when: false
          failed_when: users_before.rc != 0 or not (users_before.stdout | trim is match('^[0-9]+$'))
          when: stack in ['prod', 'staging'] and not ansible_check_mode
        - name: Remember the user count before the migration
          ansible.builtin.set_fact:
            db_users_before: '{{ users_before.stdout | trim | int }}'
          when: stack in ['prod', 'staging'] and not ansible_check_mode

        # Prod only. A failed backup stops the deploy before migrations touch the DB. Skipped
        # when there is no database volume at all (a truly fresh host), or no user in it (an
        # empty dump would only take a real one's place in R2).
        - name: Step is the backup
          ansible.builtin.set_fact:
            fail_ctx:
              { step: backup, next: '{{ dc_hint }} logs --tail 100 backup; biddaloy-doctor prod;
                  or add --skip-backup if you accept the risk' }
          when: stack == 'prod'
        - name: Fresh backup before migrating (prod)
          ansible.builtin.command: '{{ dc }} run --rm --no-deps --entrypoint /app/backup.sh backup'
          changed_when: true
          when: >-
            stack == 'prod' and db_volume_exists | bool and (db_users_before | default(1) | int) > 0
            and not (skip_backup | bool) and not ansible_check_mode

        # `run` starts the missing db / redis / seaweedfs dependencies by itself.
        # migrate.js pending exits 0 none, 2 pending, 1 error.
        - name: Step is the migration
          ansible.builtin.set_fact:
            fail_ctx:
              {
                step: migrate,
                next: '{{ dc_hint }} run --rm app node server/dist/scripts/migrate.js pending;
                  biddaloy-doctor {{ stack }}',
              }
          when: stack in app_stacks
        - name: Are migrations pending?
          ansible.builtin.command: '{{ dc }} run --rm app node server/dist/scripts/migrate.js pending'
          register: pending
          changed_when: false
          failed_when: pending.rc not in [0, 2]
          when: stack in app_stacks and not ansible_check_mode
        - name: Run migrations
          ansible.builtin.command: '{{ dc }} run --rm app node server/dist/scripts/migrate.js run'
          changed_when: true
          when: stack in app_stacks and not ansible_check_mode and pending.rc == 2

        - name: Step is the data services
          ansible.builtin.set_fact:
            fail_ctx:
              {
                step: data-services,
                next: '{{ dc_hint }} ps; {{ dc_hint }} logs --tail 200 db redis seaweedfs',
              }
          when: stack in app_stacks
        - name: Bring up db redis seaweedfs
          ansible.builtin.include_tasks: tasks/compose-up.yml
          vars:
            up_services: db redis seaweedfs
          when: stack in app_stacks and not ansible_check_mode

        # Staging keeps one bucket per db; SeaweedFS creates only S3_BUCKET on boot, so make the other
        # (staging_bucket_other, from write-env). Already there = nothing to do.
        - name: Step is the other staging bucket
          ansible.builtin.set_fact:
            fail_ctx: { step: staging-bucket, next: '{{ dc_hint }} logs --tail 100 seaweedfs' }
          when: stack == 'staging'
        - name: Is the other staging bucket there?
          ansible.builtin.command:
            argv: "{{ dc.split() + ['exec', '-T', 'seaweedfs', 'curl', '-sf', '-o', '/dev/null', 'http://localhost:8888/buckets/' ~ staging_bucket_other ~ '/'] }}"
          register: other_bucket_there
          failed_when: false
          changed_when: false
          when: stack == 'staging' and not ansible_check_mode
        - name: Create the other staging bucket
          ansible.builtin.command:
            argv: "{{ dc.split() + ['exec', '-T', 'seaweedfs', 'curl', '-sf', '-o', '/dev/null', '-X', 'POST', 'http://localhost:8888/buckets/' ~ staging_bucket_other ~ '/'] }}"
          changed_when: true
          when: stack == 'staging' and not ansible_check_mode and other_bucket_there.rc != 0

        # The demo app refuses to start until a rebuild has written default-school's id to the
        # demo-state volume (stack.yml). On a fresh host the deploy runs that first rebuild; after
        # that the nightly demo-rebuild owns it. reset.sh exit 3 = swapped, cleanup failed: live.
        - name: Step is the first demo rebuild
          ansible.builtin.set_fact:
            fail_ctx:
              {
                step: demo-first-rebuild,
                next: '{{ dc_hint }} run --rm -T demo-reset /app/reset.sh --now; then rerun the deploy',
              }
          when: stack == 'demo'
        # 42, not 1: compose exits 1 for its own errors too, and those must not start a rebuild.
        - name: Has the demo been built yet?
          ansible.builtin.command: '{{ dc }} run --rm --no-deps -T demo-reset sh -c "test -s /demo-state/platform-tenant-id || exit 42"'
          register: demo_built
          changed_when: false
          failed_when: demo_built.rc not in [0, 42]
          when: stack == 'demo' and not ansible_check_mode
        - name: First demo rebuild (fresh host only)
          ansible.builtin.command: '{{ dc }} run --rm -T demo-reset /app/reset.sh --now'
          register: demo_first
          changed_when: true
          failed_when: demo_first.rc not in [0, 3]
          when: stack == 'demo' and not ansible_check_mode and demo_built.rc == 42

        # Prod (D25): app, ready, then app2, ready. A failure on app stops before app2.
        - name: Step is the app rollout
          ansible.builtin.set_fact:
            fail_ctx: { step: ready, next: '{{ dc_hint }} logs --tail 200 app' }
          when: stack in app_stacks
        - name: Restart the app
          ansible.builtin.include_tasks: tasks/rolling-restart.yml
          vars:
            rr_services: '{{ rollout }}'
          when: stack in app_stacks and not ansible_check_mode

        # Edge: the staged nginx/ passed nginx -t, so it becomes what nginx mounts. The old copy
        # stays as release.prev for a rollback. The flag is set before the two moves, so a swap
        # that stops half way (release gone) is still put back by the rescue.
        - name: Step is the nginx files
          ansible.builtin.set_fact:
            fail_ctx: { step: nginx-files, next: 'ls -l {{ project_dir }}; then rerun the deploy' }
            release_swapped: '{{ stack == "edge" and not ansible_check_mode }}'
          when: stack == 'edge'
        - name: Make the checked nginx files the live copy (edge)
          ansible.builtin.shell: |
            set -e
            rm -rf release.prev
            if [ -d release ]; then mv release release.prev; fi
            mv release.new release
          args:
            chdir: '{{ project_dir }}'
          register: release_swap
          changed_when: true
          when: stack == 'edge' and not ansible_check_mode

        - name: Step is the stack start
          ansible.builtin.set_fact:
            fail_ctx: { step: up, next: '{{ dc_hint }} ps; {{ dc_hint }} logs --tail 200' }
        - name: Start the rest of the stack
          ansible.builtin.include_tasks: tasks/compose-up.yml
          vars:
            up_wait: '{{ stack != "edge" }}'
            up_services: "{{ app_services if stack in app_stacks else '' }}"
          when: not ansible_check_mode

        # nginx renders its templates only when the container starts, and they are bind mounts, so
        # `up` does not see a template change: recreate it (the config just passed nginx -t).
        - name: Step is the nginx recreate
          ansible.builtin.set_fact:
            fail_ctx: { step: nginx-recreate, next: '{{ dc_hint }} logs --tail 200 nginx' }
          when: stack == 'edge'
        - name: Recreate nginx so it renders the new templates
          ansible.builtin.command: '{{ dc }} up -d --wait --wait-timeout 120 --no-deps --force-recreate nginx'
          changed_when: true
          when: stack == 'edge' and not ansible_check_mode

        # cloudflared reads its tunnel config only when it starts, and the config is a bind mount,
        # so `up` does not recreate it and a new hostname gets cloudflared's catch-all 404.
        # Recreate it only when write-env changed the config or the credentials, because the
        # tunnel (prod included) drops for a few seconds. After nginx: it waits for nginx.
        - name: Step is the cloudflared recreate
          ansible.builtin.set_fact:
            fail_ctx:
              { step: cloudflared-recreate, next: '{{ dc_hint }} logs --tail 200 cloudflared' }
            cloudflared_recreated: true
          when: stack == 'edge' and edge_mode == 'tunnel' and tunnel_files_changed | bool and not ansible_check_mode
        - name: Recreate cloudflared so it reads the new tunnel config (edge)
          ansible.builtin.command: '{{ dc }} up -d --wait --wait-timeout 60 --no-deps --force-recreate cloudflared'
          changed_when: true
          when: stack == 'edge' and edge_mode == 'tunnel' and tunnel_files_changed | bool and not ansible_check_mode

        - name: Step is the smoke test
          ansible.builtin.set_fact:
            fail_ctx:
              {
                step: smoke,
                next: 'biddaloy-doctor {{ stack }}; {{ dc_hint }} logs --tail 200 app',
              }
          when: stack in app_stacks
        - name: Smoke test
          ansible.builtin.include_tasks: tasks/smoke.yml
          when: stack in app_stacks and not ansible_check_mode

        # nightly, doctor, restore-prod and the next deploy's rollback run the stack with these
        # copies, so a later deploy of another stack (which moves the checkout) cannot change the
        # compose file or the smoke script they use.
        - name: Keep this version's compose file and smoke script for the host scripts
          ansible.builtin.copy:
            src: '{{ repo_root }}/{{ item }}'
            dest: '{{ project_dir }}/{{ item | basename }}'
            remote_src: true
            owner: root
            group: '{{ deploy_user }}'
            mode: '0640'
          loop: [deploy/stack.yml, scripts/smoke-post-deploy.mjs]
          when: stack in app_stacks and not ansible_check_mode

        - name: Deploy ok
          ansible.builtin.set_fact:
            deploy_status: ok

      rescue:
        # The failing task's message; for a command, its last stderr line says more. A looped
        # task reports its first failed item. A no_log task has neither (its output could hold
        # a secret), so its `Next:` line has to carry the help.
        - name: Note what failed
          ansible.builtin.set_fact:
            fail_step: '{{ fail_ctx.step }}'
            fail_next: '{{ fail_ctx.next }}'
            fail_why: >-
              {{ ((failed_item.stderr | default('') | trim).splitlines() | last
                  if (failed_item.stderr | default('') | trim | length > 0)
                  else (failed_item.msg | default('(no message)'))) | string | truncate(300) | replace('\n', ' ') }}
            deploy_status: failed
          vars:
            failed_item: >-
              {{ (ansible_failed_result.results | default([]) | selectattr('failed', 'defined')
                  | selectattr('failed') | list | first) | default(ansible_failed_result) }}

        # An nginx -t failure never touched the running edge: only the files change back.
        - name: Put the previous .env and secret files back after an nginx check failure
          ansible.builtin.command: cp -p {{ project_dir }}/{{ item }}.prev {{ project_dir }}/{{ item }}
          loop: '{{ saved_files }}'
          changed_when: true
          when: fail_step == 'nginx-check' and not ansible_check_mode

        - name: Roll back to the previous version (migrations stay applied, D11)
          when: >-
            deploy_started | bool and previous_version | length > 0 and stack != 'ops'
            and fail_step != 'nginx-check' and not ansible_check_mode
          block:
            - name: Put the previous .env and secret files back
              ansible.builtin.command: cp -p {{ project_dir }}/{{ item }}.prev {{ project_dir }}/{{ item }}
              loop: '{{ saved_files }}'
              changed_when: true
            # Only when the swap finished, or stopped with release gone: release.prev is then the
            # previous version's copy.
            - name: Put the previous nginx files back (edge)
              ansible.builtin.shell: |
                set -e
                if [ -d release.prev ] && { [ ! -d release ] || {{ 'true' if (release_swap.rc | default(1)) == 0 else 'false' }}; }; then
                  rm -rf release; mv release.prev release
                fi
              args:
                chdir: '{{ project_dir }}'
              changed_when: true
              when: stack == 'edge' and release_swapped | bool
            - name: Is there a compose file from the previous ok deploy?
              ansible.builtin.stat:
                path: '{{ prev_compose_dir }}/{{ compose_names[stack][0] }}'
              register: prev_compose
            - name: Compose command for the previous version
              ansible.builtin.set_fact:
                dc_rollback: >-
                  {{ (dc_hint | replace(repo_root ~ '/deploy/', prev_compose_dir ~ '/'))
                     if prev_compose.stat.exists else dc_hint }}
            - name: Pin the previous version
              ansible.builtin.lineinfile:
                path: '{{ project_dir }}/.env'
                regexp: '^{{ version_key }}='
                line: '{{ version_key }}={{ previous_version }}'
              diff: false
              no_log: true
            - name: Restart the app on the previous version
              ansible.builtin.include_tasks: tasks/rolling-restart.yml
              vars:
                rr_services: '{{ rollout }}'
                dc: '{{ dc_rollback }}'
              when: stack in app_stacks
            - name: Start the previous version
              ansible.builtin.include_tasks: tasks/compose-up.yml
              vars:
                up_wait: '{{ stack != "edge" }}'
                up_services: "{{ rollback_services if stack in app_stacks else '' }}"
                dc: '{{ dc_rollback }}'
            # The templates are bind mounts rendered at start: recreate so nginx renders the old ones.
            - name: Recreate nginx on the previous nginx files (edge)
              ansible.builtin.command: '{{ dc_rollback }} up -d --wait --wait-timeout 120 --no-deps --force-recreate nginx'
              changed_when: true
              when: stack == 'edge' and release_swapped | bool
            # The old config.yml is back on disk; a cloudflared already on the new one rereads it.
            - name: Recreate cloudflared on the previous tunnel config (edge)
              ansible.builtin.command: '{{ dc_rollback }} up -d --wait --wait-timeout 60 --no-deps --force-recreate cloudflared'
              changed_when: true
              when: stack == 'edge' and cloudflared_recreated | bool
            - name: Note the rollback
              ansible.builtin.set_fact:
                deploy_status: rolled-back
          rescue:
            - name: Note that the rollback failed too
              ansible.builtin.set_fact:
                fail_why: '{{ fail_why }} | rollback to {{ previous_version[:12] }} failed too'
                fail_next: 'see 07-deployment "When rollback also fails"; {{ fail_next }}'

        - name: Fail so the operator sees it
          ansible.builtin.fail:
            msg: >-
              {{ stack }} {{ version[:12] }} {{ deploy_status }} at {{ fail_step }}.
              {{ 'Migrations were NOT reverted.' if stack in app_stacks else '' }}

      always:
        - name: Report the result
          ansible.builtin.include_tasks: tasks/report.yml
