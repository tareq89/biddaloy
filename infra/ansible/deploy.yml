---
# One command deploys a version:
#   ansible-playbook deploy.yml -e env=prod -e version=<full 40-hex git sha>
# Plan only (nothing pulled, written or restarted): add  --check
# Order: pre-flight -> env -> nginx -t -> pull -> backup -> migrate -> up -> nginx -> edge networks
#        -> ready -> smoke -> log.
# On failure after pre-flight: redeploy the previous version. Migrations are NOT reverted (D11).
- name: Deploy biddaloy
  hosts: all
  become: true
  vars:
    env: ''
    version: ''
    skip_backup: false
    repo_root: '{{ playbook_dir }}/../..'
    project_dir: '{{ biddaloy_root }}/{{ env }}'
    project_name: 'biddaloy-{{ env }}'
    overlay: { prod: [], demo: [docker-compose.demo.yml], staging: [docker-compose.staging.yml] }
    compose_names: "{{ ['docker-compose.yml'] + (overlay[env] | default([])) }}"
    compose_files: "{{ compose_names | map('regex_replace', '^', project_dir ~ '/') | list }}"
    dc: >-
      docker compose --project-directory {{ project_dir }} -p {{ project_name }}
      {% for f in compose_files %}-f {{ f }} {% endfor %}
    # write-env.yml pins APP_VERSION inside the file it writes: one write per run, mode and
    # owner stay root:deploy 0640, and no handler restarts anything behind the play's back.
    app_version: '{{ version }}'
    images_by_env:
      {
        prod: [biddaloy-app, biddaloy-backup],
        demo: [biddaloy-app, biddaloy-demo-reset],
        staging: [biddaloy-app],
      }
    images: '{{ images_by_env[env] | default([]) }}'
    smoke_vars:
      [
        SMOKE_ADMIN_EMAIL,
        SMOKE_ADMIN_PASSWORD,
        SMOKE_TEACHER_EMAIL,
        SMOKE_TEACHER_PASSWORD,
        SMOKE_SUPER_ADMIN_EMAIL,
        SMOKE_SUPER_ADMIN_PASSWORD,
      ]
    # demo_domain is not in the inventory yet: demo skips the smoke test until it is.
    # Staging also skips it: Cloudflare Access answers the smoke script with a login redirect.
    base_domain: "{{ {'prod': app_domain, 'staging': '', 'demo': demo_domain | default('')}[env] | default('') }}"

  pre_tasks:
    # Everything here runs before any change, also under --check (D27).
    - name: Check the inputs
      ansible.builtin.assert:
        that:
          - env in ['prod', 'demo', 'staging']
          # CI tags images with the full commit SHA (publish-image.yml); a short one never exists.
          - version is match('^[0-9a-f]{40}$')
          # Skipping pull/migrate/up would still log `<version> ok`: the next rollback target.
          - "'mutating' not in ansible_skip_tags"
        fail_msg: 'Usage: -e env=prod|demo|staging -e version=<full 40-hex git sha> (no --skip-tags mutating; plan with --check)'
        quiet: true
      tags: [always]

    - name: Check the smoke credentials are set on this machine
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', item) | length > 0
        fail_msg: 'export {{ item }} before deploying (smoke test logins)'
        quiet: true
      loop: '{{ smoke_vars }}'
      when: base_domain | length > 0
      no_log: true
      tags: [always]

    - name: Check the repo checkout is the version being deployed
      ansible.builtin.assert:
        that: lookup('ansible.builtin.pipe', 'git -C ' ~ repo_root ~ ' rev-parse HEAD') == version
        fail_msg: 'Check out {{ version }} first: compose files and nginx are copied from this checkout.'
        quiet: true
      tags: [always]

    # The copied files must be exactly what `version` holds, or deploys.log lies.
    - name: Check the compose files and nginx/ have no uncommitted changes
      ansible.builtin.assert:
        that: lookup('ansible.builtin.pipe', 'git -C ' ~ repo_root ~ " status --porcelain -- 'docker-compose*.yml' nginx") | length == 0
        fail_msg: 'Commit or discard your changes to docker-compose*.yml and nginx/ first: they would be deployed as {{ version }}.'
        quiet: true
      tags: [always]

    - name: Check the compose files exist in the repo
      ansible.builtin.stat:
        path: '{{ repo_root }}/{{ item }}'
      register: compose_src
      delegate_to: localhost
      become: false
      loop: '{{ compose_names }}'
      tags: [always]

    - name: Stop early when a compose file is missing
      ansible.builtin.fail:
        msg: >-
          {{ item.item }} is missing. Nothing was changed.
      when: not item.stat.exists
      loop: '{{ compose_src.results }}'
      loop_control:
        label: '{{ item.item }}'
      tags: [always]

    # Staging only (D25): refuse a provider key, a prod DB/bucket or a real Turnstile secret.
    # Runs here, before any change. The decrypted env goes in on stdin; it is never written
    # to the controller. Values are not printed (config-check names variables only).
    # `--env staging` also applies what docker-compose.staging.yml sets for `app`
    # (DEMO_MODE, DATABASE_URL, S3_BUCKET), so it judges the env the container really gets.
    - name: Staging config check (no real SMS / WhatsApp / email provider)
      ansible.builtin.command: yarn workspace @biddaloy/server config:check --env staging --file /dev/stdin
      args:
        chdir: '{{ repo_root }}'
        stdin: "{{ lookup('community.sops.sops', playbook_dir ~ '/../secrets/staging.enc.env', rstrip=false) }}"
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      register: staging_check
      failed_when: false
      no_log: true
      when: env == 'staging'
      tags: [always]

    # The task above is no_log (its stdin is the secrets), so print its verdict here.
    - name: Stop when the staging config check failed
      ansible.builtin.fail:
        msg: "{{ staging_check.stderr | default('') }}{{ staging_check.stdout | default('') }}"
      when: env == 'staging' and staging_check.rc | default(0) != 0
      tags: [always]

    # Cloudflare Access gate (12-operations.md section 1, step 0). OPS_DOMAIN / STAGING_DOMAIN
    # in the prod .env are what make prod nginx answer ops.<domain> / staging.<domain>. Until
    # the owner has set up Access for both and set access_confirmed: true in the inventory,
    # a prod deploy refuses to write them. It also refuses them with TRUSTED_PROXY_CIDRS
    # empty: then every peer is "Cloudflare", and nginx's Cf-Access-Jwt-Assertion check is a
    # tripwire (presence only), not authentication, so anyone could reach Dozzle.
    # The regexes read the file the way compose does (`export `, spaces, quotes).
    - name: Do the prod secrets name the ops or staging hostname, and lock the origin?
      ansible.builtin.set_fact:
        names_access_hosts: '{{ prod_env is search(domain_re) }}'
        has_proxy_cidrs: '{{ prod_env is search(cidrs_re) }}'
      vars:
        prod_env: "{{ lookup('community.sops.sops', playbook_dir ~ '/../secrets/prod.enc.env', rstrip=false) }}"
        domain_re: '(?m)^[ \t]*(export[ \t]+)?(OPS|STAGING)_DOMAIN[ \t]*=[ \t]*[''"]?[^\s''"]'
        cidrs_re: '(?m)^[ \t]*(export[ \t]+)?TRUSTED_PROXY_CIDRS[ \t]*=[ \t]*[''"]?[^\s''"]'
      no_log: true
      when: env == 'prod'
      tags: [always]

    - name: Refuse to expose ops / staging before Cloudflare Access and the origin lock
      ansible.builtin.assert:
        that: >-
          not (names_access_hosts | default(false) | bool) or
          ((access_confirmed | default(false) | bool) and (has_proxy_cidrs | default(false) | bool))
        fail_msg: >-
          prod.enc.env sets OPS_DOMAIN or STAGING_DOMAIN, but access_confirmed is not true or
          TRUSTED_PROXY_CIDRS is empty. Set up Cloudflare Access for both hostnames first
          (12-operations.md section 1, step 0), set TRUSTED_PROXY_CIDRS (section 3.5), then set
          access_confirmed: true in inventory/prod.yml.
        quiet: true
      when: env == 'prod'
      tags: [always]

    - name: Check the image tag exists in the registry
      ansible.builtin.command: docker manifest inspect ghcr.io/tareq89/{{ item }}:{{ version }}
      changed_when: false
      check_mode: false
      loop: '{{ images }}'
      tags: [always]

    # The restore drill mounts this file into `backup`; without it the backup container (and so
    # the pre-migrate backup) cannot start. 12-operations.md section 8 says how it gets here.
    - name: Check the backup age key is on the host (prod)
      ansible.builtin.stat:
        path: '{{ project_dir }}/age-key.txt'
      register: age_key
      when: env == 'prod'
      tags: [always]

    - name: Stop when the backup age key is missing or has the wrong owner or mode
      ansible.builtin.assert:
        that:
          - age_key.stat.exists
          - age_key.stat.uid == 10001
          - age_key.stat.mode == '0400'
        fail_msg: '{{ project_dir }}/age-key.txt must exist, owner 10001, mode 0400 (12-operations.md section 8).'
        quiet: true
      when: env == 'prod'
      tags: [always]

    # Rollback target: the last `ok` line in deploys.log. When there is none (log deleted,
    # stack started by hand, first deploy after a restore), the tag of the app container that
    # is running now. Only a full commit SHA counts.
    - name: Find the previous version
      ansible.builtin.shell: |
        f={{ project_dir }}/deploys.log
        v=$([ -f "$f" ] && awk '$2=="{{ env }}" && $4=="ok" {v=$3} END {print v}' "$f")
        [ -n "$v" ] || v=$(docker ps --filter label=com.docker.compose.project={{ project_name }} \
          --filter label=com.docker.compose.service=app --format '{% raw %}{{.Image}}{% endraw %}' | head -n1 | sed 's/.*://')
        echo "$v" | grep -E '^[0-9a-f]{40}$' || true
      register: prev
      changed_when: false
      check_mode: false
      tags: [always]

    # The pre-migrate backup keys off the data, not the log: if the database volume exists,
    # there may be data, so the backup must run (and must succeed).
    - name: Does the prod database volume exist?
      ansible.builtin.command: docker volume inspect {{ project_name }}_pgdata
      register: pgdata
      changed_when: false
      failed_when: false
      check_mode: false
      when: env == 'prod'
      tags: [always]

    - name: Remember the previous version and whether prod has a database volume
      ansible.builtin.set_fact:
        previous_version: '{{ prev.stdout | trim }}'
        db_volume_exists: "{{ env == 'prod' and pgdata.rc | default(1) == 0 }}"
      tags: [always]

    # `--tags env` only rewrites .env (APP_VERSION included) and restarts nothing. Pinning a
    # version that was never deployed would start it, unmigrated, at the next restart.
    # Rotation is a full deploy of the running version (12-operations.md section 8).
    - name: Refuse --tags env with a version other than the running one
      ansible.builtin.assert:
        that: "'env' not in ansible_run_tags or version == previous_version"
        fail_msg: '--tags env only re-pins the running version ({{ previous_version }}). Rotate with a full deploy of it.'
        quiet: true
      tags: [always]

  tasks:
    - name: Deploy
      block:
        - name: Create the project directory
          ansible.builtin.file:
            path: '{{ project_dir }}'
            state: directory
            owner: root
            group: '{{ deploy_user }}'
            mode: '0750'
          tags: [mutating]

        - name: Copy the compose files
          ansible.builtin.copy:
            src: '{{ repo_root }}/{{ item }}'
            dest: '{{ project_dir }}/{{ item }}'
            mode: '0644'
          loop: '{{ compose_names }}'
          tags: [mutating]

        # nginx renders templates only when its container starts. Keep the current set, so a
        # template that fails `nginx -t` is put back before anything can load it.
        - name: Keep the current nginx files
          ansible.builtin.shell: rm -rf nginx.prev && { [ ! -d nginx ] || cp -a nginx nginx.prev; }
          args:
            chdir: '{{ project_dir }}'
          changed_when: false
          when: env in ['prod', 'demo'] and not ansible_check_mode
          tags: [mutating]

        - name: Copy the nginx templates
          ansible.builtin.copy:
            src: '{{ repo_root }}/nginx/'
            dest: '{{ project_dir }}/nginx/'
            mode: preserve
          register: nginx_files
          tags: [mutating]

        - name: Write .env from the encrypted file
          ansible.builtin.include_tasks:
            file: tasks/write-env.yml
            apply:
              tags: [env]
          tags: [env]

        # Same image, entrypoint, env and mounts as the real nginx, so the templates render the
        # way a restart would render them. Runs on every prod / demo deploy, not only when nginx/
        # changed: a new .env value nginx reads (TRUSTED_PROXY_CIDRS, *_DOMAIN) can break it too,
        # and compose-up would recreate nginx with it. On failure the previous files go back and
        # the rescue redeploys the previous version; it reuses the new .env, so a bad env value
        # still has to be fixed by hand (07-deployment "When rollback also fails").
        # `nginx -t` resolves the fixed upstream
        # `app` and fails when no app container runs (first deploy), so the throwaway container
        # gets an /etc/hosts entry for it; only the config is tested, nothing is proxied.
        - name: Check the new nginx config (nginx -t)
          ansible.builtin.shell: |
            {{ dc }} run --rm --no-deps -T --entrypoint sh nginx -c \
              'grep -q "[[:space:]]app$" /etc/hosts || echo "127.0.0.1 app" >> /etc/hosts; exec /docker-entrypoint.sh nginx -t' || {
              rm -rf nginx && { [ ! -d nginx.prev ] || mv nginx.prev nginx; }
              echo 'nginx -t failed: the previous nginx files were put back' >&2
              exit 1
            }
          args:
            chdir: '{{ project_dir }}'
          changed_when: false
          when: env in ['prod', 'demo'] and not ansible_check_mode
          tags: [mutating]

        - name: Pull the images
          community.docker.docker_compose_v2_pull:
            project_src: '{{ project_dir }}'
            project_name: '{{ project_name }}'
            files: '{{ compose_files }}'
            policy: always
          tags: [mutating]

        # Prod only. A failed backup stops the deploy before migrations touch the DB.
        # Skipped only when there is no database volume at all (a truly fresh host).
        - name: Fresh backup before migrating (prod)
          ansible.builtin.command: '{{ dc }} run --rm --no-deps --entrypoint /app/backup.sh backup'
          when: db_volume_exists | bool and not (skip_backup | bool) and not ansible_check_mode
          tags: [mutating]

        - name: Are migrations pending? (0 none, 2 pending, 1 error)
          ansible.builtin.command: '{{ dc }} run --rm app node server/dist/scripts/migrate.js pending'
          register: pending
          changed_when: false
          failed_when: pending.rc not in [0, 2]
          when: not ansible_check_mode
          tags: [mutating]

        - name: Run migrations
          ansible.builtin.command: '{{ dc }} run --rm app node server/dist/scripts/migrate.js run'
          when: not ansible_check_mode and pending.rc == 2
          tags: [mutating]

        - name: Start the new version
          ansible.builtin.include_tasks: tasks/compose-up.yml

        - name: Load the new nginx config (templates render only at container start)
          ansible.builtin.command: '{{ dc }} up -d --wait --no-deps --force-recreate nginx'
          when: env in ['prod', 'demo'] and nginx_files is changed and not ansible_check_mode
          tags: [mutating]

        # `--tags edge` redoes only this, after a recreate by hand (a recreate drops the attaches).
        - name: Attach prod nginx, staging and ops to their edge networks
          ansible.builtin.include_tasks:
            file: tasks/attach-edge.yml
            apply:
              tags: [edge]
          tags: [edge]

        - name: Wait until the app reports ready
          ansible.builtin.command: >-
            {{ dc }} exec -T app sh -c
            'wget -qO- --header "X-Health-Token: $HEALTH_TOKEN" http://127.0.0.1:3000/api/health/ready'
          register: ready
          until: ready.rc == 0 and '"status":"fail"' not in (ready.stdout | replace(' ', ''))
          retries: 24
          delay: 5
          changed_when: false
          when: not ansible_check_mode

        - name: Smoke test the public URL
          ansible.builtin.command: node scripts/smoke-post-deploy.mjs --base-url https://{{ base_domain }}
          args:
            chdir: '{{ repo_root }}'
          delegate_to: localhost
          become: false
          changed_when: false
          when: base_domain | length > 0 and not ansible_check_mode

        - name: Deploy ok
          ansible.builtin.set_fact:
            deploy_status: ok

      rescue:
        - name: Roll back to the previous version (migrations stay applied, D11)
          when: previous_version | length > 0
          block:
            - name: Pin the previous APP_VERSION
              ansible.builtin.lineinfile:
                path: '{{ project_dir }}/.env'
                regexp: '^APP_VERSION='
                line: 'APP_VERSION={{ previous_version }}'
              diff: false
              no_log: true
            - name: Start the previous version
              ansible.builtin.include_tasks: tasks/compose-up.yml
            - name: Attach prod nginx, staging and ops to their edge networks
              ansible.builtin.include_tasks: tasks/attach-edge.yml
            - name: Note the rollback
              ansible.builtin.set_fact:
                deploy_status: rolled-back

        - name: Fail so the operator sees it
          ansible.builtin.fail:
            msg: >-
              {{ version }} failed.
              {{ ('Rolled back to ' ~ previous_version ~ '. Migrations were NOT reverted.')
                 if previous_version | length > 0 else 'No previous version to roll back to.' }}
              If the app is still down: see 07-deployment "When rollback also fails".

      always:
        - name: Append to deploys.log
          ansible.builtin.lineinfile:
            path: '{{ project_dir }}/deploys.log'
            line: "{{ lookup('pipe', 'date -u +%FT%TZ') }} {{ env }} {{ version }} {{ deploy_status | default('failed') }}"
            create: true
            mode: '0640'
          when: not ansible_check_mode
