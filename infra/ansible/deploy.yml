---
# One command deploys one stack, on the VM that runs it (D1). biddaloy-deploy runs:
#   ansible-playbook -c local -i localhost, /opt/biddaloy/repo/infra/ansible/deploy.yml \
#     -e stack=<prod|staging|demo|edge|ops> -e version=<full 40-hex git sha> \
#     [-e skip_backup=true]
# and BIDDALOY_HOTFIX_REASON="..." in the environment (never an extra var: Ansible templates
# extra vars, so a reason or stack holding {{ }} would run code as root). biddaloy-deploy MUST check
# stack against the five names and version against ^[0-9a-f]{40}$ in bash before calling
# ansible, and reject { } % # in anything it forwards. A -e hotfix_reason is ignored.
# with ANSIBLE_COLLECTIONS_PATH=/opt/biddaloy/ansible/collections. Files come from the checkout in
# /opt/biddaloy/repo (already at `version`); compose runs from there with
# --project-directory /opt/biddaloy/<stack>, where the generated .env lives.
# Plan only (nothing pulled, written or restarted): add --check.
#
# Order, app stacks: preflight -> networks -> env + pg-tls -> pull -> backup (prod) -> migrate
#   -> db redis seaweedfs -> app (prod: app, then app2) -> the rest -> smoke -> log.
# Order, edge: preflight -> networks -> env -> pull -> nginx -t -> up -> nginx reload.
# Order, ops: preflight -> networks -> env -> pull -> up.
# Every failure prints FAILED at / Why / Next (tasks/report.yml), is appended to
# /opt/biddaloy/<stack>/deploys.log and sent to Telegram.
# On failure after pre-flight: the previous version is brought back. Migrations are NOT
# reverted (D11).
- name: Deploy biddaloy
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars:
    stack: ''
    version: ''
    # From the environment: lookup results are never templated again (see the header).
    hotfix_note: "{{ lookup('ansible.builtin.env', 'BIDDALOY_HOTFIX_REASON') }}"
    skip_backup: false
    repo_root: '{{ biddaloy_root }}/repo'
    stacks: [prod, staging, demo, edge, ops]
    app_stacks: [prod, staging, demo]
    project_dir: '{{ biddaloy_root }}/{{ stack }}'
    project_name: '{{ stack }}'
    # tunnel or direct, from edge.enc.env (preflight decrypts it before this is read).
    edge_mode: "{{ ((secret_env | default({})).edge | default({})).EDGE_MODE | default('tunnel') }}"
    # The subnet the deploy pins when it creates biddaloy-edge. nginx trusts CF-Connecting-IP
    # only from here in tunnel mode (EDGE_TRUSTED_CIDR, Rule 11).
    edge_subnet: 172.30.0.0/24
    compose_names:
      prod: [stack.yml]
      staging: [stack.yml]
      demo: [stack.yml]
      ops: [ops.yml]
      edge: "{{ ['edge.yml'] + (['edge.direct.yml'] if edge_mode == 'direct' else []) }}"
    compose_files: "{{ compose_names[stack] | map('regex_replace', '^', repo_root ~ '/deploy/') | list }}"
    dc: >-
      docker compose --project-directory {{ project_dir }} -p {{ project_name }}
      {% for f in compose_files %}-f {{ f }} {% endfor %}
      {{ '--profile tunnel' if stack == 'edge' and edge_mode == 'tunnel' else '' }}
    # Images each stack needs in GHCR, all tagged with the full commit sha. ops runs public
    # images pinned by digest.
    images_by_stack:
      prod: [biddaloy-app, biddaloy-backup]
      staging: [biddaloy-app, biddaloy-backup]
      demo: [biddaloy-app, biddaloy-demo-reset]
      edge: [biddaloy-landing]
      ops: []
    images: '{{ images_by_stack[stack] | default([]) }}'
    version_key: "{{ 'LANDING_VERSION' if stack == 'edge' else 'APP_VERSION' }}"
    rollout: "{{ ['app', 'app2'] if stack == 'prod' else ['app'] }}"
    # Named on every app-stack `up`: staging and demo set COMPOSE_PROFILES for their one-off
    # jobs (jobs, demo-reset), and a bare `up` would try to start those.
    app_services: "{{ 'db redis seaweedfs app app2 backup' if stack == 'prod' else 'db redis seaweedfs app' }}"
    env_saved: false
    deploy_status: failed
    fail_step: deploy
    fail_why: ''
    fail_next: ''
    fail_ctx: { step: deploy, next: 'biddaloy-doctor {{ stack }}' }
    deploy_started: false
    previous_version: ''

  tasks:
    - name: Deploy
      block:
        - name: Pre-flight
          ansible.builtin.include_tasks:
            file: tasks/preflight.yml
            apply:
              tags: [always]
          tags: [always]

        # biddaloy-edge is external for every stack: app / app2 join it and edge nginx finds them
        # there. The subnet is pinned for tunnel mode; an existing network keeps whatever it
        # has and that subnet is what nginx is told to trust.
        - name: Step is the networks
          ansible.builtin.set_fact:
            fail_ctx: { step: networks, next: 'docker network ls; docker network inspect biddaloy-edge biddaloy-ops-edge' }
        - name: Create the shared networks (idempotent)
          ansible.builtin.shell: |
            docker network inspect {{ item.name }} >/dev/null 2>&1 || docker network create {{ item.args }} {{ item.name }}
          loop:
            - { name: biddaloy-edge, args: '--subnet {{ edge_subnet }}' }
            - { name: biddaloy-ops-edge, args: '' }
          changed_when: false
        - name: Read the subnet of biddaloy-edge
          ansible.builtin.command: docker network inspect -f '{% raw %}{{ (index .IPAM.Config 0).Subnet }}{% endraw %}' biddaloy-edge
          register: edge_net
          changed_when: false
          check_mode: false
          when: stack == 'edge'
        - name: Remember the subnet
          ansible.builtin.set_fact:
            edge_subnet_actual: '{{ edge_net.stdout | trim }}'
          when: stack == 'edge'

        # From here a failure rolls back (the .env is about to change).
        - name: Step is the env
          ansible.builtin.set_fact:
            deploy_started: true
            fail_ctx: { step: env, next: 'ls -l {{ project_dir }}; check the sops file with:
                sops -d infra/secrets/{{ stack }}.enc.env >/dev/null' }
        # The rescue puts this back, so a rollback runs with the old secrets and derived values.
        - name: Keep the current .env for a rollback
          ansible.builtin.shell: if [ -f .env ]; then cp -p .env .env.prev; fi # noqa command-instead-of-shell
          args:
            chdir: '{{ project_dir }}'
          changed_when: false
          when: not ansible_check_mode
        - name: Remember the .env copy exists
          ansible.builtin.set_fact:
            env_saved: true
        - name: Self-signed Postgres TLS
          ansible.builtin.include_tasks: tasks/pg-tls.yml
          when: stack in app_stacks
        - name: Write .env and the files that come out of the secrets
          ansible.builtin.include_tasks: tasks/write-env.yml

        # Same image, entrypoint, env and mounts as the real nginx, so the templates render the
        # way a restart would. A failure here leaves the running edge untouched. Direct mode
        # first runs the one-shot that makes the placeholder certificate nginx needs to boot.
        - name: Step is the nginx check
          ansible.builtin.set_fact:
            fail_ctx: { step: nginx-check, next: 'fix nginx/ in the repo and deploy a new commit; the running edge was not touched' }
          when: stack == 'edge'
        - name: Placeholder certificate (direct mode, first deploy only)
          ansible.builtin.command: '{{ dc }} run --rm --no-deps cert-bootstrap'
          changed_when: false
          when: stack == 'edge' and edge_mode == 'direct' and not ansible_check_mode
        - name: Check the new nginx config (nginx -t)
          ansible.builtin.command: '{{ dc }} run --rm --no-deps -T --entrypoint sh nginx -c "exec /docker-entrypoint.sh nginx -t"'
          changed_when: false
          when: stack == 'edge' and not ansible_check_mode

        - name: Step is the pull
          ansible.builtin.set_fact:
            fail_ctx: { step: pull, next: 'docker compose -p {{ stack }} pull; check disk (df -h /var/lib/docker) and the ghcr.io login' }
        - name: Pull the images
          ansible.builtin.command: '{{ dc }} pull --quiet'
          changed_when: false
          when: not ansible_check_mode

        # Prod only. A failed backup stops the deploy before migrations touch the DB. Skipped
        # only when there is no database volume at all (a truly fresh host).
        - name: Step is the backup
          ansible.builtin.set_fact:
            fail_ctx: { step: backup, next: 'docker compose -p prod logs --tail 100 backup; biddaloy-doctor prod;
                or add --skip-backup if you accept the risk' }
          when: stack == 'prod'
        - name: Fresh backup before migrating (prod)
          ansible.builtin.command: '{{ dc }} run --rm --no-deps --entrypoint /app/backup.sh backup'
          changed_when: true
          when: stack == 'prod' and db_volume_exists | bool and not (skip_backup | bool) and not ansible_check_mode

        # `run` starts the missing db / redis / seaweedfs dependencies by itself.
        # migrate.js pending exits 0 none, 2 pending, 1 error.
        - name: Step is the migration
          ansible.builtin.set_fact:
            fail_ctx: { step: migrate, next: 'docker compose -p {{ stack }} run --rm app node server/dist/scripts/migrate.js pending;
                biddaloy-doctor {{ stack }}' }
          when: stack in app_stacks
        - name: Are migrations pending?
          ansible.builtin.command: '{{ dc }} run --rm app node server/dist/scripts/migrate.js pending'
          register: pending
          changed_when: false
          failed_when: pending.rc not in [0, 2]
          when: stack in app_stacks and not ansible_check_mode
        - name: Run migrations
          ansible.builtin.command: '{{ dc }} run --rm app node server/dist/scripts/migrate.js run'
          changed_when: true
          when: stack in app_stacks and not ansible_check_mode and pending.rc == 2

        - name: Step is the data services
          ansible.builtin.set_fact:
            fail_ctx: { step: data-services, next: 'docker compose -p {{ stack }} ps;
                docker compose -p {{ stack }} logs --tail 200 db redis seaweedfs' }
          when: stack in app_stacks
        - name: Bring up db redis seaweedfs
          ansible.builtin.include_tasks: tasks/compose-up.yml
          vars:
            up_services: db redis seaweedfs
          when: stack in app_stacks and not ansible_check_mode

        # Prod (D25): app, ready, then app2, ready. A failure on app stops before app2.
        - name: Step is the app rollout
          ansible.builtin.set_fact:
            fail_ctx: { step: ready, next: 'docker compose -p {{ stack }} logs --tail 200 app' }
          when: stack in app_stacks
        - name: Restart the app
          ansible.builtin.include_tasks: tasks/rolling-restart.yml
          vars:
            rr_services: '{{ rollout }}'
          when: stack in app_stacks and not ansible_check_mode

        - name: Step is the stack start
          ansible.builtin.set_fact:
            fail_ctx: { step: up, next: 'docker compose -p {{ stack }} ps; docker compose -p {{ stack }} logs --tail 200' }
        - name: Start the rest of the stack
          ansible.builtin.include_tasks: tasks/compose-up.yml
          vars:
            up_wait: '{{ stack != "edge" }}'
            up_services: "{{ app_services if stack in app_stacks else '' }}"
          when: not ansible_check_mode

        # nginx renders its templates only when the container starts, and they are bind mounts, so
        # `up` does not see a template change: recreate it (the config just passed nginx -t).
        - name: Step is the nginx recreate
          ansible.builtin.set_fact:
            fail_ctx: { step: nginx-recreate, next: 'docker compose -p edge logs --tail 200 nginx' }
          when: stack == 'edge'
        - name: Recreate nginx so it renders the new templates
          ansible.builtin.command: '{{ dc }} up -d --wait --wait-timeout 120 --no-deps --force-recreate nginx'
          changed_when: true
          when: stack == 'edge' and not ansible_check_mode

        - name: Step is the smoke test
          ansible.builtin.set_fact:
            fail_ctx: { step: smoke, next: 'biddaloy-doctor {{ stack }}; docker compose -p {{ stack }} logs --tail 200 app' }
          when: stack in app_stacks
        - name: Smoke test
          ansible.builtin.include_tasks: tasks/smoke.yml
          when: stack in app_stacks and not ansible_check_mode

        - name: Deploy ok
          ansible.builtin.set_fact:
            deploy_status: ok

      rescue:
        # The failing task's message; for a command, its last stderr line says more. A looped
        # task reports its first failed item. A no_log task has neither (its output could hold
        # a secret), so its `Next:` line has to carry the help.
        - name: Note what failed
          ansible.builtin.set_fact:
            fail_step: '{{ fail_ctx.step }}'
            fail_next: '{{ fail_ctx.next }}'
            fail_why: >-
              {{ ((failed_item.stderr | default('') | trim).splitlines() | last
                  if (failed_item.stderr | default('') | trim | length > 0)
                  else (failed_item.msg | default('(no message)'))) | string | truncate(300) | replace('\n', ' ') }}
            deploy_status: failed
          vars:
            failed_item: >-
              {{ (ansible_failed_result.results | default([]) | selectattr('failed', 'defined')
                  | selectattr('failed') | list | first) | default(ansible_failed_result) }}

        # An nginx -t failure never touched the running edge: only the files change back.
        - name: Put the previous .env back after an nginx check failure
          ansible.builtin.command: cp -p {{ project_dir }}/.env.prev {{ project_dir }}/.env
          changed_when: true
          when: fail_step == 'nginx-check' and env_saved | bool and not ansible_check_mode

        - name: Roll back to the previous version (migrations stay applied, D11)
          when: >-
            deploy_started | bool and previous_version | length > 0 and stack != 'ops'
            and fail_step != 'nginx-check' and not ansible_check_mode
          block:
            - name: Put the previous .env back
              ansible.builtin.command: cp -p {{ project_dir }}/.env.prev {{ project_dir }}/.env
              changed_when: true
              when: env_saved | bool
            - name: Pin the previous version
              ansible.builtin.lineinfile:
                path: '{{ project_dir }}/.env'
                regexp: '^{{ version_key }}='
                line: '{{ version_key }}={{ previous_version }}'
              diff: false
              no_log: true
            - name: Restart the app on the previous version
              ansible.builtin.include_tasks: tasks/rolling-restart.yml
              vars:
                rr_services: '{{ rollout }}'
              when: stack in app_stacks
            - name: Start the previous version
              ansible.builtin.include_tasks: tasks/compose-up.yml
              vars:
                up_wait: '{{ stack != "edge" }}'
                up_services: "{{ app_services if stack in app_stacks else '' }}"
            - name: Note the rollback
              ansible.builtin.set_fact:
                deploy_status: rolled-back
          rescue:
            - name: Note that the rollback failed too
              ansible.builtin.set_fact:
                fail_why: '{{ fail_why }} | rollback to {{ previous_version[:12] }} failed too'
                fail_next: 'see 07-deployment "When rollback also fails"; {{ fail_next }}'

        - name: Fail so the operator sees it
          ansible.builtin.fail:
            msg: >-
              {{ stack }} {{ version[:12] }} {{ deploy_status }} at {{ fail_step }}.
              {{ 'Migrations were NOT reverted.' if stack in app_stacks else '' }}

      always:
        - name: Report the result
          ansible.builtin.include_tasks: tasks/report.yml
