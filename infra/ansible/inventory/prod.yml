---
all:
  hosts:
    biddaloy-prod:
      # Public IP of the VM: export BIDDALOY_PROD_HOST=203.0.113.10
      ansible_host: "{{ lookup('ansible.builtin.env', 'BIDDALOY_PROD_HOST') }}"
      # First run on a fresh VM: -e ansible_user=root (or the cloud image user).
      ansible_user: deploy
  vars:
    app_domain: app.schoolmanagerp.com
    # OPS_DOMAIN / STAGING_DOMAIN live in prod.enc.env (what nginx reads), not here.
    # true only once Cloudflare Access protects ops.<domain> and staging.<domain> and the
    # origin check in 12-operations.md section 1 step 0 passed. Until then a prod deploy
    # refuses a prod.enc.env that sets either hostname.
    access_confirmed: false
