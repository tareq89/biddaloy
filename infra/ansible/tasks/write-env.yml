---
# Writes <stack>/.env from the secrets preflight.yml decrypted (on this VM, with the host
# key), plus the derived values and the per-stack files that come out of the secrets.
# Runs as root; the directories come from provision.yml and this file creates none of the
# <stack> ones. Every task that touches a value has no_log: true and diff: false (Security
# rule 13): the diff of a copy would print the contents.
#
#   .env                 root:deploy 0640   all stacks
#   edge: cloudflared/   config.yml + credentials.json (tunnel), letsencrypt/ acme-webroot/
#         htpasswd       (direct)
#   ops:  dozzle/users.yml
#   staging: restore/key.txt (owner 10001, 0400; the backup container's uid)
#
# Values derived here win over the same name in the secrets (the lines are dropped first).
- name: Derived values for this stack
  ansible.builtin.set_fact:
    derived_env: '{{ derived_by_stack[stack] }}'
    dropped_keys: "{{ ['BACKUP_AGE_PRIVATE_KEY'] if stack == 'staging' else [] }}"
    # Read by the assert below and by deploy.yml (the bucket the app does not use).
    staging_active_raw: '{{ staging_active_raw_v }}'
    staging_bucket_other: '{{ staging_bucket_other_v }}'
  vars:
    staging_dir: "{{ staging_state_dir | default('/opt/biddaloy/staging') }}"
    # Missing or empty file = dev. Anything but dev|staging fails below (no guessing a database).
    staging_active_raw_v: "{{ lookup('ansible.builtin.file', staging_dir ~ '/active-db', errors='ignore') | default('', true) | join('') | trim }}"
    staging_active_db: "{{ staging_active_raw_v or 'dev' }}"
    staging_s3_base: "{{ (secret_env | default({})).get('staging', {}).get('S3_BUCKET', 'biddaloy') }}"
    # staging keeps the secret's bucket (it holds the existing db's files); dev gets <base>-dev.
    staging_bucket_active: "{{ staging_s3_base if staging_active_db == 'staging' else staging_s3_base ~ '-dev' }}"
    staging_bucket_other_v: "{{ staging_s3_base ~ '-dev' if staging_active_db == 'staging' else staging_s3_base }}"
    staging_loaded_raw: "{{ lookup('ansible.builtin.file', staging_dir ~ '/loaded-backup', errors='ignore') | default('', true) | join('') | trim }}"
    derived_by_stack:
      # prod/restore is empty (provision): log-archive's jobs container needs some key dir to mount.
      prod:
        {
          PG_TLS_DIR: '{{ project_dir }}/pg-tls',
          APP_VERSION: '{{ version }}',
          BACKUP_AGE_KEY_DIR: '{{ project_dir }}/restore',
        }
      # Staging runs on the active db (Epic 88 U1): dev (default) or staging, from the state file.
      # Its own bucket per db; the badge date is the last loaded backup (D9). PG_MEM 1536m (D8).
      staging:
        PG_TLS_DIR: '{{ project_dir }}/pg-tls'
        APP_VERSION: '{{ version }}'
        BACKUP_AGE_KEY_DIR: '{{ project_dir }}/restore'
        POSTGRES_DB: 'biddaloy_staging{{ "" if staging_active_db == "staging" else "_dev" }}'
        S3_BUCKET: '{{ staging_bucket_active }}'
        ENV_BADGE: '{{ staging_active_db | upper }}'
        ENV_BADGE_DATE: "{{ staging_loaded_raw if staging_loaded_raw is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}$') else '' }}"
        PG_MEM: 1536m
      demo: { PG_TLS_DIR: '{{ project_dir }}/pg-tls', APP_VERSION: '{{ version }}' }
      edge:
        EDGE_DIR: '{{ project_dir }}'
        # The nginx/ copy of the last edge deploy that passed nginx -t (deploy.yml), never the
        # live checkout: a deploy of another stack or a failed one must not change what nginx
        # renders when it restarts.
        REPO_DIR: '{{ project_dir }}/release'
        EDGE_TRUSTED_CIDR: '{{ edge_subnet_actual | default(edge_subnet) }}'
        LANDING_VERSION: '{{ version }}'
      ops: { OPS_DIR: '{{ project_dir }}' }

- name: Staging active db is dev or staging
  ansible.builtin.assert:
    that: staging_active_raw in ['', 'dev', 'staging']
    fail_msg: 'active-db must hold exactly dev or staging (or be missing)'
  when: stack == 'staging'

- name: Write the stack .env
  ansible.builtin.copy:
    content: |-
      {% set ns = namespace(t=secret_text[stack]) %}
      {% for k in (derived_env.keys() | list) + dropped_keys %}
      {% set ns.t = ns.t | regex_replace('(?m)^[ \t]*(export[ \t]+)?' ~ k ~ '[ \t]*=.*$', '') %}
      {% endfor %}
      {{ ns.t | regex_replace('\n{2,}', '\n') | trim | regex_replace(quote_from, quote_to) }}
      {% for k, v in derived_env.items() %}
      {{ k }}={{ v }}
      {% endfor %}
    dest: '{{ project_dir }}/.env'
    mode: '0640'
    owner: root
    group: '{{ deploy_user }}'
  vars:
    # compose expands $VAR in unquoted .env values; single quotes keep a secret literal. Values
    # that already start with a quote, or hold one, are left as the secret has them.
    quote_from: '(?m)^([A-Za-z_][A-Za-z0-9_]*)=([^''"\n][^''\n]*)$'
    quote_to: '\1=''\2'''
  diff: false
  no_log: true

- name: Staging restore key (the backup container reads it)
  ansible.builtin.copy:
    content: "{{ secret_env.staging.BACKUP_AGE_PRIVATE_KEY }}\n"
    dest: '{{ project_dir }}/restore/key.txt'
    owner: '10001'
    group: '10001'
    mode: '0400'
  diff: false
  no_log: true
  when: stack == 'staging'

- name: Dozzle users
  when: stack == 'ops'
  block:
    - name: Dozzle directory
      ansible.builtin.file:
        path: '{{ project_dir }}/dozzle'
        state: directory
        owner: root
        group: root
        mode: '0755'
    # The secret holds the whole users.yml on one line with \n for newlines.
    - name: Dozzle users.yml (bcrypt hashes)
      ansible.builtin.copy:
        content: "{{ secret_env.ops.DOZZLE_USERS_YML | replace('\\n', '\n') }}\n"
        dest: '{{ project_dir }}/dozzle/users.yml'
        owner: root
        group: root
        mode: '0644'
      diff: false
      no_log: true

- name: Edge files
  when: stack == 'edge'
  block:
    - name: Edge directories
      ansible.builtin.file:
        path: '{{ project_dir }}/{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: "{{ ['cloudflared'] if edge_mode == 'tunnel' else ['letsencrypt', 'acme-webroot'] }}"
    - name: Cloudflared config (tunnel mode)
      ansible.builtin.template:
        src: cloudflared-config.yml.j2
        dest: '{{ project_dir }}/cloudflared/config.yml'
        owner: root
        group: root
        mode: '0644'
      # deploy.yml recreates cloudflared when this or the credentials changed.
      register: cloudflared_config
      vars:
        tunnel_id: '{{ secret_env.edge.CLOUDFLARE_TUNNEL_ID }}'
        cf_access_team: '{{ secret_env.edge.CF_ACCESS_TEAM }}'
        aud_staging: '{{ secret_env.edge.CF_ACCESS_AUD_STAGING }}'
        aud_ops: '{{ secret_env.edge.CF_ACCESS_AUD_OPS }}'
      no_log: true
      when: edge_mode == 'tunnel'
    # cloudflared runs as uid 65532 inside its image.
    - name: Tunnel credentials (tunnel mode)
      ansible.builtin.copy:
        content: "{{ secret_env.edge.CLOUDFLARE_TUNNEL_CREDENTIALS_JSON }}\n"
        dest: '{{ project_dir }}/cloudflared/credentials.json'
        owner: '65532'
        group: '65532'
        mode: '0400'
      register: cloudflared_credentials
      diff: false
      no_log: true
      when: edge_mode == 'tunnel'
    # One bcrypt line per user (`htpasswd -nB user`); \n in the secret becomes a newline.
    # edge.direct.yml mounts this exact file path.
    - name: Basic-auth users (direct mode)
      ansible.builtin.copy:
        content: "{{ secret_env.edge.BASIC_AUTH_HTPASSWD | replace('\\n', '\n') }}\n"
        dest: '{{ project_dir }}/htpasswd'
        owner: root
        group: root
        mode: '0644'
      diff: false
      no_log: true
      when: edge_mode == 'direct'
