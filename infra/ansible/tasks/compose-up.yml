---
# Start (or recreate what changed in) the stack. Images are already pulled.
# Reads {{ project_dir }}/.env, so APP_VERSION there decides which images run.
#   up_services: names to start (default: everything the stack's profiles enable)
#   up_wait:     false for edge: cert-bootstrap exits on purpose and nginx has no peers to wait for
# --remove-orphans: a service dropped from the compose file goes away on the next deploy.
- name: Compose up {{ up_services | default('(all)') }}
  ansible.builtin.command: >-
    {{ dc }} up -d --remove-orphans
    {{ '--wait --wait-timeout 180' if up_wait | default(true) | bool else '' }}
    {{ up_services | default('') }}
  changed_when: true
