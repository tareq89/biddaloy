---
# Fresh Ubuntu LTS VM -> hardened Docker host. Safe to re-run (changed=0).
- name: Provision biddaloy host
  hosts: all
  become: true
  # deploy must exist before docker_users is applied by the docker role
  pre_tasks:
    - name: Deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
    - name: Operator key on deploy user
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ operator_ssh_pubkey }}"
        exclusive: true
    - name: Passwordless sudo for deploy (key-only login)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-deploy
        content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s
    # The security role turns off root and password login next. Prove the deploy
    # key works first, from the controller and without a shared SSH socket, so a
    # wrong key fails here instead of locking you out (README: keep a root
    # session open until the second run succeeds).
    - name: Prove deploy key login and sudo work before hardening
      ansible.builtin.command: >-
        ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ControlPath=none
        -p {{ hostvars[inventory_hostname].ansible_port | default(22) }}
        {{ deploy_user }}@{{ hostvars[inventory_hostname].ansible_host }} sudo -n true
      delegate_to: localhost
      become: false
      changed_when: false
  roles:
    - geerlingguy.security
    - geerlingguy.docker
  tasks:
    # Ubuntu's sshd_config includes sshd_config.d/*.conf first and sshd keeps the
    # first value it reads. Cloud images ship 50-cloud-init.conf with
    # PasswordAuthentication yes, which beats the role's sshd_config edits.
    # 00- sorts first; sshd -T then proves the effective values.
    - name: sshd drop-in that wins over cloud-init's
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-biddaloy.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        owner: root
        group: root
        mode: "0644"
        validate: sshd -t -f %s
      notify: restart ssh
    - name: Apply sshd changes now
      ansible.builtin.meta: flush_handlers
    - name: Effective sshd config
      ansible.builtin.command: sshd -T
      register: sshd_effective
      changed_when: false
    - name: Password and root login are really off
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd_effective.stdout_lines"
          - "'kbdinteractiveauthentication no' in sshd_effective.stdout_lines"
          - "'permitrootlogin no' in sshd_effective.stdout_lines"
        fail_msg: "sshd still allows password or root login: check /etc/ssh/sshd_config.d/"

    # Docker publishes ports straight through iptables, past ufw. Compose binds
    # everything except nginx to 127.0.0.1 (docker-compose.yml); the check at the
    # end of this play fails if anything else listens publicly.
    - name: ufw default deny incoming
      community.general.ufw:
        default: deny
        direction: incoming
    - name: ufw SSH (rate limited)
      community.general.ufw:
        rule: limit
        port: "22"
        proto: tcp
    - name: ufw HTTP/HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: [80, 443]
    - name: ufw on
      community.general.ufw:
        state: enabled

    - name: chrony installed
      ansible.builtin.apt:
        name: chrony
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: chrony running and enabled
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true
    - name: Timezone
      community.general.timezone:
        name: "{{ host_timezone }}"

    # The one owner model for /opt/biddaloy (tasks/write-env.yml writes into these
    # and creates no directories). root writes; deploy reads, because
    # `docker compose` reads <env>/.env on the client side, even for `exec`.
    #   <env>/       root:deploy 0750      <env>/.env  root:deploy 0640
    #   certs/       root:root   0700      certs/*     root:root   0600
    #   <env>/age-key.txt  10001 0400 (the backup container's uid; restore drill)
    - name: App directories
      ansible.builtin.file:
        path: "{{ biddaloy_root }}/{{ item }}"
        state: directory
        owner: root
        group: "{{ deploy_user }}"
        mode: "0750"
      loop: "{{ biddaloy_envs }}"
    - name: Certs directory (root only)
      ansible.builtin.file:
        path: "{{ biddaloy_root }}/certs"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # A plain `prune -af --filter until=168h` would also delete the previous
    # release, and a rollback (61.1) would then need GHCR. Our images carry
    # org.opencontainers.image.revision (publish-image.yml), so the age prune
    # skips them; the loop keeps the newest 4 per repo (in-use ones refuse rm).
    # ponytail: "newest 4" by build time, not "the previous prod release"; pin that in deploy.yml (61.1) if 4 is not enough.
    - name: Image prune script
      ansible.builtin.copy:
        dest: /usr/local/sbin/biddaloy-image-prune
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          for r in $(docker image ls --filter 'reference=ghcr.io/tareq89/*' --format '{% raw %}{{.Repository}}{% endraw %}' | sort -u); do
            docker image ls "$r" --format '{% raw %}{{.Repository}}:{{.Tag}}{% endraw %}' | tail -n +5 | xargs -r docker image rm >/dev/null 2>&1
          done
          docker image prune -af --filter until=168h --filter label!=org.opencontainers.image.revision
    - name: Weekly docker image prune
      ansible.builtin.cron:
        name: docker image prune
        weekday: "0"
        hour: "4"
        minute: "0"
        job: /usr/local/sbin/biddaloy-image-prune
    - name: Weekly docker builder prune
      ansible.builtin.cron:
        name: docker builder prune
        weekday: "0"
        hour: "4"
        minute: "5"
        job: docker builder prune -af

    # Meaningful once deploy.yml (61.1) has started the stacks; on a fresh VM
    # nothing is published yet. With -t and -u, ss adds a Netid column first.
    - name: Listening TCP and UDP sockets
      ansible.builtin.command: ss -H -tuln
      register: listening
      changed_when: false
    - name: Fail if anything but the allowed ports listens publicly
      ansible.builtin.assert:
        that:
          - >-
            item.split()[4] is match('^(127\.|\[::1\])')
            or (item.split()[4].rsplit(':', 1)[1] | int) in
            (allowed_public_tcp_ports if item.split()[0] == 'tcp' else allowed_public_udp_ports)
        fail_msg: "Unexpected public listener: {{ item.split()[0] }} {{ item.split()[4] }}"
        quiet: true
      loop: "{{ listening.stdout_lines }}"
