# Encrypts infra/secrets/*.enc.(env|pem) to three age public keys: operator, recovery and the
# host (P5). Public keys only: safe to commit. Replace the three placeholders (README step 3)
# BEFORE running `sops` for the first time. After replacing them on files that already exist,
# run `sops updatekeys infra/secrets/<file>` for each.
creation_rules:
  - path_regex: infra/secrets/.*\.enc\.(env|pem)$
    age: >-
      age14ha6kg4lhmt5v8nq8aaxnfgay7rftpfp8kugsp54dj724mfrtens6cl7ek,
      age1d2pektdt7gh9tdzpjwg4v788lfuvvctg6krspqz8wznfq0yf9f8s6pxky6,
      age10mffhj27pgnsqejrrxtrmxn5rzyv5d56624j4qfscv3nml647vps3dvzzn
