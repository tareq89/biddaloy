# Encrypts infra/secrets/*.enc.(env|pem) to two age public keys (D7).
# Public keys only: safe to commit. Replace both placeholders (README step 3)
# BEFORE running `sops` for the first time.
creation_rules:
  - path_regex: infra/secrets/.*\.enc\.(env|pem)$
    age: age1REPLACE_WITH_OPERATOR_PUBLIC_KEY,age1REPLACE_WITH_RECOVERY_PUBLIC_KEY
