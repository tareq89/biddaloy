# Direct edge mode (D8, D18): nginx owns 80 and 443, Let's Encrypt HTTP-01, no Cloudflare.
# Use on top of edge.yml with EDGE_MODE=direct:
#
#   docker compose -p edge -f deploy/edge.yml -f deploy/edge.direct.yml up -d
x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  nginx:
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ${EDGE_DIR:?EDGE_DIR must be set}/letsencrypt:/etc/letsencrypt:ro
      - ${EDGE_DIR}/acme-webroot:/var/www/acme:ro

  # Renews twice a day (a no-op until a cert is due), then touches the flag that
  # nginx/reload-loop.sh watches so nginx picks up the new cert.
  certbot:
    logging: *logging
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - 'while :; do certbot renew --webroot -w /var/www/acme --deploy-hook "touch /var/www/acme/.reload"; sleep 12h; done'
    volumes:
      - ${EDGE_DIR}/letsencrypt:/etc/letsencrypt
      - ${EDGE_DIR}/acme-webroot:/var/www/acme

  cloudflared:
    profiles: [disabled]
