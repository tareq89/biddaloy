# Direct edge mode (D8, D18): nginx owns 80 and 443, Let's Encrypt HTTP-01, no Cloudflare.
# Use on top of edge.yml with EDGE_MODE=direct:
#
#   docker compose -p edge -f deploy/edge.yml -f deploy/edge.direct.yml up -d
x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  nginx:
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ${EDGE_DIR:?EDGE_DIR must be set}/letsencrypt:/etc/letsencrypt:ro
      - ${EDGE_DIR}/acme-webroot:/var/www/acme:ro
      # Basic-auth users for staging / ops hosts: `htpasswd -B ${EDGE_DIR}/htpasswd <user>`.
      - ${EDGE_DIR}/htpasswd:/etc/nginx/auth/htpasswd:ro
    depends_on:
      cert-bootstrap:
        condition: service_completed_successfully

  # nginx will not boot without the certificate edge-mode.sh points at. On a fresh host this
  # writes a 30-day self-signed one for APP_DOMAIN (a no-op when a cert exists). Once nginx
  # is up, delete the placeholder (sudo rm -r /opt/biddaloy/edge/letsencrypt/live/<app domain>),
  # issue the real one (the certbot container has LETSENCRYPT_EMAIL and APP_DOMAIN from the edge
  # .env; add -d for every other hostname), then the certbot loop below keeps it renewed:
  #   docker exec edge-certbot-1 sh -c 'certbot certonly --webroot -w /var/www/acme -n --agree-tos \
  #     -m "$LETSENCRYPT_EMAIL" --cert-name "$APP_DOMAIN" -d "$APP_DOMAIN" -d <staging domain> -d <inbox-demo domain> -d <inbox-staging domain> ... --force-renewal'
  cert-bootstrap:
    logging: *logging
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    restart: 'no'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
    entrypoint:
      - sh
      - -c
      - |
        d=/etc/letsencrypt/live/$$APP_DOMAIN
        [ -f $$d/fullchain.pem ] && exit 0
        mkdir -p $$d
        openssl req -x509 -nodes -newkey rsa:2048 -days 30 -subj "/CN=$$APP_DOMAIN" \
          -keyout $$d/privkey.pem -out $$d/fullchain.pem
    volumes:
      - ${EDGE_DIR}/letsencrypt:/etc/letsencrypt

  # Renews twice a day (a no-op until a cert is due), then touches the flag that
  # nginx/reload-loop.sh watches so nginx picks up the new cert.
  certbot:
    logging: *logging
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - 'while :; do certbot renew --webroot -w /var/www/acme --deploy-hook "touch /var/www/acme/.reload"; sleep 12h; done'
    # For the first `certbot certonly` (comment above). Required in direct mode (deploy pre-flight).
    environment:
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
    volumes:
      - ${EDGE_DIR}/letsencrypt:/etc/letsencrypt
      - ${EDGE_DIR}/acme-webroot:/var/www/acme

  cloudflared:
    profiles: [disabled]
