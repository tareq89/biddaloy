# Local build of deploy/stack.yml: builds the images instead of pulling them from GHCR.
# Paths are relative to deploy/ (the directory of the first -f file).
#
#   ENV_NAME=local APP_VERSION=local docker compose -p local -f deploy/stack.yml -f docker-compose.build.yml build
#
# Needs a current Docker Compose for `service:` contexts: 2.20.2 reads them as a folder path.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile

  backup:
    build:
      context: ../scripts/backup
      dockerfile: Dockerfile

  jobs:
    build:
      context: ../scripts/backup
      dockerfile: Dockerfile

  demo-reset:
    build:
      context: ../scripts/demo
      dockerfile: Dockerfile
      # `FROM app` in the Dockerfile is the `app` service's image, built first and fresh.
      # `backup` gives the demo image db-swap.sh (W1.05).
      additional_contexts:
        app: service:app
        backup: ../scripts/backup
