# Staging overlay (Epic 59 #1768). Use with the base file, as its own project:
#
#   docker compose --project-directory /opt/biddaloy/staging -p biddaloy-staging \
#     -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# (infra/ansible/deploy.yml -e env=staging does this.) Needs Docker Compose >= 2.24 for `!reset`.
#
# Same images as prod, own db / redis / seaweedfs volumes (project name = volume prefix).
# Prod's nginx fronts staging.<domain> (nginx/templates/staging.conf.template), so this
# project runs NO nginx and binds NO host ports.
#
# Staging must never message real people (D25), so the app runs DEMO_MODE=true: every
# SMS / WhatsApp / email / messenger goes to the log, whatever a school's own settings say.
# `yarn config:check --env staging` also refuses provider keys in the host .env.
#
# Host .env (infra/secrets/staging.enc.env) must set, and config:check --env staging enforces:
#   POSTGRES_DB=biddaloy_staging  S3_BUCKET=biddaloy-staging  DEMO_PASSWORD=...
#   TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA   (Cloudflare's always-pass test secret)

services:
  app:
    container_name: biddaloy-staging-app
    environment:
      DEMO_MODE: 'true'
      DEMO_PASSWORD: ${DEMO_PASSWORD:?DEMO_PASSWORD must be set}
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/biddaloy_staging
      S3_BUCKET: biddaloy-staging
      # Staging has no platform alert channel: the base default would pick greenweb.
      PLATFORM_SMS_API_KEY: ''
      PLATFORM_ALERT_PHONES: ''

  seaweedfs:
    environment:
      S3_BUCKET: biddaloy-staging
    # Prod owns 127.0.0.1:9000 / 5432 / 6379 on this host.
    ports: !reset []

  db:
    ports: !reset []

  redis:
    ports: !reset []

  # Prod's nginx serves staging. No second nginx, no second 443.
  nginx:
    profiles: [disabled]

  # Staging data is a re-seedable demo school: nothing to back up.
  backup:
    profiles: [disabled]
